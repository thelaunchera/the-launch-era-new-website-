    @media(min-width:760px){.hero{grid-template-columns:1.08fr .92fr}.books{grid-template-columns:repeat(3,1fr)}.gallery{grid-template-columns:repeat(4,minmax(0,1fr))}.access{grid-template-columns:1fr 1fr;align-items:center}.access-list{grid-template-columns:1fr 1fr}}

<body>
  <div class="announce" data-i18n="announce"></div>
  <header>

  <main>
    <section class="hero">

      <div class="stat"><b data-i18n="noZip"></b><span data-i18n="statFormat"></span></div>

      <div class="access-list"><span data-i18n="a1"></span><span data-i18n="a2"></span><span data-i18n="a3"></span><span data-i18n="a4"></span></div>
    </section>
  </main>

  <footer><img src="/pop-and-peel/assets/logo.svg" alt="Pop & Peel Studio"><p><a href="mailto:hello@thelaunchera.com">hello@thelaunchera.com</a></p><small>Powered by The Launch Era</small></footer>

  <dialog id="reader" aria-labelledby="readerHeading">
    <div class="reader">
      <div class="reader-top"><button class="close" id="close" type="button" aria-label="Close">×</button><div class="reader-title"><b id="readerHeading"></b><small id="pageNumber"></small></div><a class="button green unlock" href="#access" id="unlock" data-i18n="unlock"></a></div>
      <div class="reader-stage" id="stage"><button class="arrow prev" id="prev" type="button" aria-label="Previous">‹</button><div class="reader-page"><img id="pageImage" alt=""></div><button class="arrow next" id="next" type="button" aria-label="Next">›</button></div>
      <div class="reader-bottom"><div class="progress"><span id="progress"></span></div><div class="thumbs" id="thumbs"></div></div>
    </div>
  </dialog>

  <script>
  const COPY={
    en:{announce:'Interactive previews · Original files unlock after purchase',navBooks:'Collections',navAll:'View all',navAccess:'How access works',eyebrow:'No ZIP files',hero:'Sticker books you can explore.',heroText:'Open each collection like a digital publication. Browse every design by category, swipe through the pages and preview each sticker before launch.',explore:'Explore the books',how:'How it works',statCategories:'organized categories',statDesigns:'sticker previews',noZip:'NO ZIP',statFormat:'interactive access',shelfTag:'The digital shelf',shelfTitle:'Choose a collection',shelfText:'Every collection opens as its own mobile-friendly publication. Tap a cover to start turning the pages.',allTag:'Complete preview library',allTitle:'All stickers by category',allText:'Filter the complete collection or search by name. Every image here is a protected preview.',searchLabel:'Search stickers',searchPlaceholder:'Search stickers…',all:'All',open:'Open publication',designs:'designs',individual:'Individual sticker',collection:'Sticker sheet',empty:'No stickers found in this category.',accessTag:'Delivery without ZIP files',accessTitle:'One link. Every sticker.',accessText:'After purchase, the same publication will unlock the original transparent sticker files and printable pages. Customers will not need to download or unzip a folder.',notify:'Join the launch list',a1:'Tap a sticker and save it individually',a2:'Use it in Canva, Goodnotes or digital projects',a3:'Open printable pages without unpacking files',a4:'Return to the private publication from any device',unlock:'Unlock at launch',page:'Page'},
    es:{announce:'Vistas previas interactivas · Los originales se desbloquean después de comprar',navBooks:'Colecciones',navAll:'Ver todos',navAccess:'Cómo funciona',eyebrow:'Sin archivos ZIP',hero:'Libros de stickers para explorar.',heroText:'Abre cada colección como una publicación digital. Explora todos los diseños por categoría, desliza las páginas y mira cada sticker antes del lanzamiento.',explore:'Explorar los libros',how:'Cómo funciona',statCategories:'categorías organizadas',statDesigns:'vistas de stickers',noZip:'SIN ZIP',statFormat:'acceso interactivo',shelfTag:'La biblioteca digital',shelfTitle:'Elige una colección',shelfText:'Cada colección abre como su propia publicación para móvil. Toca una portada para comenzar a pasar las páginas.',allTag:'Biblioteca completa',allTitle:'Todos los stickers por categoría',allText:'Filtra la colección completa o busca por nombre. Todas las imágenes son vistas previas protegidas.',searchLabel:'Buscar stickers',searchPlaceholder:'Buscar stickers…',all:'Todos',open:'Abrir publicación',designs:'diseños',individual:'Sticker individual',collection:'Hoja de stickers',empty:'No encontramos stickers en esta categoría.',accessTag:'Entrega sin archivos ZIP',accessTitle:'Un enlace. Todos tus stickers.',accessText:'Después de comprar, la misma publicación desbloqueará los stickers originales transparentes y las páginas imprimibles. El cliente no tendrá que descargar ni descomprimir carpetas.',notify:'Unirme a la lista',a1:'Toca un sticker y guárdalo individualmente',a2:'Úsalo en Canva, Goodnotes o proyectos digitales',a3:'Abre páginas imprimibles sin descomprimir archivos',a4:'Regresa a la publicación privada desde cualquier dispositivo',unlock:'Disponible al lanzar',page:'Página'}
  };
  const CATS={
    cuban:{en:['Cuban Kitchen & Culture','Food, cafecito and nostalgic Cuban details.'],es:['Cocina y cultura cubana','Comida, cafecito y detalles cubanos llenos de nostalgia.'],color:'#ffd83d'},
    cleaning:{en:['Cleaning Business','Tools, routes, homes and small-business moments.'],es:['Negocios de limpieza','Herramientas, rutas, hogares y momentos de pequeños negocios.'],color:'#bfeaff'},
    wellness:{en:['Pilates & Wellness','Movement, routines, matcha and soft-life energy.'],es:['Pilates y bienestar','Movimiento, rutinas, matcha y energía soft life.'],color:'#ffacd0'},
    seasonal:{en:['Seasons & Celebrations','Holidays and special moments throughout the year.'],es:['Temporadas y celebraciones','Festividades y momentos especiales durante todo el año.'],color:'#bff4d5'},
    creator:{en:['Business & Creator','Branding, content and creative-work stickers.'],es:['Negocios y creadores','Stickers para branding, contenido y trabajo creativo.'],color:'#dfccff'},
    avatars:{en:['Avatar Collection','Expressive characters and portrait styles.'],es:['Colección de avatares','Personajes expresivos y diferentes estilos de retratos.'],color:'#ffe2b8'}
  };
  const ORDER=['cuban','cleaning','wellness','seasonal','creator','avatars'];
  const $=s=>document.querySelector(s);let items=[],lang=(localStorage.getItem('popPeelStickerLang')||((navigator.language||'en').startsWith('es')?'es':'en'));let active='cuban',query='',readerItems=[],readerIndex=0,touchStart=0;window.POP_PEEL_PREVIEWS=window.POP_PEEL_PREVIEWS||{};const loadedChunks=new Set(),pendingChunks=new Map();
  const t=k=>COPY[lang][k];const catText=(key,index=0)=>CATS[key][lang][index];
  function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
  const assetSrc=item=>window.POP_PEEL_PREVIEWS[item.id]||'';
  function loadChunk(name){if(loadedChunks.has(name))return Promise.resolve();if(pendingChunks.has(name))return pendingChunks.get(name);const request=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=`assets/data/${name}.js`;script.onload=()=>{loadedChunks.add(name);pendingChunks.delete(name);resolve()};script.onerror=()=>{pendingChunks.delete(name);reject(new Error(`Could not load ${name}`))};document.head.appendChild(script)});pendingChunks.set(name,request);return request}
  function ensureCategory(category,all=true){const chunks=[...new Set(group(category).map(i=>i.chunk))];return Promise.all((all?chunks:chunks.slice(0,1)).map(loadChunk))}
  function ensureAll(){return Promise.all(ORDER.map(category=>ensureCategory(category,true)))}
  function applyLanguage(){document.documentElement.lang=lang;localStorage.setItem('popPeelStickerLang',lang);document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>el.placeholder=t(el.dataset.i18nPlaceholder));$('#lang').textContent=lang==='en'?'ES':'EN';renderBooks();renderFilters();renderGallery();if($('#reader').open)renderReader()}
  function group(key){return items.filter(i=>i.category===key)}
  function renderHero(){const chosen=[group('cuban')[2],group('cleaning')[2],group('seasonal')[0]].filter(Boolean);$('#heroArt').innerHTML=`<div class="stack">${chosen.map(i=>`<img src="${assetSrc(i)}" alt="">`).join('')}</div>`}
  function renderBooks(){if(!items.length)return;$('#bookShelf').innerHTML=ORDER.map(key=>{const list=group(key),pics=list.slice(0,4);return `<button class="book" style="--cover:${CATS[key].color}" data-book="${key}"><span class="book-collage">${pics.map(i=>`<img src="${assetSrc(i)}" alt="" loading="lazy">`).join('')}</span><span class="book-info"><h3>${esc(catText(key))}</h3><p>${esc(catText(key,1))}</p><span class="count">${list.length} ${t('designs')}</span></span></button>`}).join('')}
  function renderFilters(){const buttons=['all',...ORDER];$('#filters').innerHTML=buttons.map(key=>`<button class="filter ${active===key?'on':''}" data-filter="${key}">${key==='all'?t('all'):esc(catText(key))}</button>`).join('')}
  function visible(){return items.filter(i=>(active==='all'||i.category===active)&&(!query||i.title.toLowerCase().includes(query)))}
  function renderGallery(){if(!items.length)return;const list=visible();$('#gallery').innerHTML=list.length?list.map(i=>`<button class="tile" data-open="${i.id}"><img src="${assetSrc(i)}" alt="${esc(i.title)}" loading="lazy"><b>${esc(i.title)}</b></button>`).join(''):`<p class="empty">${t('empty')}</p>`}
  function openBook(category,startId){readerItems=group(category);readerIndex=Math.max(0,startId?readerItems.findIndex(i=>i.id===startId):0);if(readerIndex<0)readerIndex=0;renderReader();if(!$('#reader').open)$('#reader').showModal();document.body.style.overflow='hidden'}
  function renderReader(){if(!readerItems.length)return;const item=readerItems[readerIndex];$('#readerHeading').textContent=item.title;$('#pageNumber').textContent=`${catText(item.category)} · ${t('page')} ${readerIndex+1} / ${readerItems.length}`;$('#pageImage').src=assetSrc(item);$('#pageImage').alt=item.title;$('#progress').style.width=`${((readerIndex+1)/readerItems.length)*100}%`;$('#prev').disabled=readerIndex===0;$('#next').disabled=readerIndex===readerItems.length-1;$('#thumbs').innerHTML=readerItems.map((i,n)=>`<button class="thumb ${n===readerIndex?'on':''}" data-page="${n}" aria-label="${esc(i.title)}"><img src="${assetSrc(i)}" alt="" loading="lazy"></button>`).join('');const on=$('#thumbs .on');if(on)on.scrollIntoView({block:'nearest',inline:'center'});history.replaceState(null,'',`#${item.category}/${item.id}`)}
  function closeReader(){if($('#reader').open)$('#reader').close();document.body.style.overflow='';history.replaceState(null,'',location.pathname)}
  function move(delta){const next=Math.min(readerItems.length-1,Math.max(0,readerIndex+delta));if(next!==readerIndex){readerIndex=next;renderReader()}}
  document.addEventListener('click',async e=>{const book=e.target.closest('[data-book]');if(book){await ensureCategory(book.dataset.book,true);openBook(book.dataset.book);return}const filter=e.target.closest('[data-filter]');if(filter){active=filter.dataset.filter;filter.disabled=true;await(active==='all'?ensureAll():ensureCategory(active,true));filter.disabled=false;renderFilters();renderGallery();return}const open=e.target.closest('[data-open]');if(open){const item=items.find(i=>i.id===open.dataset.open);if(item){await ensureCategory(item.category,true);openBook(item.category,item.id)}return}const page=e.target.closest('[data-page]');if(page){readerIndex=Number(page.dataset.page);renderReader()}});
  $('#lang').addEventListener('click',()=>{lang=lang==='en'?'es':'en';applyLanguage()});$('#search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();renderGallery()});$('#close').addEventListener('click',closeReader);$('#prev').addEventListener('click',()=>move(-1));$('#next').addEventListener('click',()=>move(1));$('#unlock').addEventListener('click',closeReader);$('#reader').addEventListener('click',e=>{if(e.target===$('#reader'))closeReader()});document.addEventListener('keydown',e=>{if(!$('#reader').open)return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key==='Escape')closeReader()});$('#stage').addEventListener('touchstart',e=>touchStart=e.changedTouches[0].clientX,{passive:true});$('#stage').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchStart;if(Math.abs(dx)>45)move(dx<0?1:-1)},{passive:true});
  fetch('manifest.json').then(r=>{if(!r.ok)throw new Error('Manifest unavailable');return r.json()}).then(async data=>{items=data;$('#total').textContent=items.length;await Promise.all(ORDER.map(category=>ensureCategory(category,false)));renderHero();applyLanguage();await ensureCategory(active,true);renderGallery();const hash=location.hash.slice(1).split('/');if(CATS[hash[0]]){await ensureCategory(hash[0],true);openBook(hash[0],hash[1])}}).catch(()=>{$('#gallery').innerHTML='<p class="empty">The preview library could not load.</p>'});
  </script>

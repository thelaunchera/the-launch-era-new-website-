<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Secure checkout | The Launch Era</title><script src="/assets/privacy-controls.js?v=20261026-1" data-site="tle"></script><style>:root{--ink:#191919;--ivory:#FAF8F3;--yellow:#F2D85B}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--ivory);color:var(--ink);font:15px/1.6 system-ui,sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(520px,100%);padding:clamp(24px,5vw,44px);background:white;border:1px solid #ddd9d0}.brand{font-weight:800;letter-spacing:.12em;font-size:12px}.kicker{display:inline-block;background:var(--yellow);font-size:11px;font-weight:800;padding:8px 12px;margin:25px 0 14px}h1{font-size:clamp(32px,7vw,42px);line-height:1.13;letter-spacing:-.055em;margin:0 0 14px}p{color:#545454}button,a.back{display:inline-flex;background:var(--ink);color:white;padding:14px 21px;border-radius:999px;border:0;font:700 14px system-ui,sans-serif;text-decoration:none;cursor:pointer;min-height:48px}#retry{margin-top:22px}.note{font-size:12px;color:#636363;margin-top:18px}a:focus-visible,button:focus-visible{outline:3px solid #28739b;outline-offset:4px}.loading{display:inline-flex;gap:8px;margin-top:15px}.loading i{width:7px;height:7px;background:var(--ink);border-radius:50%;animation:pulse 1s ease-in-out infinite}.loading i:nth-child(2){animation-delay:.2s}.loading i:nth-child(3){animation-delay:.4s}@keyframes pulse{50%{opacity:.15}}[hidden]{display:none!important}@media(prefers-reduced-motion:reduce){.loading i{animation:none}}</style></head><body><main class="card"><div class="brand">THE LAUNCH ERA</div><span class="kicker" id="package">WEBSITE PACKAGES</span><h1 id="title">Opening secure checkout…</h1><p id="copy">Connecting to Stripe checkout.</p><div class="loading" id="loading"><i></i><i></i><i></i></div><button hidden id="retry" type="button">Try again</button><p class="note" id="note">Package prices are for the agreed initial setup. Any necessary third-party hosting or AI fees are reviewed before work begins.</p><a class="back" id="back" href="/website-for-your-business/" hidden>Back to packages</a></main><script>
const endpoint='https://bowacxhmjvrqixtwaikv.supabase.co/functions/v1/create-tle-service-checkout';
const qs=new URLSearchParams(location.search);
const offer=String(qs.get('offer')||'').trim().toLowerCase(),es=qs.get('lang')==='es';
const offers={
 'website-basic':{en:'Website for Your Business · $15',es:'Website para tu negocio · $15'},
 'website-ai-crm':{en:'Website + AI Assistant + Automated CRM · $25',es:'Website + Asistente IA + CRM automatizado · $25'}
};
const el=id=>document.getElementById(id);
document.documentElement.lang=es?'es':'en';
el('back').href=es?'/es/website-for-your-business/':'/website-for-your-business';
el('back').textContent=es?'Volver a los paquetes':'Back to packages';
el('retry').textContent=es?'Intentar de nuevo':'Try again';
el('note').textContent=es?'Los precios cubren la configuración inicial acordada. Informamos cualquier costo externo necesario de hosting o IA antes de comenzar.':'The prices cover agreed initial setup. Any required external hosting or AI costs are disclosed before work begins.';
function fail(message){
 el('loading').hidden=true;el('retry').hidden=true;el('back').hidden=false;
 el('title').textContent=es?'No podemos abrir este pago.':'Unable to open this checkout.';
 el('copy').textContent=message;
}
if(!offers[offer])fail(es?'Este enlace ya no está disponible. Consulta los paquetes actuales.':'This link is no longer available. Please choose a current package.');
else{
 el('package').textContent=offers[offer][es?'es':'en'];
 const go=async()=>{
   el('retry').hidden=true;el('back').hidden=true;el('loading').hidden=false;
   el('title').textContent=es?'Abriendo el pago seguro…':'Opening secure checkout…';
   el('copy').textContent=es?'Te llevamos a Stripe.':'Connecting you to Stripe.';
   try{
    const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({offer,language:es?'es':'en'})});
    const data=await res.json().catch(()=>({}));
    const expected=offer==='website-basic'?1500:2500;
    if(!res.ok||!data.url||!/^https:\/\/(checkout|buy)\.stripe\.com\//.test(data.url)||Number(data.amount_total)!==expected)throw Error('bad checkout response');
    location.replace(data.url);
   }catch{
    el('loading').hidden=true;el('title').textContent=es?'No pudimos abrir el pago.':'We could not open checkout.';
    el('copy').textContent=es?'No se ha realizado ningún cobro desde esta pantalla. Inténtalo de nuevo o contáctanos.':'No payment was made on this page. Try again or contact us.';
    el('retry').hidden=false;el('back').hidden=false;
   }
 };
 el('retry').onclick=go;void go();
}
</script></body></html>

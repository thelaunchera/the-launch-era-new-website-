<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Opening secure checkout — The Launch Era</title>
<style>
:root{--ivory:#FBFAF6;--ink:#242424;--yellow:#F6E9A8;--blue:#CFE5F7;--purple:#6E5AA8;--muted:#6f6a63;--line:#d8d6d0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--ivory);color:var(--ink);font-family:Arial,sans-serif}.card{width:min(520px,100%);background:#fff;border:1px solid var(--line);padding:34px;border-radius:24px;box-shadow:0 20px 55px rgba(0,0,0,.07)}.brand{font-size:12px;font-weight:800;letter-spacing:.08em}.kicker{display:inline-flex;margin:24px 0 10px;padding:7px 10px;border-radius:999px;background:var(--yellow);font-size:11px;font-weight:800}h1{font-size:34px;line-height:1.05;margin:0 0 12px}p{color:var(--muted);line-height:1.6}.dots{display:flex;gap:6px;margin:22px 0}.dots span{width:8px;height:8px;border-radius:50%;background:var(--purple);animation:pulse 1s infinite ease-in-out}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}@keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}button{width:100%;border:0;border-radius:999px;background:var(--ink);color:#fff;padding:14px 18px;font-weight:800;font-size:15px;cursor:pointer}[hidden]{display:none!important}button[hidden]{display:none}.small{font-size:12px;color:var(--muted);margin-top:14px}

/* TLE visual system — 2026-10-05 */
body{background:linear-gradient(180deg,#FFFFFF 0%,#F5FAFC 100%)}
</style>
<link rel="stylesheet" href="/assets/tle-mobile.css?v=20261009"></head>
<body data-tle-page="checkout"><main class="card"><div class="brand">THE LAUNCH ERA</div><div class="kicker" id="kicker">SECURE CHECKOUT</div><h1 id="title">Taking you to secure checkout…</h1><p id="copy">Your payment page is opening.</p><div class="dots" id="dots"><span></span><span></span><span></span></div><button id="retry" hidden>Try again</button><div class="small" id="status">After payment, complete your setup form. We review your details first and email you when your estimated 48-hour production period starts. Check your Inbox, Promotions and Spam.</div></main>
<script>
const endpoint="https://bowacxhmjvrqixtwaikv.supabase.co/functions/v1/create-tle-service-checkout";
const params=new URLSearchParams(location.search);
const rawOffer=(params.get("offer")||"").toLowerCase();
const offer=rawOffer;
let es=params.get("lang")==="es";
let trafficSource=(params.get("source")||"").trim().toLowerCase();try{trafficSource=trafficSource||sessionStorage.getItem("tleTrafficSource")||"direct";sessionStorage.setItem("tleTrafficSource",trafficSource)}catch{trafficSource=trafficSource||"direct"}

const bookingSaleEnd=new Date("2026-11-01T04:00:00Z").getTime();
const bookingPrice="$19.99";
const allowed={"booking-flow":(Date.now()<bookingSaleEnd?"The Fall Refresh Offer · ":"")+"Booking Automation + Command Center · "+bookingPrice,"website-automation":"Website Automation · $41.99",va:"Virtual Assistant · $34.99/month","ai-booking":"AI Booking Assistant · $79 setup, then $29/month after the first 30 days from delivery","ai-followup":"AI Follow-Up Assistant · $59 setup, then $19/month after the first 30 days from delivery","ai-business":"AI Business Assistant (both) · $119 setup, then $39/month after the first 30 days from delivery"};
const allowedEs={"booking-flow":(Date.now()<bookingSaleEnd?"Oferta Fall Refresh · ":"")+"Booking Automation + Command Center · "+bookingPrice,"website-automation":"Website Automation · $41.99",va:"Virtual Assistant · $34.99/mes","ai-booking":"AI Booking Assistant · $79 de instalación y luego $29/mes después de los primeros 30 días desde la entrega","ai-followup":"AI Follow-Up Assistant · $59 de instalación y luego $19/mes después de los primeros 30 días desde la entrega","ai-business":"AI Business Assistant (ambos) · $119 de instalación y luego $39/mes después de los primeros 30 días desde la entrega"};
const kicker=document.getElementById("kicker"),title=document.getElementById("title"),copy=document.getElementById("copy"),dots=document.getElementById("dots"),retry=document.getElementById("retry"),status=document.getElementById("status");
document.documentElement.lang=es?"es":"en";document.title=es?"Abriendo pago seguro — The Launch Era":"Opening secure checkout — The Launch Era";
if(!allowed[offer]){
 dots.hidden=true;
 title.textContent=es?"Este enlace de pago no es válido.":"This checkout link is invalid.";
 copy.textContent=es?"Vuelve a The Launch Era y elige tu servicio otra vez.":"Go back to The Launch Era and choose your service again.";
 status.textContent="";

}else{
 kicker.textContent=(es?allowedEs[offer]:allowed[offer]);
 title.textContent=es?"Abriendo tu pago seguro…":"Taking you to secure checkout…";
 copy.textContent=es?"Te llevamos a la página de pago seguro.":"We’re opening your payment page now.";
 status.textContent=es?"Después del pago, completa el formulario. Primero revisaremos tus datos y te enviaremos otro correo cuando comience la producción estimada de 48 horas. Revisa tu bandeja, Promociones y Spam.":"Once we review and approve your completed setup, we will email you when the estimated 48-hour production period begins. Check Promotions or Spam if our email is missing.";
}
async function openCheckout(){
 if(!allowed[offer])return;
 try{sessionStorage.setItem("tleCheckoutLanguage",es?"es":"en")}catch{}
 document.documentElement.lang=es?"es":"en";
 retry.hidden=true;dots.hidden=false;
 title.textContent=es?"Abriendo tu pago seguro…":"Taking you to secure checkout…";
 copy.textContent=es?"Te llevamos a la página de pago seguro.":"We’re taking you to the secure payment page.";
 status.textContent=es?"Revisaremos tus datos y el formulario después de confirmar el pago. Recibirás un correo cuando aprobemos el inicio de la producción estimada de 48 horas. Revisa tu correo después de pagar.":"After payment and our review of your completed setup, we will email you when your estimated 48-hour production period begins. Check your inbox after paying.";
 try{
  const res=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({offer,language:es?"es":"en",source:trafficSource})});
  const data=await res.json().catch(()=>({}));
  if(!res.ok||!data.url||!/^https:\/\/(checkout\.stripe\.com|buy\.stripe\.com)\//.test(data.url))throw new Error("checkout");
  location.replace(data.url);
 }catch(e){
  dots.hidden=true;
  title.textContent=es?"No pudimos abrir el pago.":"We couldn't open checkout.";
  copy.textContent=es?"No se hizo ningún cobro. Puedes intentarlo de nuevo.":"No charge was made. You can try again.";
  status.textContent=es?"Puedes intentarlo de nuevo.":"You can try again.";
  retry.textContent=es?"Intentar de nuevo":"Try again";
  retry.hidden=false;
 }
}
retry.onclick=openCheckout;
openCheckout();

</script></body></html>

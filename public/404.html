<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#FAF8F3">
<title>Page not found | The Launch Era</title>
<script src="/assets/privacy-controls.js?v=20261026-1" data-site="tle"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:flex;justify-content:center;align-items:center;background:#FAF8F3;color:#191919;font-family:'Futura','DM Sans',Arial,Helvetica,sans-serif;padding:24px}
main{width:min(100%,640px);padding:clamp(26px,6vw,54px);background:#fff;border:1px solid #e6e7e5;border-radius:24px;box-shadow:0 16px 48px rgba(25,25,25,.06)}
.logo{font-size:13px;letter-spacing:.15em;font-weight:850}.tag{font-size:12px;letter-spacing:.14em;color:#456b82;margin:30px 0 13px;text-transform:uppercase;font-weight:700}
h1{font-family:Prompt,'DM Sans',Arial,sans-serif;font-size:clamp(29px,6vw,45px);line-height:1.12;margin:0 0 15px;letter-spacing:-.02em;font-weight:600}p{font-size:16px;line-height:1.6;color:#45545c;margin:0 0 13px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
a{display:inline-flex;align-items:center;justify-content:center;text-align:center;min-height:48px;padding:12px 18px;border-radius:999px;font-weight:750;font-size:14px;text-decoration:none;background:#CFE9F7;color:#191919}
a.secondary{background:#FAF8F3;border:1px solid #d6e3e9}a:focus-visible{outline:3px solid #487b9a;outline-offset:3px}
footer{font-size:12px;color:#69747a;margin-top:26px;line-height:1.6}
@media(max-width:420px){main{padding:26px 22px}.actions a{width:100%}}
</style>
<script>
(function(){
  if(!location.pathname.startsWith('/es/'))return;
  document.documentElement.lang='es';
  document.addEventListener('DOMContentLoaded',function(){
    document.title='Página no encontrada | The Launch Era';
    var labels={tag:'Esta página no está disponible',heading:'No encontramos esa página.',copy:'Puede que el enlace esté incompleto o ya no exista. Puedes regresar al inicio o escribirnos para encontrar lo que necesitas.',home:'Volver al inicio',help:'Abrir formulario de contacto',note:'The Launch Era · Herramientas para negocios de limpieza en EE. UU.'};
    Object.keys(labels).forEach(function(id){var el=document.getElementById(id);if(el)el.textContent=labels[id]});
    document.getElementById('home-link').href='/es';
    document.getElementById('help-link').href='/es#contacto';
  });
})();
</script>
</head>
<body>
<main>
  <div class="logo">THE LAUNCH ERA</div>
  <div class="tag" id="tag">This page is unavailable</div>
  <h1 id="heading">We couldn't find that page.</h1>
  <p id="copy">The link may be incomplete or no longer active. You can return to our website or contact us to find what you need.</p>
  <div class="actions">
    <a id="home-link" href="/">Go to homepage</a>
    <a id="help-link" class="secondary" href="/help">Open contact form</a>
  </div>
  <footer id="note">The Launch Era · Tools for residential cleaning businesses in the U.S.</footer>
</main>
</body>
</html>

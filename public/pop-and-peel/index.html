  function loadChunk(name){if(loadedChunks.has(name))return Promise.resolve();if(pendingChunks.has(name))return pendingChunks.get(name);const request=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=new URL(name+'.js',new URL('/digital-stickers/assets/data/',location.origin)).href;script.onload=()=>{loadedChunks.add(name);pendingChunks.delete(name);resolve()};script.onerror=()=>{pendingChunks.delete(name);reject(new Error(`Could not load ${name}`))};document.head.appendChild(script)});pendingChunks.set(name,request);return request}
  function ensureCategory(category,all=true){const chunks=[...new Set(group(category).map(i=>i.chunk))];return Promise.all((all?chunks:chunks.slice(0,1)).map(loadChunk))}
  function ensureItems(list){const chunks=[...new Set(list.filter(Boolean).map(i=>i.chunk))];return Promise.all(chunks.map(loadChunk))}
  function ensureAll(){return Promise.all(ORDER.map(category=>ensureCategory(category,true)))}
  function applyLanguage(){document.documentElement.lang=lang;const use=lang==='es'?[['Agendas digitales','Personaliza tus rutinas y listas.'],['Diarios creativos','Decora tus recuerdos y momentos.'],['Diseños personales','Añade carácter a tus proyectos.']]:[['Digital planners','Personalize routines and lists.'],['Creative journals','Decorate memories and moments.'],['Personal designs','Add character to your projects.']];document.querySelectorAll('[data-use]').forEach(el=>el.textContent=use[+el.dataset.use][0]);document.querySelectorAll('[data-use-desc]').forEach(el=>el.textContent=use[+el.dataset.useDesc][1]);localStorage.setItem('popPeelStickerLang',lang);localStorage.setItem('popPeelLang',lang);document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>el.placeholder=t(el.dataset.i18nPlaceholder));$('#lang').textContent=lang==='en'?'ES':'EN';$('#homeLink').href=lang==='es'?'/es/':'/';renderHero();renderBooks();renderFilters();renderGallery();if($('#reader').open)renderReader()}
  function group(key){return items.filter(i=>i.category===key)}
  function renderHero(){if(!items.length)return;const chosen=[group('cuban')[2],group('cleaning')[0],group('cuban')[6]].filter(Boolean);$('#heroArt').innerHTML=`<div class="hero-display"><div class="hero-paper"></div><span class="hero-collection-label">POP &amp; PEEL<br>STICKER CLUB</span>${chosen.map((i,n)=>`<div class="hero-print print-${n}"><img src="${assetSrc(i)}" alt="${esc(i.title)}"></div>`).join('')}<span class="hero-seal">${lang==='es'?'SOLO DIGITAL':'DIGITAL ONLY'}<span>✦</span></span></div>`}
  const PACKS={
    cuban:{ids:['cuban-espresso-and-dominoes','cuban-caramel-flan-sticker','golden-cuban-sandwich-with-plantain-chips','guava-cream-cheese-pastelitos'],en:['Cafecito Club','A little taste of home','Recipe journals, food memories & everyday nostalgia'],es:['Club del Cafecito','Un pedacito de casa','Diarios de recetas, recuerdos y nostalgia'],bg:'#f5cb72',accent:'#a94027',style:'recipe'},
    cleaning:{ids:['powder-blue-cleaning-van-sticker','powder-blue-clipboard-checklist-sticker','professional-cleaning-apron-with-tools','cheerful-clean-house-sticker'],en:['Fresh Start','Make every reset count','Cleaning planners, checklists & business journals'],es:['Fresh Start','Un nuevo comienzo','Agendas de limpieza, listas y diarios de negocio'],bg:'#c9e4ee',accent:'#315e76',style:'checklist'},
    wellness:{ids:['coquette-pilates-reformer-with-hibiscus','breakfast-bowl','cream-gym-bag','bubble-candle'],en:['Soft Life Club','A softer kind of routine','Fitness planners, self-care & daily rituals'],es:['Soft Life Club','Una rutina más suave','Agendas fitness, autocuidado y rituales diarios'],bg:'#f2cbd5',accent:'#a34c68',style:'planner'},
    seasonal:{ids:['cozy-pink-christmas-sticker-sheet','cozy-christmas-sticker-collection','pink-and-gold-new-year-sticker-set','valentines-day-sticker-collection'],en:['Every Little Occasion','Celebrate the little things','Seasonal journals, holiday planning & creative cards'],es:['Cada pequeña ocasión','Celebra los pequeños momentos','Diarios de temporada, fiestas y tarjetas digitales'],bg:'#d1e5cb',accent:'#52764b',style:'calendar'},
    creator:{ids:['eight-tech-themed-woman-stickers','friendly-robot-assistant-sticker-set','podcast-portrait-sticker-sheet','typography-branding-sticker-sheet'],en:['Creative Era','Make space for ideas','Creative dashboards, content plans & project notes'],es:['Creative Era','Haz espacio para tus ideas','Paneles creativos, planes de contenido y proyectos'],bg:'#dcd3ef',accent:'#6b50a1',style:'dashboard'},
    avatars:{ids:['glossy-3d-girl-avatar-portrait','pastel-avatar-portrait-collection','stylized-avatar-in-portugal-jersey'],en:['Little Characters','A little more personality','Personal journals, creative profiles & digital collages'],es:['Pequeños personajes','Un poco más de personalidad','Diarios personales, perfiles y collages digitales'],bg:'#f5d8bc',accent:'#9a654a',style:'profile'}
  };
  function packItems(key){const list=group(key);return PACKS[key].ids.map(id=>list.find(i=>i.id===id)).filter(Boolean)}
  function packArt(key){const p=PACKS[key],pics=packItems(key),words=p[lang],label=lang==='es'?'VISTA DIGITAL':'DIGITAL PREVIEW';return `<span class="pack-scene scene-${p.style}" style="--scene:${p.bg};--accent:${p.accent}"><span class="scene-kicker">POP &amp; PEEL STUDIO <span>✳</span></span><span class="scene-backdrop"></span><span class="mock-tablet"><span class="tablet-camera"></span><span class="mock-screen"><span class="screen-brand">POP &amp; PEEL / ${label}</span><span class="screen-title">${esc(words[0])}</span><span class="screen-rule"></span><span class="screen-art">${pics.slice(0,3).map(i=>`<img src="${assetSrc(i)}" alt="" loading="lazy" decoding="async">`).join('')}</span><span class="screen-note">${esc(words[1])}</span></span></span>${pics[3]?`<span class="mock-mini"><img src="${assetSrc(pics[3])}" alt="" loading="lazy"></span>`:''}<span class="scene-caption">${esc(words[0])} <span> / ${label}</span></span></span>`}
  function renderBooks(){if(!items.length)return;$('#bookShelf').innerHTML=ORDER.map(key=>{const list=group(key),p=PACKS[key],words=p[lang];return `<article class="book product-pack" style="--cover:${p.bg}"><button class="book-cover-button" type="button" data-book="${key}" aria-label="${esc(catText(key))}">${packArt(key)}</button><div class="book-info"><div class="book-meta"><span>${list.length} ${lang==='es'?'vistas previas':'previews'}</span><span>Digital</span></div><h3>${esc(words[0])}</h3><p class="pack-category">${esc(catText(key))}</p><p class="pack-use">${esc(words[2])}</p><div class="book-actions"><button type="button" class="book-browse" data-browse="${key}">${lang==='es'?'Ver diseños':'View designs'} <span aria-hidden="true">↗</span></button><button type="button" class="book-preview" data-book="${key}">${lang==='es'?'Ojear':'Preview'}</button></div></div></article>`}).join('')}
  function renderFilters(){const buttons=['all',...ORDER];$('#filters').innerHTML=buttons.map(key=>`<button class="filter ${active===key?'on':''}" data-filter="${key}">${key==='all'?t('all'):esc(catText(key))}</button>`).join('')}
  function visible(){return items.filter(i=>(active==='all'||i.category===active)&&(!query||i.title.toLowerCase().includes(query)))}
  async function renderGallery(){if(!items.length)return;const run=++galleryRun;const all=visible(),list=all.slice(0,limit),more=$('#showMore');$('#resultCount').textContent=lang==='es'?list.length+' de '+all.length+' diseños':list.length+' of '+all.length+' designs';more.hidden=true;$('#gallery').setAttribute('aria-busy','true');try{await ensureItems(list);if(run!==galleryRun)return;$('#gallery').innerHTML=list.length?list.map(i=>`<button class="tile" data-open="${i.id}"><img src="${assetSrc(i)}" alt="${esc(i.title)}" loading="lazy"><b>${esc(i.title)}</b></button>`).join(''):`<p class="empty">${t('empty')}</p>`;more.hidden=all.length<=limit;more.textContent=lang==='es'?'Ver más diseños':'Show more designs'}catch(e){if(run===galleryRun)$('#gallery').innerHTML=`<p class="empty">${lang==='es'?'No se pudieron cargar los diseños.':'Could not load the designs.'}</p>`}finally{if(run===galleryRun)$('#gallery').setAttribute('aria-busy','false')}}
  function openBook(category,startId){readerItems=group(category);readerIndex=Math.max(0,startId?readerItems.findIndex(i=>i.id===startId):0);if(readerIndex<0)readerIndex=0;renderReader();if(!$('#reader').open)$('#reader').showModal();document.body.style.overflow='hidden'}
  let previewRun=0;
  async function renderReader(){if(!readerItems.length)return;const run=++previewRun,item=readerItems[readerIndex],image=$('#pageImage'),status=$('#previewStatus');
  $('#readerHeading').textContent=item.title;$('#pageNumber').textContent=catText(item.category)+' · '+t('page')+' '+(readerIndex+1)+' / '+readerItems.length;
  document.querySelector('.reader-page').dataset.previewLabel=lang==='es'?'VISTA PREVIA':'PREVIEW';$('#progress').style.width=((readerIndex+1)/readerItems.length*100)+'%';
  $('#prev').disabled=readerIndex===0;$('#next').disabled=readerIndex===readerItems.length-1;image.hidden=true;status.hidden=false;status.textContent=lang==='es'?'Cargando diseño…':'Loading design…';
  const from=Math.max(0,Math.min(readerIndex-3,readerItems.length-7)),neighbors=readerItems.slice(from,from+7);
  try{await ensureItems([item]);if(run!==previewRun)return;const src=assetSrc(item);if(!src)throw Error('Missing preview');
  await new Promise((resolve,reject)=>{const probe=new Image();probe.onload=resolve;probe.onerror=reject;probe.src=src;if(probe.complete&&probe.naturalWidth)resolve()});if(run!==previewRun)return;
  image.src=src;image.alt=item.title;image.hidden=false;status.hidden=true;
  }catch(e){if(run!==previewRun)return;status.textContent=lang==='es'?'No se pudo mostrar el diseño.':'This preview could not load.';const retry=document.createElement('button');retry.type='button';retry.textContent=lang==='es'?'Reintentar':'Try again';retry.onclick=renderReader;status.append(retry)}
  try{await ensureItems(neighbors);if(run!==previewRun)return;$('#thumbs').innerHTML=neighbors.map((i,j)=>'<button class="thumb '+(from+j===readerIndex?'on':'')+'" data-page="'+(from+j)+'" aria-label="'+esc(i.title)+'"><img src="'+assetSrc(i)+'" alt="" loading="lazy" decoding="async"></button>').join('')}catch(e){if(run===previewRun)$('#thumbs').replaceChildren()}
  if(run===previewRun)history.replaceState(null,'','#'+item.category+'/'+item.id)}
  function closeReader(){previewRun++;if($('#reader').open)$('#reader').close();document.body.style.overflow='';history.replaceState(null,'',location.pathname+location.search+'#all')}
  function move(delta){const next=Math.min(readerItems.length-1,Math.max(0,readerIndex+delta));if(next!==readerIndex){readerIndex=next;renderReader()}}
  document.addEventListener('click',async e=>{const browse=e.target.closest('[data-browse]');if(browse){active=browse.dataset.browse;query='';$('#search').value='';limit=24;renderFilters();renderGallery();$('#all').scrollIntoView({behavior:'smooth'});return}const book=e.target.closest('[data-book]');if(book){openBook(book.dataset.book);return}const filter=e.target.closest('[data-filter]');if(filter){active=filter.dataset.filter;limit=24;renderFilters();renderGallery();return}const open=e.target.closest('[data-open]');if(open){const item=items.find(i=>i.id===open.dataset.open);if(item){openBook(item.category,item.id)}return}const page=e.target.closest('[data-page]');if(page){readerIndex=Number(page.dataset.page);renderReader()}});
  $('#showMore').addEventListener('click',()=>{limit+=24;renderGallery()});$('#lang').addEventListener('click',()=>{lang=lang==='en'?'es':'en';if(location.pathname==='/'||location.pathname==='/es/')history.replaceState(null,'',(lang==='es'?'/es/':'/')+location.search+location.hash);applyLanguage()});$('#search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();limit=24;renderGallery()});$('#close').addEventListener('click',closeReader);$('#prev').addEventListener('click',()=>move(-1));$('#next').addEventListener('click',()=>move(1));$('#unlock').addEventListener('click',closeReader);$('#reader').addEventListener('click',e=>{if(e.target===$('#reader'))closeReader()});document.addEventListener('keydown',e=>{if(!$('#reader').open)return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key==='Escape')closeReader()});$('#stage').addEventListener('touchstart',e=>touchStart=e.changedTouches[0].clientX,{passive:true});$('#stage').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchStart;if(Math.abs(dx)>45)move(dx<0?1:-1)},{passive:true});
  applyLanguage();
  fetch('/digital-stickers/manifest.json?v=commercial-20261127',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Manifest unavailable');return r.json()}).then(async data=>{items=data.filter(i=>ORDER.includes(i.category)&&!i.id.startsWith('sparkle-cleaning-co-'));$('#total').textContent=items.length;await Promise.all(ORDER.map(category=>ensureCategory(category,false)));await ensureItems([...ORDER.flatMap(category=>packItems(category)),group('cuban')[2],group('cleaning')[0],group('cuban')[6]]);renderHero();applyLanguage();const hash=location.hash.slice(1).split('/');if(ORDER.includes(hash[0])){openBook(hash[0],hash[1])}}).catch(()=>{applyLanguage();$('#gallery').innerHTML=`<p class="empty">${lang==='es'?'No se pudo cargar la biblioteca. Actualiza la página para volver a intentarlo.':'The preview library could not load. Refresh the page to try again.'}</p>`});
  </script>

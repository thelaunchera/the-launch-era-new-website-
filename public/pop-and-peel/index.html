  function renderBag(){const singles=bag.singles.map(id=>items.find(i=>i.id===id)).filter(Boolean);$('#cartHeading').textContent=tr('Your bag','Tu carrito');$('#cartClose').setAttribute('aria-label',tr('Close','Cerrar'));$('#continueShopping').textContent=tr('Continue exploring','Seguir explorando');const complete=bag.singles.length===0||bag.singles.length===bag.target;$('#bagPrice').textContent=bag.singles.length?(bag.packs.length?tr('Custom pack subtotal: ','Subtotal pack personalizado: '):tr('Custom pack: ','Pack personalizado: '))+usd(LAUNCH_PRICES[bag.target]):'';const available=checkoutEnabled&&complete&&bag.singles.length>0&&bag.packs.length===0;$('#stripeCheckout').disabled=!available||checkoutBusy;$('#stripeCheckout').textContent=checkoutBusy?tr('Opening secure checkout…','Abriendo checkout seguro…'):checkoutEnabled?tr('Secure checkout','Checkout seguro'):tr('Checkout coming soon','Checkout próximamente');$('#bagStatus').textContent=!checkoutEnabled?tr('Your selection is saved on this device. Checkout is coming soon. Ready-made pack prices have not been announced.','Tu selección se guarda en este dispositivo. El checkout estará disponible próximamente. Los packs preparados aún no tienen precio anunciado.'):!complete?tr('Complete your custom pack before checkout.','Completa tu pack antes de pagar.'):tr('Your order will be sent to the email you enter in Stripe Checkout after payment is confirmed.','Enviaremos tu orden al correo que indiques en Stripe después de confirmar el pago.');const custom=singles.length?`<section class="bag-section"><h3>${tr('Your custom pack','Tu pack personalizado')} · ${singles.length}/${bag.target}</h3>${singles.map(i=>`<div class="bag-line"><div class="bag-image">${assetSrc(i)?`<img src="${assetSrc(i)}" alt="">`:''}</div><b>${esc(i.title)}</b><button type="button" data-add-sticker="${i.id}" class="bag-remove">${tr('Remove','Quitar')}</button></div>`).join('')}</section>`:'';const packs=bag.packs.length?`<section class="bag-section"><h3>${tr('Ready-made packs','Packs preparados')}</h3>${bag.packs.map(k=>`<div class="bag-line"><div class="bag-image">${packItems(k)[0]&&assetSrc(packItems(k)[0])?`<img src="${assetSrc(packItems(k)[0])}" alt="">`:''}</div><b>${esc(PACKS[k][lang][0])}</b><button type="button" data-add-pack="${k}" class="bag-remove">${tr('Remove','Quitar')}</button></div>`).join('')}</section>`:'';$('#bagContent').innerHTML=custom+packs||`<p class="bag-empty">${tr('Your bag is empty. Find a sticker you love!','Tu carrito está vacío. ¡Encuentra un sticker que te encante!')}</p>`}
  async function openBag(){refreshCheckout();if($('#reader').open)closeReader();if(!$('#cartDialog').open)$('#cartDialog').showModal();document.body.style.overflow='hidden';renderBag();try{await ensureItems(bag.singles.map(id=>items.find(i=>i.id===id)));if($('#cartDialog').open)renderBag()}catch(e){}}
  function closeBag(){if($('#cartDialog').open)$('#cartDialog').close();document.body.style.overflow=''}
  $('#cartOpen').addEventListener('click',openBag);$('#builderBag').addEventListener('click',openBag);$('#cartClose').addEventListener('click',closeBag);$('#continueShopping').addEventListener('click',closeBag);$('#cartDialog').addEventListener('cancel',e=>{e.preventDefault();closeBag()});$('#cartDialog').addEventListener('click',e=>{if(e.target===$('#cartDialog'))closeBag()});$('#readerAdd').addEventListener('click',()=>{const item=readerItems[readerIndex];if(item)toggleSticker(item.id)});
  async function refreshCheckout(){try{const r=await fetch(COMMERCE+'/status',{cache:'no-store'});const d=await r.json();checkoutEnabled=r.ok&&d.checkout_enabled===true}catch{checkoutEnabled=false}if($('#cartDialog').open)renderBag()}
  $('#stripeCheckout').addEventListener('click',async()=>{if(!checkoutEnabled||checkoutBusy||bag.packs.length>0||(!bag.singles.length&&!bag.packs.length)||(bag.singles.length&&bag.singles.length!==bag.target))return;checkoutBusy=true;renderBag();try{const r=await fetch(COMMERCE+'/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request_id:crypto.randomUUID(),singles:[...bag.singles],packs:[...bag.packs]})});const d=await r.json();if(!r.ok||typeof d.url!=='string'||!d.url.startsWith('https://checkout.stripe.com/'))throw Error('Checkout unavailable');location.assign(d.url)}catch{checkoutBusy=false;renderBag();$('#bagStatus').textContent=tr('Checkout could not open. Please try again later.','No se pudo abrir el checkout. Inténtalo más tarde.')}});
  refreshCheckout();
  applyLanguage();
  fetch('/digital-stickers/manifest.json?v=pick-mix-v9-20261127',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Manifest unavailable');return r.json()}).then(async data=>{items=data.filter(i=>i.originalTransparencyVerified===true&&ORDER.includes(i.category)&&TRANSPARENT_APPROVED.has(i.id));normalizeBag();await Promise.all(ORDER.map(category=>ensureCategory(category,false)));await ensureItems([...PACK_ORDER.flatMap(category=>packItems(category)),...heroItems()]);renderHero();applyLanguage();const hash=location.hash.slice(1).split('/');if(ORDER.includes(hash[0])||PACK_ORDER.includes(hash[0])){openBook(hash[0],hash[1])}}).catch(()=>{applyLanguage();$('#gallery').innerHTML=`<p class="empty">${lang==='es'?'No se pudo cargar la biblioteca. Actualiza la página para volver a intentarlo.':'The preview library could not load. Refresh the page to try again.'}</p>`});
  </script>

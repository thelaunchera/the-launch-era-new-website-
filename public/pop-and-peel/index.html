  <dialog id="reader" aria-labelledby="readerHeading">
    <div class="reader">
      <div class="reader-top"><button class="close" id="close" type="button" aria-label="Close">×</button><div class="reader-title"><b id="readerHeading"></b><small id="pageNumber"></small></div><a class="button green unlock" href="#access" id="unlock" data-i18n="unlock"></a></div>

  <script>
  const COPY={
    en:{announce:'Little things. Big personality. · Digital sticker studio',navBooks:'Collections',navAll:'Sticker library',navAccess:'Digital access',eyebrow:'The digital sticker shop',hero:'Made to stick.',heroText:'Find your next favorite sticker. Browse our original digital collections, discover individual designs and flip through interactive sticker books.',explore:'Explore collections',how:'Digital access',statCategories:'organized categories',statDesigns:'sticker previews',noZip:'NO ZIP',statFormat:'interactive access',shelfTag:'The digital shelf',shelfTitle:'Shop by collection',shelfText:'Six little worlds of original artwork. Tap a collection to explore its designs.',allTag:'The sticker library',allTitle:'Find your favorites',allText:'Filter the complete collection or search by name. Every image here is a protected preview.',searchLabel:'Search stickers',searchPlaceholder:'Search stickers…',all:'All',open:'Open publication',designs:'designs',individual:'Individual sticker',collection:'Sticker sheet',empty:'No stickers found in this category.',accessTag:'Made for your digital life',accessTitle:'Your digital sticker packs',accessText:'Checkout and secure private access are being prepared. When sales open, one private publication will unlock individual transparent PNG stickers and printable PDF pages—no ZIP required.',notify:'Get the digital launch notice',a1:'Small packs · up to 20 stickers · planned $5.99',a2:'Standard packs · 40–50 stickers · planned $8.99',a3:'Complete digital bundle · planned $19.99',a4:'Personal license included · commercial add-on planned +$7',unlock:'Digital checkout coming soon',page:'Page'},
    es:{announce:'Pequeños detalles. Mucha personalidad. · Estudio de stickers digitales',navBooks:'Colecciones',navAll:'Biblioteca',navAccess:'Acceso digital',eyebrow:'Tienda de stickers digitales',hero:'Hechos para conectar.',heroText:'Encuentra tu próximo sticker favorito. Explora nuestras colecciones digitales, descubre diseños individuales y hojea los libros interactivos.',explore:'Explorar colecciones',how:'Acceso digital',statCategories:'categorías organizadas',statDesigns:'vistas de stickers',noZip:'SIN ZIP',statFormat:'acceso interactivo',shelfTag:'La biblioteca digital',shelfTitle:'Explora por colección',shelfText:'Seis mundos de diseños originales. Toca una colección para explorar sus stickers.',allTag:'Biblioteca de stickers',allTitle:'Encuentra tus favoritos',allText:'Filtra la colección completa o busca por nombre. Todas las imágenes son vistas previas protegidas.',searchLabel:'Buscar stickers',searchPlaceholder:'Buscar stickers…',all:'Todos',open:'Abrir publicación',designs:'diseños',individual:'Sticker individual',collection:'Hoja de stickers',empty:'No encontramos stickers en esta categoría.',accessTag:'Para tu mundo digital',accessTitle:'Tus packs de stickers digitales',accessText:'Estamos preparando el checkout y el acceso privado seguro. Cuando abran las ventas, una publicación privada desbloqueará PNG transparentes individuales y páginas PDF imprimibles, sin ZIP.',notify:'Avisarme del lanzamiento digital',a1:'Packs pequeños · hasta 20 stickers · precio planeado $5.99',a2:'Packs estándar · 40–50 stickers · precio planeado $8.99',a3:'Bundle digital completo · precio planeado $19.99',a4:'Licencia personal incluida · licencia comercial planeada +$7',unlock:'Checkout digital próximamente',page:'Página'}
  };
  const CATS={
    cuban:{en:['Cuban Kitchen & Culture','Food, cafecito and nostalgic Cuban details.'],es:['Cocina y cultura cubana','Comida, cafecito y detalles cubanos llenos de nostalgia.'],color:'#ffd83d'},
    cleaning:{en:['Cleaning Business','Tools, routes, homes and small-business moments.'],es:['Negocios de limpieza','Herramientas, rutas, hogares y momentos de pequeños negocios.'],color:'#bfeaff'},
    wellness:{en:['Pilates & Wellness','Movement, routines, matcha and soft-life energy.'],es:['Pilates y bienestar','Movimiento, rutinas, matcha y energía soft life.'],color:'#ffacd0'},
    seasonal:{en:['Seasons & Celebrations','Holidays and special moments throughout the year.'],es:['Temporadas y celebraciones','Festividades y momentos especiales durante todo el año.'],color:'#bff4d5'},
    creator:{en:['Business & Creator','Branding, content and creative-work stickers.'],es:['Negocios y creadores','Stickers para branding, contenido y trabajo creativo.'],color:'#dfccff'},
    avatars:{en:['Avatar Collection','Expressive characters and portrait styles.'],es:['Colección de avatares','Personajes expresivos y diferentes estilos de retratos.'],color:'#ffe2b8'}
  };
  const ORDER=['cuban','cleaning','wellness','seasonal','creator','avatars'];
  const $=s=>document.querySelector(s);let items=[],lang=((/^\/es(?:\/|$)/.test(location.pathname)?'es':'')||localStorage.getItem('popPeelLang')||localStorage.getItem('popPeelStickerLang')||((navigator.language||'en').startsWith('es')?'es':'en'));if(!COPY[lang])lang='en';let active='all',query='',limit=24,galleryRun=0,readerItems=[],readerIndex=0,touchStart=0;window.POP_PEEL_PREVIEWS=window.POP_PEEL_PREVIEWS||{};const loadedChunks=new Set(),pendingChunks=new Map();
  const t=k=>COPY[lang][k];const catText=(key,index=0)=>CATS[key][lang][index];
  function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
  const assetSrc=item=>window.POP_PEEL_PREVIEWS[item.id]||'';
  function loadChunk(name){if(loadedChunks.has(name))return Promise.resolve();if(pendingChunks.has(name))return pendingChunks.get(name);const request=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=new URL(name+'.js',new URL('/digital-stickers/assets/data/',location.origin)).href;script.onload=()=>{loadedChunks.add(name);pendingChunks.delete(name);resolve()};script.onerror=()=>{pendingChunks.delete(name);reject(new Error(`Could not load ${name}`))};document.head.appendChild(script)});pendingChunks.set(name,request);return request}
  function ensureCategory(category,all=true){const chunks=[...new Set(group(category).map(i=>i.chunk))];return Promise.all((all?chunks:chunks.slice(0,1)).map(loadChunk))}
  function ensureItems(list){const chunks=[...new Set(list.filter(Boolean).map(i=>i.chunk))];return Promise.all(chunks.map(loadChunk))}
  function ensureAll(){return Promise.all(ORDER.map(category=>ensureCategory(category,true)))}
  function applyLanguage(){document.documentElement.lang=lang;localStorage.setItem('popPeelStickerLang',lang);localStorage.setItem('popPeelLang',lang);document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>el.placeholder=t(el.dataset.i18nPlaceholder));$('#lang').textContent=lang==='en'?'ES':'EN';$('#homeLink').href=lang==='es'?'/es/':'/';renderBooks();renderFilters();renderGallery();if($('#reader').open)renderReader()}
  function group(key){return items.filter(i=>i.category===key)}
  function renderHero(){const chosen=[group('cuban')[2],group('cleaning')[2],group('seasonal')[0]].filter(Boolean);$('#heroArt').innerHTML=`<div class="stack">${chosen.map(i=>`<img src="${assetSrc(i)}" alt="">`).join('')}</div>`}
  function renderBooks(){if(!items.length)return;$('#bookShelf').innerHTML=ORDER.map(key=>{const list=group(key),pics=list.slice(0,4);return `<button class="book" style="--cover:${CATS[key].color}" data-book="${key}"><span class="book-collage">${pics.map(i=>`<img src="${assetSrc(i)}" alt="" loading="lazy">`).join('')}</span><span class="book-info"><h3>${esc(catText(key))}</h3><p>${esc(catText(key,1))}</p><span class="count">${list.length} ${t('designs')}</span></span></button>`}).join('')}
  function renderFilters(){const buttons=['all',...ORDER];$('#filters').innerHTML=buttons.map(key=>`<button class="filter ${active===key?'on':''}" data-filter="${key}">${key==='all'?t('all'):esc(catText(key))}</button>`).join('')}
  function visible(){return items.filter(i=>(active==='all'||i.category===active)&&(!query||i.title.toLowerCase().includes(query)))}
  async function renderGallery(){if(!items.length)return;const run=++galleryRun;const all=visible(),list=all.slice(0,limit),more=$('#showMore');more.hidden=true;$('#gallery').setAttribute('aria-busy','true');try{await ensureItems(list);if(run!==galleryRun)return;$('#gallery').innerHTML=list.length?list.map(i=>`<button class="tile" data-open="${i.id}"><img src="${assetSrc(i)}" alt="${esc(i.title)}" loading="lazy"><b>${esc(i.title)}</b></button>`).join(''):`<p class="empty">${t('empty')}</p>`;more.hidden=all.length<=limit;more.textContent=lang==='es'?'Ver más diseños':'Show more designs'}catch(e){if(run===galleryRun)$('#gallery').innerHTML=`<p class="empty">${lang==='es'?'No se pudieron cargar los diseños.':'Could not load the designs.'}</p>`}finally{if(run===galleryRun)$('#gallery').setAttribute('aria-busy','false')}}
  function openBook(category,startId){readerItems=group(category);readerIndex=Math.max(0,startId?readerItems.findIndex(i=>i.id===startId):0);if(readerIndex<0)readerIndex=0;renderReader();if(!$('#reader').open)$('#reader').showModal();document.body.style.overflow='hidden'}
  function renderReader(){if(!readerItems.length)return;const item=readerItems[readerIndex];$('#readerHeading').textContent=item.title;$('#pageNumber').textContent=`${catText(item.category)} · ${t('page')} ${readerIndex+1} / ${readerItems.length}`;$('#pageImage').src=assetSrc(item);$('#pageImage').alt=item.title;document.querySelector('.reader-page').dataset.previewLabel=lang==='es'?'VISTA PREVIA':'PREVIEW';$('#progress').style.width=`${((readerIndex+1)/readerItems.length)*100}%`;$('#prev').disabled=readerIndex===0;$('#next').disabled=readerIndex===readerItems.length-1;$('#thumbs').innerHTML=readerItems.map((i,n)=>`<button class="thumb ${n===readerIndex?'on':''}" data-page="${n}" aria-label="${esc(i.title)}"><img src="${assetSrc(i)}" alt="" loading="lazy"></button>`).join('');const on=$('#thumbs .on');if(on)on.scrollIntoView({block:'nearest',inline:'center'});history.replaceState(null,'',`#${item.category}/${item.id}`)}
  function closeReader(){if($('#reader').open)$('#reader').close();document.body.style.overflow='';history.replaceState(null,'',location.pathname+location.search)}
  function move(delta){const next=Math.min(readerItems.length-1,Math.max(0,readerIndex+delta));if(next!==readerIndex){readerIndex=next;renderReader()}}
  document.addEventListener('click',async e=>{const book=e.target.closest('[data-book]');if(book){await ensureCategory(book.dataset.book,true);openBook(book.dataset.book);return}const filter=e.target.closest('[data-filter]');if(filter){active=filter.dataset.filter;limit=24;renderFilters();renderGallery();return}const open=e.target.closest('[data-open]');if(open){const item=items.find(i=>i.id===open.dataset.open);if(item){await ensureCategory(item.category,true);openBook(item.category,item.id)}return}const page=e.target.closest('[data-page]');if(page){readerIndex=Number(page.dataset.page);renderReader()}});
  $('#showMore').addEventListener('click',()=>{limit+=24;renderGallery()});$('#lang').addEventListener('click',()=>{lang=lang==='en'?'es':'en';if(location.pathname==='/'||location.pathname==='/es/')history.replaceState(null,'',(lang==='es'?'/es/':'/')+location.search+location.hash);applyLanguage()});$('#search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();limit=24;renderGallery()});$('#close').addEventListener('click',closeReader);$('#prev').addEventListener('click',()=>move(-1));$('#next').addEventListener('click',()=>move(1));$('#unlock').addEventListener('click',closeReader);$('#reader').addEventListener('click',e=>{if(e.target===$('#reader'))closeReader()});document.addEventListener('keydown',e=>{if(!$('#reader').open)return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key==='Escape')closeReader()});$('#stage').addEventListener('touchstart',e=>touchStart=e.changedTouches[0].clientX,{passive:true});$('#stage').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchStart;if(Math.abs(dx)>45)move(dx<0?1:-1)},{passive:true});
  applyLanguage();
  fetch('/digital-stickers/manifest.json').then(r=>{if(!r.ok)throw new Error('Manifest unavailable');return r.json()}).then(async data=>{items=data;$('#total').textContent=items.length;await Promise.all(ORDER.map(category=>ensureCategory(category,false)));await ensureItems([...ORDER.flatMap(category=>group(category).slice(0,4)),group('cuban')[2],group('cleaning')[2],group('seasonal')[0]]);renderHero();applyLanguage();const hash=location.hash.slice(1).split('/');if(CATS[hash[0]]){await ensureCategory(hash[0],true);openBook(hash[0],hash[1])}}).catch(()=>{applyLanguage();$('#gallery').innerHTML=`<p class="empty">${lang==='es'?'No se pudo cargar la biblioteca. Actualiza la página para volver a intentarlo.':'The preview library could not load. Refresh the page to try again.'}</p>`});
  </script>

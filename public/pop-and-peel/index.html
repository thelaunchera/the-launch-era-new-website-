<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pop &amp; Peel Studio | Custom Stickers &amp; Personalized Paper Goods</title>
<meta name="description" content="Custom stickers, labels, sticker sheets and personalized paper goods for small businesses, birthdays and events. Bilingual service in English and Spanish.">
<meta name="theme-color" content="#ff5fa2">
<meta name="color-scheme" content="light">
<link rel="icon" href="/pop-and-peel/assets/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--pk:#ff5fa2;--pk2:#ff9bc7;--yl:#ffd83d;--gr:#3ddc84;--gr2:#bff4d5;--bg:#fff8e7;--ink:#111;--card:#fff;box-sizing:border-box;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth;scroll-padding-top:74px}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.5 Nunito,system-ui,sans-serif;overflow-x:hidden}
body.menu-open{overflow:hidden}
button,input,select,textarea{font:inherit}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:4px solid #246bfd;outline-offset:3px}
h1,h2,h3,.logo{font-family:'Bowlby One',Impact,sans-serif;font-weight:400;line-height:1.02;margin:0;color:var(--ink)}
h1{font-size:clamp(42px,13vw,92px);-webkit-text-stroke:9px #fff;paint-order:stroke fill;text-shadow:0 5px 0 rgba(0,0,0,.15);color:#111}
h2{font-size:clamp(30px,8vw,54px);margin-bottom:14px}
section{padding:48px 16px;max-width:1100px;margin:auto}
.eyebrow{display:inline-flex;align-items:center;gap:8px;border:2px solid #111;border-radius:999px;background:#fff;padding:6px 12px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#111;margin-bottom:12px}
.ann{background:#111;color:#fff8e7;text-align:center;padding:8px 10px;font-size:13px;font-weight:800;padding-top:max(8px,env(safe-area-inset-top,0px))}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:3px solid var(--ink);display:flex;align-items:center;gap:6px;padding:8px 10px}
.logo{font-size:17px;text-decoration:none;background:var(--yl);color:#111;padding:7px 11px;border:3px solid #111;border-radius:14px;transform:rotate(-2deg);box-shadow:3px 3px 0 #111;position:relative;white-space:nowrap}
.logo:after{content:"";position:absolute;right:-3px;bottom:-3px;width:15px;height:15px;background:linear-gradient(135deg,var(--yl) 0 48%,#fff 49% 68%,#111 69% 78%,transparent 79%);border-bottom-right-radius:9px}
.brand-logo{display:block;line-height:0;transform:rotate(-1deg)}.brand-logo img{display:block;width:clamp(132px,24vw,194px);height:auto}.footer-logo{width:min(260px,76vw);height:auto;display:block;margin:0 auto 18px}
nav{display:none;gap:16px;margin-left:12px}nav a,.mn a{color:var(--ink);text-decoration:none;font-weight:800}
@media(min-width:860px){nav{display:flex}#mb{display:none}}
.sp{flex:1}.ic{background:none;border:0;color:var(--ink);padding:7px;cursor:pointer;position:relative;min-width:40px;min-height:40px}
.ic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
#cc{position:absolute;top:0;right:0;background:var(--pk);color:#111;border-radius:99px;font-size:11px;padding:0 6px;border:2px solid #111}
.lang{display:flex;border:3px solid var(--ink);border-radius:99px;overflow:hidden}
.lang button{border:0;background:var(--card);color:var(--ink);font:800 13px Nunito;padding:6px 10px;cursor:pointer}.lang button.on{background:var(--gr);color:#111}
.btn{display:inline-block;font:800 16px Nunito;padding:14px 22px;border:3px solid #111;border-radius:99px;box-shadow:4px 4px 0 #111;text-decoration:none;color:#111;background:var(--yl);cursor:pointer;min-height:48px}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #111}.btn.p{background:var(--pk)}.btn.g{background:var(--gr)}.btn[disabled]{opacity:.5;box-shadow:none}
#sbar{display:none;padding:8px 12px;background:var(--bg);border-bottom:3px solid var(--ink)}#sbar.o{display:block}
.mn{position:fixed;inset:0;z-index:30;background:var(--pk);padding:70px 22px 22px;display:none;flex-direction:column;gap:6px;overflow:auto}.mn.o{display:flex}
.mn a{font:400 28px 'Bowlby One',Impact,sans-serif;color:#111;padding:6px 0;text-decoration:none}.mn .x{position:absolute;top:12px;right:14px}
.hero{max-width:1100px;width:calc(100% - 20px);margin:12px auto 0;border-radius:32px;border:3px solid #111;background-color:var(--pk);background-image:linear-gradient(rgba(255,255,255,.35) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.35) 2px,transparent 2px);background-size:32px 32px;position:relative;overflow:hidden;text-align:center;padding:52px 14px 30px;color:#111;box-shadow:7px 7px 0 #111}
.hero p{font-size:clamp(17px,4.4vw,20px);max-width:570px;margin:16px auto;color:#111}.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.col{display:flex;justify-content:center;align-items:flex-end;margin-top:22px}.col svg{width:36%;max-width:240px;margin:0 -4%;filter:drop-shadow(4px 0 0 #fff) drop-shadow(-4px 0 0 #fff) drop-shadow(0 4px 0 #fff) drop-shadow(0 -4px 0 #fff) drop-shadow(0 9px 8px rgba(0,0,0,.3))}
.col svg:nth-child(odd){transform:rotate(-6deg)}.col svg:nth-child(even){transform:rotate(5deg) translateY(-12px)}
.fl{position:absolute;width:64px;filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff);animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{translate:0 -9px}}@media(prefers-reduced-motion:reduce){.fl{animation:none}}
.grid{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}@media(min-width:860px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cat{border:3px solid #111;border-radius:22px;background:var(--c);padding:8px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font:400 14px/1.1 'Bowlby One',Impact,sans-serif;color:#111;cursor:pointer;box-shadow:4px 4px 0 #111;min-height:44px}
.cat svg{width:78%;transition:transform .2s}.cat:hover svg{transform:rotate(-4deg) scale(1.04)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 14px;-webkit-overflow-scrolling:touch}.chip{flex:none;border:3px solid var(--ink);border-radius:99px;padding:6px 14px;font:800 14px Nunito;background:var(--card);color:var(--ink);cursor:pointer}.chip.on{background:#111;color:#fff8e7}
.card{background:var(--card);border:3px solid var(--ink);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:4px 4px 0 var(--ink);transition:transform .18s,box-shadow .18s}.card:hover{transform:translateY(-3px);box-shadow:6px 7px 0 var(--ink)}
.ph{margin:8px 8px 0;border-radius:999px 999px 16px 16px;border:3px solid var(--ink);display:grid;place-items:end center;aspect-ratio:1/1.05;padding-top:14%}.ph svg{width:88%;filter:drop-shadow(0 7px 6px rgba(0,0,0,.25))}
.card .b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}.card h3{font-size:14px;line-height:1.15}
.tag{align-self:flex-start;font-size:11px;font-weight:800;background:var(--yl);color:#111;border:2px solid #111;border-radius:99px;padding:1px 8px}
.card .btn{padding:9px 10px;font-size:14px;margin-top:auto;box-shadow:3px 3px 0 #111;min-height:44px}
.ed{border-radius:30px;border:3px solid #111;color:#111;display:grid;gap:10px;padding:26px 18px;box-shadow:6px 6px 0 #111;overflow:hidden}.ed h2{color:#111}.ed p{margin:0 0 10px}
@media(min-width:860px){.ed{grid-template-columns:1fr 1.1fr;align-items:center;padding:36px}}
.benefits{display:grid;gap:12px}.benefit{background:#fff;border:3px solid #111;border-radius:20px;padding:18px;color:#111;box-shadow:4px 4px 0 #111}.benefit b{display:block;font-family:'Bowlby One',Impact,sans-serif;font-weight:400;font-size:19px;margin-bottom:5px}@media(min-width:760px){.benefits{grid-template-columns:repeat(3,1fr)}}
.pill{border:3px solid #111;border-radius:99px;padding:8px 16px;font-weight:800;background:#fff;color:#111;cursor:pointer}.pill.on{background:#111;color:#fff}
.steps{counter-reset:s;display:grid;gap:10px;padding:0;list-style:none}
.steps li{counter-increment:s;background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:12px 14px 12px 58px;position:relative;font-weight:800}
.steps li:before{content:counter(s);position:absolute;left:12px;top:8px;width:34px;height:34px;border-radius:50%;background:var(--pk);color:#111;display:grid;place-items:center;border:3px solid #111;font:400 15px 'Bowlby One'}
@media(min-width:860px){.steps{grid-template-columns:repeat(4,1fr)}}
form.fm{display:grid;gap:12px;background:var(--card);border:3px solid var(--ink);border-radius:26px;padding:18px}
label{display:grid;gap:4px;font-weight:800;font-size:14px}
input,select,textarea{font:600 16px Nunito;padding:12px;border:3px solid var(--ink);border-radius:14px;background:var(--bg);color:var(--ink);width:100%}
.two{display:grid;gap:12px}@media(min-width:600px){.two{grid-template-columns:1fr 1fr}}
.note{font-size:14px;opacity:.8;margin:0}#pv{display:flex;gap:12px;align-items:center}#pv img{width:84px;height:84px;object-fit:cover;border-radius:14px;border:3px solid var(--ink)}
.est{background:var(--yl);color:#111;border:3px solid #111;border-radius:16px;padding:10px 14px;font-weight:800}
details{background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:12px 16px;margin-bottom:10px}summary{font-weight:800;cursor:pointer}
footer{background:#111;color:#fff8e7;padding:34px 18px calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
footer button{color:#fff8e7;margin:4px 8px;font-size:14px;background:none;border:0;text-decoration:underline;cursor:pointer}footer small{display:block;margin-top:16px;opacity:.7;font-size:12px}
#dr{position:fixed;inset:0 0 0 auto;width:min(390px,100%);background:var(--bg);border-left:3px solid var(--ink);z-index:40;transform:translateX(105%);transition:.25s;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));overflow:auto}#dr.o{transform:none}
.ci{display:flex;gap:8px;align-items:center;border-bottom:2px dashed var(--ink);padding:8px 0}.ci span:first-child{flex:1;font-size:14px}.qb{width:32px;height:32px;border-radius:50%;border:3px solid var(--ink);background:var(--card);color:var(--ink);font-weight:800;cursor:pointer}
#ts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));translate:-50% 0;background:#111;color:#fff8e7;padding:10px 18px;border-radius:99px;z-index:50;font-weight:800;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}#ts.o{opacity:1}
.policy{border:3px solid #111;border-radius:24px;background:var(--bg);color:var(--ink);width:min(680px,calc(100% - 24px));max-height:84vh;padding:0;box-shadow:8px 8px 0 #111}.policy::backdrop{background:rgba(0,0,0,.65)}.policy-in{padding:24px}.policy-head{display:flex;align-items:start;gap:12px}.policy-head h2{font-size:clamp(26px,7vw,40px);flex:1}.policy-close{width:44px;height:44px;border:3px solid #111;border-radius:50%;background:var(--yl);font-size:24px;font-weight:800;cursor:pointer}.policy-body{white-space:pre-line}
@media(max-width:520px){header{gap:3px}.brand-logo img{width:124px}.logo{font-size:14px;padding:7px 8px}.lang button{padding:6px 8px}.ic{min-width:38px;padding:6px}.hero{box-shadow:5px 5px 0 #111}.card h3{font-size:13px}.card .btn{font-size:12px}.ph{aspect-ratio:1/1.15}.footer-links{display:grid;grid-template-columns:1fr 1fr}}

/* Digital-first, art-led storefront. */
.hero{background-color:#ff9bc7;padding:38px 24px 26px;box-shadow:4px 5px 0 #111}.hero h1{font-size:clamp(36px,7vw,82px);-webkit-text-stroke:0;text-shadow:none;max-width:920px;margin:auto;overflow-wrap:break-word}.hero .fl{width:42px;opacity:.85}.hero .row .btn.p{background:var(--yl)}.hero .row .btn:not(.p){background:#fff}.real-art{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:590px;margin:23px auto 0;align-items:center}.real-art:empty{display:none}.real-art img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:contain;padding:6px;background:#fff;border:2px solid #111;border-radius:18px;box-shadow:3px 4px 0 #111}.real-art img:first-child{rotate:-4deg}.real-art img:last-child{rotate:4deg}.real-art img:nth-child(2){translate:0 -7px}.ed .real-art{max-width:420px;margin:0 auto}.digital-cat .b{padding:15px;min-height:134px;justify-content:space-between}.digital-cat h3{font-family:Nunito,system-ui,sans-serif;font-weight:900;font-size:19px}.digital-cat .b p{margin:0;color:#4b4549;font-size:14px}.digital-cat .tag{font-size:10px}.digital-cat .btn{text-align:center}.digital-cat:first-child{background:#fff4c8}#digital{padding-top:32px}#digital .ed{background:#ffe2ed!important}.ed{box-shadow:3px 4px 0 #111}#dg{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:520px){header{padding-inline:8px;gap:2px}.brand-logo img{width:105px}.lang{border-width:2px}.lang button{padding:7px 6px;font-size:12px}.ic{min-width:32px;padding:4px}.ic svg{width:20px;height:20px}.hero{padding:27px 14px 18px;border-radius:22px}.hero h1{font-size:clamp(32px,9vw,48px)}.hero p{font-size:16px;margin:12px auto}.hero .fl{display:none}.hero .row{gap:8px}.hero .btn{font-size:13px;padding:10px 13px;min-height:44px}.hero .eyebrow{font-size:10px;letter-spacing:.025em}.real-art{gap:7px;margin-top:18px}.real-art img{border-radius:12px;padding:4px}.ed .real-art{margin:10px auto 0}section{padding:30px 14px}#digital{padding-top:24px}#dg{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.digital-cat{border-width:2px;border-radius:14px;box-shadow:2px 3px 0 #111}.digital-cat .b{padding:11px;min-height:118px}.digital-cat h3{font-size:16px}.digital-cat .b p{font-size:12px}.digital-cat .btn{font-size:12px;padding:8px}.ed h2{font-size:28px}}
</style></head><body>

async function loadStoreArt(){try{const response=await fetch('/digital-stickers/manifest.json');if(!response.ok)throw Error('Preview manifest');const data=await response.json();const cats=['cuban','cleaning','seasonal','wellness','creator','avatars'];const picked=cats.map(k=>data.find(i=>i.category===k)).filter(Boolean);window.POP_PEEL_PREVIEWS=window.POP_PEEL_PREVIEWS||{};await Promise.all([...new Set(picked.map(i=>i.chunk))].map(name=>new Promise((resolve,reject)=>{const tag=document.createElement('script');tag.src='/digital-stickers/assets/data/'+encodeURIComponent(name)+'.js';tag.onload=resolve;tag.onerror=reject;document.head.appendChild(tag)})));const art=(id,items)=>{const root=document.getElementById(id);items.forEach(item=>{const src=window.POP_PEEL_PREVIEWS[item.id];if(!src)return;const image=new Image();image.src=src;image.alt=item.title;image.decoding='async';root.appendChild(image)})};art('heroStickerArt',picked.slice(0,3));art('digitalStickerArt',picked.slice(3))}catch(error){console.warn('Digital preview unavailable',error)}}
loadStoreArt();

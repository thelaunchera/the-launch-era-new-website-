<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Your digital sticker pack | Pop &amp; Peel Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf8f3;color:#29221e;font:16px/1.5 system-ui,sans-serif}main{max-width:660px;margin:auto;padding:28px 18px 50px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:30px}header img{width:138px}button,a{font:inherit}button{cursor:pointer;border:1px solid #29221e;border-radius:99px;background:#29221e;color:white;font-weight:700;padding:10px 18px}button:disabled{opacity:.5;cursor:default}#lang{background:#fff;color:#29221e;padding:8px 14px}h1{font-size:clamp(32px,8vw,48px);letter-spacing:-.05em;line-height:1.06;margin:0 0 12px}p{color:#6d5d56}#status{padding:12px;border-radius:14px;background:#f5e4eb}ul{list-style:none;margin:18px 0;padding:0;display:grid;gap:10px}li{border:1px solid #e6ddd5;background:#fff;border-radius:15px;padding:13px;display:flex;align-items:center;justify-content:space-between;gap:12px}li span{overflow-wrap:anywhere;font-weight:650}li button{flex-shrink:0;padding:9px 13px;font-size:13px}footer{border-top:1px solid #e6ddd5;margin-top:28px;padding-top:20px;color:#6d5d56;font-size:13px}a{color:inherit}
header{margin-bottom:36px}main{max-width:880px}#stickers{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}li{display:flex;flex-direction:column;align-items:stretch;text-align:center;padding:12px;gap:10px}li img{width:100%;aspect-ratio:1;object-fit:contain;background:repeating-conic-gradient(#f5f1ed 0% 25%,white 0% 50%) 0/16px 16px;border-radius:12px}li span{font-size:14px}#all{width:100%;margin:8px 0}#progress{font-size:13px}button:focus-visible{outline:3px solid #b54f80;outline-offset:3px}</style></head><body><main><header><img src="/pop-and-peel/assets/logo.svg" alt="Pop &amp; Peel Studio"><button id="lang" type="button">ES</button></header><h1 id="title"></h1><p id="intro"></p><p id="status" role="status"></p><button id="all" hidden></button><p id="progress" role="status"></p><ul id="stickers"></ul><footer><a href="mailto:hello@thelaunchera.com">hello@thelaunchera.com</a> · Pop &amp; Peel Studio</footer></main><script>
const api='https://ulmjngflopipcradglno.supabase.co/functions/v1/pop-peel-commerce/download';const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);let es=(navigator.language||'').startsWith('es'),items=[],state='loading';const $=id=>document.getElementById(id),tr=(a,b)=>es?b:a;async function getAsset(item){const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,sticker_id:item.id})}),d=await r.json();if(!r.ok||typeof d.url!=='string'||!d.url.startsWith('https://ulmjngflopipcradglno.supabase.co/storage/v1/object/sign/'))throw Error('Unavailable');return d.url}
async function getBlob(item){const r=await fetch(await getAsset(item),{referrerPolicy:'no-referrer'});if(!r.ok)throw Error('Unavailable');return await r.blob()}
function save(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
function filename(item){return (item.title.replace(/[^a-zA-Z0-9_-]+/g,'-').slice(0,80)||'sticker')+'-'+item.id.replace(/[^a-zA-Z0-9_-]/g,'')+'.png'}
const crcTable=Array.from({length:256},(_,n)=>{for(let i=0;i<8;i++)n=n&1?0xedb88320^(n>>>1):n>>>1;return n>>>0});function crc(b){let c=0xffffffff;for(const x of b)c=crcTable[(c^x)&255]^(c>>>8);return (c^0xffffffff)>>>0}
function zip(files){const parts=[],central=[];let offset=0,cs=0;for(const f of files){const n=new TextEncoder().encode(f.name),b=f.bytes,c=crc(b),h=new Uint8Array(30+n.length),v=new DataView(h.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint32(14,c,true);v.setUint32(18,b.length,true);v.setUint32(22,b.length,true);v.setUint16(26,n.length,true);h.set(n,30);parts.push(h,b);const z=new Uint8Array(46+n.length),w=new DataView(z.buffer);w.setUint32(0,0x02014b50,true);w.setUint16(4,20,true);w.setUint16(6,20,true);w.setUint32(16,c,true);w.setUint32(20,b.length,true);w.setUint32(24,b.length,true);w.setUint16(28,n.length,true);w.setUint32(42,offset,true);z.set(n,46);central.push(z);offset+=h.length+b.length;cs+=z.length}const e=new Uint8Array(22),v=new DataView(e.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,files.length,true);v.setUint16(10,files.length,true);v.setUint32(12,cs,true);v.setUint32(16,offset,true);return new Blob([...parts,...central,e],{type:'application/zip'})}
$('all').onclick=async()=>{const b=$('all');b.disabled=true;try{const files=[];for(const item of items){$('progress').textContent=tr('Preparing ','Preparando ')+(files.length+1)+' / '+items.length;files.push({name:filename(item),bytes:new Uint8Array(await (await getBlob(item)).arrayBuffer())})}save(zip(files),'pop-and-peel-stickers.zip');$('progress').textContent=tr('Your collection is ready.','Tu colección está lista.')}catch{$('progress').textContent=tr('Download failed. Please retry.','No se pudo descargar. Inténtalo otra vez.')}finally{b.disabled=false}};
const previews=new Map();const observer=new IntersectionObserver(entries=>{for(const e of entries){if(!e.isIntersecting)continue;observer.unobserve(e.target);const img=e.target,item=items.find(x=>x.id===img.dataset.id);if(!item)continue;(async()=>{try{if(!previews.has(item.id))previews.set(item.id,URL.createObjectURL(await getBlob(item)));img.src=previews.get(item.id)}catch{img.alt=tr('Preview unavailable','Vista previa no disponible')}})()}},{rootMargin:'100px'});
function render(){document.documentElement.lang=es?'es':'en';$('lang').textContent=es?'EN':'ES';$('title').textContent=tr('Your sticker pack','Tu pack de stickers');$('intro').textContent=tr('Download each design you purchased as a transparent PNG. Keep your private email link safe.','Descarga cada diseño que compraste como PNG transparente. Guarda tu enlace privado del correo.');$('status').textContent=state==='loading'?tr('Opening your collection…','Abriendo tu colección…'):state==='ready'?tr('Your purchased designs','Tus diseños comprados'):tr('This private link is unavailable. Open the original link from your email or contact support.','Este enlace privado no está disponible. Abre el enlace original de tu correo o contacta soporte.');$('all').hidden=state!=='ready';$('all').textContent=tr('Download all stickers (ZIP)','Descargar todos los stickers (ZIP)');observer.disconnect();$('stickers').replaceChildren();for(const item of items){const li=document.createElement('li'),span=document.createElement('span'),button=document.createElement('button');const img=document.createElement('img');img.alt=item.title;img.dataset.id=item.id;span.textContent=item.title;button.textContent=tr('Download PNG','Descargar PNG');button.addEventListener('click',async()=>{button.disabled=true;try{save(await getBlob(item),filename(item))}catch{button.textContent=tr('Try again','Inténtalo otra vez')}finally{button.disabled=false}});li.append(img,span,button);$('stickers').append(li);observer.observe(img)}}$('lang').onclick=()=>{es=!es;render()};render();(async()=>{try{if(!/^[A-Za-z0-9_-]{43}$/.test(token))throw Error();const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})}),d=await r.json();if(!r.ok||!Array.isArray(d.stickers)||!d.stickers.length)throw Error();items=d.stickers;state='ready'}catch{state='error'}render()})();
</script></body></html>

const api='https://ulmjngflopipcradglno.supabase.co/functions/v1/pop-peel-commerce/download';const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);let es=(navigator.language||'').startsWith('es'),items=[],state='loading';const $=id=>document.getElementById(id),tr=(a,b)=>es?b:a;function render(){document.documentElement.lang=es?'es':'en';$('lang').textContent=es?'EN':'ES';$('title').textContent=tr('Your sticker pack','Tu pack de stickers');$('intro').textContent=tr('Download each design you purchased as a transparent PNG. Keep your private email link safe.','Descarga cada diseño que compraste como PNG transparente. Guarda tu enlace privado del correo.');$('status').textContent=state==='loading'?tr('Opening your collection…','Abriendo tu colección…'):state==='ready'?tr('Your purchased designs','Tus diseños comprados'):tr('This private link is unavailable. Open the original link from your email or contact support.','Este enlace privado no está disponible. Abre el enlace original de tu correo o contacta soporte.');$('stickers').replaceChildren();for(const item of items){const li=document.createElement('li'),span=document.createElement('span'),button=document.createElement('button');span.textContent=item.title;button.textContent=tr('Download PNG','Descargar PNG');button.addEventListener('click',async()=>{button.disabled=true;try{const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,sticker_id:item.id})}),d=await r.json();if(!r.ok||typeof d.url!=='string'||!d.url.startsWith('https://ulmjngflopipcradglno.supabase.co/storage/v1/object/sign/'))throw Error();const a=document.createElement('a');a.href=d.url;a.rel='noreferrer';a.target='_blank';a.click()}catch{button.textContent=tr('Try again','Inténtalo otra vez')}finally{button.disabled=false}});li.append(span,button);$('stickers').append(li)}}$('lang').onclick=()=>{es=!es;render()};render();(async()=>{try{if(!/^[A-Za-z0-9_-]{43}$/.test(token

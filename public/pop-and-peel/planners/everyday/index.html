<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f6d7e4"><title>My Everyday Planner | Pop &amp; Peel</title><link rel="icon" href="/pop-and-peel/assets/favicon.svg"><style>*{box-sizing:border-box}body{margin:0;background:#faf8f3;color:#292127;font:16px/1.5 system-ui,sans-serif}main{max-width:620px;margin:40px auto;padding:24px}img{display:block;max-width:100%}.logo{width:180px}.hero{background:#f6d7e4;border-radius:26px;padding:24px;margin:20px 0;display:flex;align-items:center;gap:16px}.hero img{width:105px;height:105px;object-fit:contain}h1{font-size:clamp(24px,5vw,40px);line-height:1.15;margin:6px 0}a,button{display:inline-block;border:1px solid #e0d2d8;padding:12px 18px;border-radius:40px;background:white;color:#292127;font:inherit;font-weight:700;text-decoration:none;margin:4px 4px 4px 0}#status{min-height:48px}iframe{display:block;width:100%;height:100vh;height:100dvh;border:0}</style></head><body><main id="gate"><a href="/pop-and-peel/"><img class="logo" src="/pop-and-peel/assets/logo.svg" alt="Pop &amp; Peel"></a><div class="hero"><div><small>PRIVATE PLANNER ACCESS</small><h1>My Everyday Planner</h1></div><img src="https://ulmjngflopipcradglno.supabase.co/functions/v1/pop-peel-planner-mascot/20261128-creator-coffee-and-work-girl" alt="" width="220" height="220"></div><p id="status" role="status">Verificando acceso al planner…</p><a href="/pop-peel-studio/">Iniciar sesión en Studio</a><button id="retry">Volver a intentar</button><p>La vista completa está reservada a la cuenta administradora mientras se prepara la entrega de compras. / Full access is currently restricted to the store administrator.</p><noscript>Abre esta página en Safari o Chrome con JavaScript habilitado.</noscript></main><script>
const status=document.getElementById('status');let busy=false;async function openPlanner(){if(busy)return;busy=true;try{const session=JSON.parse(localStorage.getItem('pop-peel-private-studio-auth')||'null');const token=session?.access_token;if(!token)throw Error('Inicia sesión en el Studio con tu cuenta de administración. Después vuelve a este enlace.');status.textContent='Abriendo planner…';const r=await fetch('https://ulmjngflopipcradglno.supabase.co/functions/v1/pop-peel-planner-app',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({edition:'everyday'})});const d=await r.json();if(!r.ok||typeof d.html!=='string')throw Error(r.status===401?'Tu sesión necesita actualizarse. Abre el Studio y vuelve aquí.':r.status===403?'Esta cuenta no tiene acceso.':'El planner no pudo cargar. Inténtalo de nuevo.');document.open();document.write(d.html);document.close()}catch(e){status.textContent=e.message||'No se pudo conectar.';busy=false}}document.getElementById('retry').onclick=openPlanner;openPlanner();</script></body></html>

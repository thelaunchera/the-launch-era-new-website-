const status=document.getElementById('status'),purchase=location.hash.slice(1)||history.state?.plannerPurchase||'',id='everyday',lang=new URLSearchParams(location.search).get('lang')==='es'||navigator.language.startsWith('es')?'es':'en',tr=(a,b)=>lang==='es'?b:a;

let busy=false;async function openPlanner(){if(busy)return;busy=true;try{const headers={'Content-Type':'application/json'},body={edition:id};if(purchase){if(!/^[A-Za-z0-9_-]{43}$/.test(purchase))throw Error(tr('Open your private order link again.','Vuelve a abrir el enlace privado de tu pedido.'));body.purchase_token=purchase}else{let session=null;try{session=JSON.parse(localStorage.getItem('pop-peel-private-studio-auth')||'null')}catch{};if(!session?.access_token)throw Error(tr('Open the link from your purchase email or sign into Studio.','Abre el enlace de tu correo de compra o inicia sesión en Studio.'));headers.Authorization='Bearer '+session.access_token}status.textContent=tr('Opening your planner…','Abriendo tu planner…');const r=await fetch('https://ulmjngflopipcradglno.supabase.co/functions/v1/pop-peel-planner-app',{method:'POST',headers,body:JSON.stringify(body),cache:'no-store'});const d=await r.json();if(!r.ok||typeof d.html!=='string')throw Error(tr('Access unavailable. Open your original order email or contact support.','Acceso no disponible. Abre el correo original del pedido o contacta soporte.'));const html=purchase?d.html.replace('href="/pop-peel-studio/"','href="/pop-and-peel/planners/"'):d.html;document.open();document.write(html);document.close()}catch(e){status.textContent=e.message||tr('Could not connect.','No se pudo conectar.');busy=false}}document.getElementById('retry').onclick=openPlanner;openPlanner();</script></body></html>

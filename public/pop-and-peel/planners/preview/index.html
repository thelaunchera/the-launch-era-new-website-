<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FAF8F3"><title>Planner Browser Demo | Pop &amp; Peel</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/pop-and-peel/assets/favicon.svg"><style>
*{box-sizing:border-box}body{margin:0;background:#faf8f3;color:#30272e;font:16px/1.5 system-ui,sans-serif}header{max-width:960px;margin:auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}header img{width:145px;display:block}main{max-width:960px;margin:auto;padding:8px 20px 38px}.hero{background:#f7dce9;padding:30px;border-radius:25px;margin-bottom:18px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;color:#92456b}.hero h1{font:700 clamp(35px,6vw,62px)/1.05 Georgia,serif;color:#743b58;margin:10px 0}.hero p{margin:0}.panel{background:white;border:1px solid #e9dfd8;border-radius:20px;padding:20px;min-width:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel h2{font:700 25px Georgia,serif;color:#743b58;margin:0 0 12px}.row{display:flex;align-items:center;gap:8px;margin:9px 0}.row input[type=text]{flex:1;min-width:0}input,textarea,button{font:inherit;color:inherit;border:1px solid #e5d8d9;border-radius:12px;background:#fff;padding:10px}input[type=checkbox]{accent-color:#9c4a70;width:22px;height:22px}button{cursor:pointer;min-height:44px;font-weight:700}button.primary{background:#9c4a70;color:white;border:0}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #9c4a70}textarea{width:100%;min-height:130px;resize:vertical}label{display:block}.bar{background:#f3e8ec;border-radius:99px;height:8px;overflow:hidden;margin:10px 0}.bar span{display:block;background:#ba7195;height:100%}.muted{font-size:13px;color:#695d64}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.done{text-decoration:line-through;opacity:.65}a{color:#743b58}.footer{margin:20px 0;font-size:13px}.datebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}@media(max-width:650px){.grid{grid-template-columns:1fr}.hero{padding:22px}.panel{padding:16px}header{padding:12px}.row{gap:5px}.datebar input{max-width:100%}}select{font:inherit;padding:10px;border:1px solid #e5d8d9;background:white;border-radius:12px;max-width:100%}.hero{position:relative;overflow:hidden}.hero:after{content:'';position:absolute;right:22px;top:18px;width:34px;height:34px;border:1px solid currentColor;border-radius:50%;opacity:.15;pointer-events:none}</style></head><body><header><a href="/pop-and-peel/"><img src="/pop-and-peel/assets/logo.svg" alt="Pop &amp; Peel"></a><button id="lang">ES</button></header><main><div class="toolbar"><label for="editionChoice">Planner / Agenda</label><select id="editionChoice"><option value="everyday">My Everyday Planner</option><option value="wellness">The Wellness Club</option><option value="creative">The Creative Planner</option><option value="money">Money &amp; Goals</option></select></div><div class="hero"><div class="eyebrow" id="edition">POP &amp; PEEL · PLANNER DEMO</div><h1 id="title">My Everyday Planner</h1><p id="subtitle">Browser demo · sample pages only</p></div><div class="datebar"><button id="prev" aria-label="Previous day">‹</button><input type="date" id="date" aria-label="Date"><button id="next" aria-label="Next day">›</button><button id="today"></button></div><div class="toolbar"><button id="backup"></button><button id="restore"></button><input type="file" id="file" accept="application/json" hidden><span class="muted" id="status" role="status"></span></div><div class="grid"><section class="panel"><h2 id="taskTitle"></h2><div class="bar"><span id="progress"></span></div><div id="tasks"></div><p id="jsHint" class="muted">If the planner does not start, open this link in Safari or Chrome. / Si no inicia, abre el enlace en Safari o Chrome.</p><div class="row"><input type="text" id="newTask" maxlength="300"><button id="add" class="primary">+</button></div></section><section class="panel"><h2 id="noteTitle"></h2><textarea id="notes"></textarea><h2 id="habitTitle" style="margin-top:20px"></h2><div id="habits"></div></section></div><p class="footer" id="foot"></p><a id="back" href="/pop-and-peel/"></a></main><script>
const $=id=>document.getElementById(id),key='pop-peel-planner-browser-demo-v1';let state={lang:'en',days:{},edition:'everyday'},storage=true;try{const raw=localStorage.getItem(key);if(raw){const v=JSON.parse(raw);if(v.days&&['en','es'].includes(v.lang))state=v}}catch{storage=false}const tr=(a,b)=>state.lang==='es'?b:a;const ld=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');let day=ld(new Date());const D=()=>state.days[(state.edition||'everyday')+'|'+day]??={tasks:[],notes:'',habits:[false,false,false]};function save(){try{localStorage.setItem(key,JSON.stringify(state));$('status').textContent=tr('Saved on this device','Guardado en este dispositivo')}catch{$('status').textContent=tr('Storage unavailable. Export a backup.','Almacenamiento no disponible. Exporta una copia.');storage=false}}
const editions={everyday:{title:['My Everyday Planner','Mi agenda diaria'],tag:['Make room for little things.','Haz espacio para las pequeñas cosas.'],color:'#f7dce9',ink:'#743b58',habits:[['Water','Agua'],['Movement','Movimiento'],['Me time','Tiempo para mí']]},wellness:{title:['The Wellness Club','Club de bienestar'],tag:['Small rituals. Softer days.','Pequeños rituales. Días más suaves.'],color:'#e2ecdf',ink:'#426950',habits:[['Hydration','Hidratación'],['Rest','Descanso'],['Self-care','Autocuidado']]},creative:{title:['The Creative Planner','Agenda creativa'],tag:['Make space for good ideas.','Haz espacio para las buenas ideas.'],color:'#e8e0f3',ink:'#654c94',habits:[['Brainstorm','Ideas'],['Create','Crear'],['Review','Revisar']]},money:{title:['Money & Goals','Dinero y metas'],tag:['Make every little dollar count.','Cada pequeño dólar cuenta.'],color:'#f8ebbd',ink:'#855b21',habits:[['Track expenses','Registrar gastos'],['Review budget','Revisar presupuesto'],['Save a little','Ahorrar un poco']]}};function draw(){document.documentElement.lang=state.lang;$('lang').textContent=tr('ES','EN');for(const [id,a,b] of [['edition','POP & PEEL · FREE MINI PLANNER','POP & PEEL · MINI PLANNER GRATIS'],['title','Little plans, lovely days.','Pequeños planes, días bonitos.'],['subtitle','A little space to organize your day.','Un espacio para organizar tu día.'],['taskTitle','Today’s priorities','Prioridades de hoy'],['noteTitle','Notes','Notas'],['habitTitle','Little habits','Pequeños hábitos'],['today','Today','Hoy'],['backup','Export backup','Exportar copia'],['restore','Restore backup','Restaurar copia'],['foot','Your entries stay in this browser and device. Back up regularly. No account required.','Tus datos quedan en este navegador y dispositivo. Exporta copias regularmente. No necesitas cuenta.'],['back','Back to Pop & Peel','Volver a Pop & Peel']])$(id).textContent=tr(a,b);$('date').value=day;$('date').setAttribute('aria-label',tr('Date','Fecha'));$('newTask').placeholder=tr('Add a task…','Añade una tarea…');$('newTask').setAttribute('aria-label',$('newTask').placeholder);$('add').setAttribute('aria-label',tr('Add task','Añadir tarea'));$('notes').value=D().notes;$('notes').setAttribute('aria-label',tr('Notes','Notas'));$('notes').oninput=()=>{D().notes=$('notes').value;save()};const h=$('habits');h.replaceChildren();(editions[state.edition]||editions.everyday).habits.forEach((n,i)=>{const l=document.createElement('label');l.className='row';const c=document.createElement('input');c.type='checkbox';c.checked=!!D().habits[i];c.onchange=()=>{D().habits[i]=c.checked;save()};l.append(c,document.createTextNode(tr(...n)));h.append(l)});tasks();const ed=editions[state.edition]||editions.everyday;$('editionChoice').value=state.edition||'everyday';$('edition').textContent=tr('POP & PEEL · BROWSER DEMO','POP & PEEL · DEMO WEB');$('title').textContent=tr(...ed.title);$('subtitle').textContent=tr(...ed.tag)+' · '+tr('Sample pages only','Páginas de muestra');document.querySelector('.hero').style.background=ed.color;$('title').style.color=ed.ink;$('jsHint').hidden=true;if(!storage)$('status').textContent=tr('Storage unavailable. Export a backup.','Almacenamiento no disponible. Exporta una copia.')}
function tasks(){const d=D(),root=$('tasks');root.replaceChildren();for(const [i,t] of d.tasks.entries()){const r=document.createElement('div');r.className='row';const c=document.createElement('input');c.type='checkbox';c.checked=t.done;c.setAttribute('aria-label',tr('Complete task','Completar tarea'));c.onchange=()=>{t.done=c.checked;save();tasks()};const f=document.createElement('input');f.type='text';f.value=t.text;f.className=t.done?'done':'';f.setAttribute('aria-label',tr('Task','Tarea'));f.oninput=()=>{t.text=f.value;save()};const x=document.createElement('button');x.textContent='×';x.setAttribute('aria-label',tr('Delete task','Eliminar tarea'));x.onclick=()=>{d.tasks.splice(i,1);save();tasks()};r.append(c,f,x);root.append(r)}$('progress').style.width=(d.tasks.length?100*d.tasks.filter(x=>x.done).length/d.tasks.length:0)+'%'}
function add(){const i=$('newTask');if(!i.value.trim())return;D().tasks.push({text:i.value.trim(),done:false});i.value='';save();tasks()}$('add').onclick=add;$('newTask').onkeydown=e=>{if(e.key==='Enter')add()};function setDay(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return;day=v;draw()}function move(n){const d=new Date(day+'T12:00:00');d.setDate(d.getDate()+n);setDay(ld(d))}$('date').onchange=e=>setDay(e.target.value);$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('today').onclick=()=>setDay(ld(new Date()));$('lang').onclick=()=>{state.lang=tr('es','en');save();draw()};$('backup').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({type:'pop-peel-demo',...state})],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='pop-peel-demo-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('restore').onclick=()=>$('file').click();$('file').onchange=async e=>{try{const v=JSON.parse(await e.target.files[0].text());if(v.type!=='pop-peel-demo'||!v.days||!['en','es'].includes(v.lang)||!Object.values(v.days).every(x=>Array.isArray(x.tasks)&&Array.isArray(x.habits)&&typeof x.notes==='string'))throw Error();if(confirm(tr('Replace your entries?','¿Reemplazar tus datos?'))){state={lang:v.lang,days:v.days,edition:editions[v.edition]?v.edition:'everyday'};save();draw()}}}catch{$('status').textContent=tr('Invalid backup','Copia inválida')}finally{e.target.value=''}};$('editionChoice').onchange=e=>{state.edition=e.target.value;save();draw()};draw();</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FAF8F3"><title>Mini Planner | Pop &amp; Peel</title><link rel="icon" href="/pop-and-peel/assets/favicon.svg"><style>
*{box-sizing:border-box}body{margin:0;background:#faf8f3;color:#30272e;font:16px/1.5 system-ui,sans-serif}header{max-width:960px;margin:auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}header img{width:145px;display:block}main{max-width:960px;margin:auto;padding:8px 20px 38px}.hero{background:#f7dce9;padding:30px;border-radius:25px;margin-bottom:18px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;color:#92456b}.hero h1{font:700 clamp(35px,6vw,62px)/1.05 Georgia,serif;color:#743b58;margin:10px 0}.hero p{margin:0}.panel{background:white;border:1px solid #e9dfd8;border-radius:20px;padding:20px;min-width:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel h2{font:700 25px Georgia,serif;color:#743b58;margin:0 0 12px}.row{display:flex;align-items:center;gap:8px;margin:9px 0}.row input[type=text]{flex:1;min-width:0}input,textarea,button{font:inherit;color:inherit;border:1px solid #e5d8d9;border-radius:12px;background:#fff;padding:10px}input[type=checkbox]{accent-color:#9c4a70;width:22px;height:22px}button{cursor:pointer;min-height:44px;font-weight:700}button.primary{background:#9c4a70;color:white;border:0}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #9c4a70}textarea{width:100%;min-height:130px;resize:vertical}label{display:block}.bar{background:#f3e8ec;border-radius:99px;height:8px;overflow:hidden;margin:10px 0}.bar span{display:block;background:#ba7195;height:100%}.muted{font-size:13px;color:#695d64}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.done{text-decoration:line-through;opacity:.65}a{color:#743b58}.footer{margin:20px 0;font-size:13px}.datebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}@media(max-width:650px){.grid{grid-template-columns:1fr}.hero{padding:22px}.panel{padding:16px}header{padding:12px}.row{gap:5px}.datebar input{max-width:100%}}[hidden]{display:none!important}.signup{max-width:540px;margin:22px auto;padding:clamp(20px,5vw,38px);border-radius:25px;background:#fff}.signup h1{font:700 clamp(30px,6vw,45px)/1.1 Georgia,serif;color:#743b58;margin:10px 0}.signup form{display:grid;gap:12px;margin-top:20px}.signup input[type=email]{width:100%;min-height:48px;font-size:16px}.signup .consent{display:flex;align-items:flex-start;gap:10px;font-size:14px}.signup .consent input{flex:none;margin:2px 0}.signup button{border-radius:999px;min-height:48px}.signup button:disabled{opacity:.55}.signup #signupStatus{margin:0;min-height:20px}.signup a{text-decoration:underline}</style></head><body><header><a href="/pop-and-peel/"><img src="/pop-and-peel/assets/logo.svg" alt="Pop &amp; Peel"></a><button id="lang">ES</button></header><main><section class="panel signup" id="signup"><div class="eyebrow" id="signupEyebrow">A LITTLE GIFT FROM POP &amp; PEEL</div><h1 id="signupTitle">Your free Mini Planner.</h1><p id="signupText">Enter your email to open your planner. No account or purchase required.</p><form id="signupForm"><label for="signupEmail" id="emailLabel">Email address</label><input type="email" id="signupEmail" maxlength="254" required autocomplete="email" placeholder="you@example.com"><label class="consent"><input type="checkbox" id="signupConsent"><span id="consentText">I'd like to receive news and offers from Pop &amp; Peel Studio (optional). I can unsubscribe anytime.</span></label><button type="submit" class="primary" id="unlock">Open my free planner</button><p class="muted" id="signupStatus" role="status"></p></form><p class="muted"><a id="privacy" href="/pop-and-peel/legal/#privacy">Privacy &amp; policies</a></p><noscript>Enable JavaScript in your browser to use the planner.</noscript></section><div id="plannerApp" hidden><div class="hero"><div class="eyebrow" id="edition"></div><h1 id="title"></h1><p id="subtitle"></p></div><div class="datebar"><button id="prev" aria-label="Previous day">‹</button><input type="date" id="date" aria-label="Date"><button id="next" aria-label="Next day">›</button><button id="today"></button></div><div class="toolbar"><button id="backup"></button><button id="restore"></button><input type="file" id="file" accept="application/json" hidden><span class="muted" id="status" role="status"></span></div><div class="grid"><section class="panel"><h2 id="taskTitle"></h2><div class="bar"><span id="progress"></span></div><div id="tasks"></div><div class="row"><input type="text" id="newTask" maxlength="300"><button id="add" class="primary">+</button></div></section><section class="panel"><h2 id="noteTitle"></h2><textarea id="notes"></textarea><h2 id="habitTitle" style="margin-top:20px"></h2><div id="habits"></div></section></div><p class="footer" id="foot"></p><a id="back" href="/pop-and-peel/planners/"></a></div></main><script>
const $=id=>document.getElementById(id),key='pop-peel-mini-v1';const params=new URLSearchParams(location.search);let state={lang:params.get('lang')==='es'?'es':'en',days:{}},storage=true;try{const raw=localStorage.getItem(key);if(raw){const v=JSON.parse(raw);if(v.days&&['en','es'].includes(v.lang))state=v}}catch{storage=false}if(['es','en'].includes(params.get('lang')))state.lang=params.get('lang');const tr=(a,b)=>state.lang==='es'?b:a;const ld=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');let day=ld(new Date());const D=()=>{const v=state.days[day];if(!v||!Array.isArray(v.tasks)||!Array.isArray(v.habits)||typeof v.notes!=='string')state.days[day]={tasks:[],notes:'',habits:[false,false,false]};return state.days[day]};function save(){try{localStorage.setItem(key,JSON.stringify(state));$('status').textContent=tr('Saved on this device','Guardado en este dispositivo')}catch{$('status').textContent=tr('Storage unavailable. Export a backup.','Almacenamiento no disponible. Exporta una copia.');storage=false}}
function draw(){document.documentElement.lang=state.lang;drawSignup();$('lang').textContent=tr('ES','EN');for(const [id,a,b] of [['edition','POP & PEEL · FREE MINI PLANNER','POP & PEEL · MINI PLANNER GRATIS'],['title','Little plans, lovely days.','Pequeños planes, días bonitos.'],['subtitle','A little space to organize your day.','Un espacio para organizar tu día.'],['taskTitle','Today’s priorities','Prioridades de hoy'],['noteTitle','Notes','Notas'],['habitTitle','Little habits','Pequeños hábitos'],['today','Today','Hoy'],['backup','Export backup','Exportar copia'],['restore','Restore backup','Restaurar copia'],['foot','Your entries stay in this browser and device. Back up regularly. No account required.','Tus datos quedan en este navegador y dispositivo. Exporta copias regularmente. No necesitas cuenta.'],['back','Back to planners','Volver a planners']])$(id).textContent=tr(a,b);$('date').value=day;$('date').setAttribute('aria-label',tr('Date','Fecha'));$('newTask').placeholder=tr('Add a task…','Añade una tarea…');$('newTask').setAttribute('aria-label',$('newTask').placeholder);$('add').setAttribute('aria-label',tr('Add task','Añadir tarea'));$('notes').value=D().notes;$('notes').setAttribute('aria-label',tr('Notes','Notas'));$('notes').oninput=()=>{D().notes=$('notes').value;save()};const h=$('habits');h.replaceChildren();[['Water','Agua'],['Movement','Movimiento'],['Me time','Tiempo para mí']].forEach((n,i)=>{const l=document.createElement('label');l.className='row';const c=document.createElement('input');c.type='checkbox';c.checked=!!D().habits[i];c.onchange=()=>{D().habits[i]=c.checked;save()};l.append(c,document.createTextNode(tr(...n)));h.append(l)});tasks();if(!storage)$('status').textContent=tr('Storage unavailable. Export a backup.','Almacenamiento no disponible. Exporta una copia.')}
function tasks(){const d=D(),root=$('tasks');root.replaceChildren();for(const [i,t] of d.tasks.entries()){const r=document.createElement('div');r.className='row';const c=document.createElement('input');c.type='checkbox';c.checked=t.done;c.setAttribute('aria-label',tr('Complete task','Completar tarea'));c.onchange=()=>{t.done=c.checked;save();tasks()};const f=document.createElement('input');f.type='text';f.value=t.text;f.className=t.done?'done':'';f.setAttribute('aria-label',tr('Task','Tarea'));f.oninput=()=>{t.text=f.value;save()};const x=document.createElement('button');x.textContent='×';x.setAttribute('aria-label',tr('Delete task','Eliminar tarea'));x.onclick=()=>{d.tasks.splice(i,1);save();tasks()};r.append(c,f,x);root.append(r)}$('progress').style.width=(d.tasks.length?100*d.tasks.filter(x=>x.done).length/d.tasks.length:0)+'%'}
function add(){const i=$('newTask');if(!i.value.trim())return;D().tasks.push({text:i.value.trim(),done:false});i.value='';save();tasks()}$('add').onclick=add;$('newTask').onkeydown=e=>{if(e.key==='Enter')add()};function setDay(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return;day=v;draw()}function move(n){const d=new Date(day+'T12:00:00');d.setDate(d.getDate()+n);setDay(ld(d))}$('date').onchange=e=>setDay(e.target.value);$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('today').onclick=()=>setDay(ld(new Date()));$('lang').onclick=()=>{state.lang=tr('es','en');save();draw()};$('backup').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({type:'pop-peel-mini',...state})],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='pop-peel-mini-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('restore').onclick=()=>$('file').click();$('file').onchange=async e=>{try{const v=JSON.parse(await e.target.files[0].text());if(v.type!=='pop-peel-mini'||!v.days||!['en','es'].includes(v.lang)||!Object.values(v.days).every(x=>Array.isArray(x.tasks)&&Array.isArray(x.habits)&&typeof x.notes==='string'))throw Error();if(confirm(tr('Replace your entries?','¿Reemplazar tus datos?'))){state={lang:v.lang,days:v.days};save();draw()}}catch{$('status').textContent=tr('Invalid backup','Copia inválida')}finally{e.target.value=''}};const unlockKey='pop-peel-mini-access-v1';let unlocked=false,busy=false;try{unlocked=localStorage.getItem(unlockKey)==='1'}catch{}function drawSignup(){const labels={signupEyebrow:['A LITTLE GIFT FROM POP & PEEL','UN REGALITO DE POP & PEEL'],signupTitle:['Your free Mini Planner.','Tu Mini Planner gratis.'],signupText:['Enter your email to open your planner. No account or purchase required.','Escribe tu correo para abrir tu planner. Sin cuenta ni compra.'],emailLabel:['Email address','Correo electrónico'],consentText:["I’d like to receive news and offers from Pop & Peel Studio (optional). I can unsubscribe anytime.",'Quiero recibir novedades y ofertas de Pop & Peel Studio (opcional). Puedo cancelar cuando quiera.'],unlock:['Open my free planner','Abrir mi planner gratis'],privacy:['Privacy & policies','Privacidad y políticas']};for(const [id,v] of Object.entries(labels))$(id).textContent=tr(...v);$('signup').hidden=unlocked;$('plannerApp').hidden=!unlocked;$('back').href='/pop-and-peel/planners/?lang='+state.lang;} $('signupForm').onsubmit=async e=>{e.preventDefault();if(busy||!e.target.reportValidity())return;busy=true;$('unlock').disabled=true;$('signupStatus').textContent=tr('Opening your planner…','Abriendo tu planner…');try{const r=await fetch('https://ulmjngflopipcradglno.supabase.co/functions/v1/pop-peel-freebie',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({product:'mini-planner',email:$('signupEmail').value.trim(),consent:$('signupConsent').checked,language:state.lang})});const d=await r.json();if(!r.ok||d.planner_ready!==true)throw Error('Unavailable');unlocked=true;try{localStorage.setItem(unlockKey,'1')}catch{}$('signupEmail').value='';draw()}catch{$('signupStatus').textContent=tr('We couldn’t open your planner. Please try again.','No pudimos abrir tu planner. Inténtalo de nuevo.')}finally{busy=false;$('unlock').disabled=false}};draw();</script></body></html>

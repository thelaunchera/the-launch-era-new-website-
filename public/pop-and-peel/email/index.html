<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Pop &amp; Peel · Your sticker pack</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf7f1;color:#211f1e;font:16px/1.6 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(100%,520px);background:white;border:1px solid #e9e3db;border-radius:28px;padding:clamp(22px,6vw,42px);text-align:center;box-shadow:0 10px 40px #201b1410}img{width:165px;max-width:90%;height:auto}h1{line-height:1.15;font-size:clamp(25px,6vw,36px);letter-spacing:-.04em}button,a.download{display:block;width:100%;background:#211f1e;color:white;border:0;border-radius:40px;padding:13px 20px;font:inherit;font-weight:650;text-decoration:none;cursor:pointer;margin:10px 0}button:disabled{opacity:.55;cursor:wait}a.back{color:#534b46;font-size:14px}#status{min-height:1.5em;color:#554c45}#files a{background:#f1e9dd;color:#211f1e}button:focus-visible,a:focus-visible{outline:3px solid #ebbc48;outline-offset:4px}[hidden]{display:none!important}footer{margin-top:24px;font-size:13px;color:#695e55}</style></head>
<body><main><img alt="Pop &amp; Peel Studio" src="/pop-and-peel/assets/logo.svg?v=20261128hd"><h1 id="title"></h1><p id="description"></p><button id="action" type="button"></button><p id="status" role="status" aria-live="polite"></p><div id="files"></div><a class="back" href="/pop-and-peel/" id="back"></a><footer>Pop &amp; Peel Studio · Powered by The Launch Era</footer></main>
<script>
(()=>{const p=new URLSearchParams(location.hash.slice(1)||history.state?.popPeelEmailFragment||'');const es=p.get('lang')==='es';document.documentElement.lang=es?'es':'en';const t=(en,sp)=>es?sp:en;const token=p.get('unsubscribe')||p.get('access')||'',unsub=p.has('unsubscribe');const $=id=>document.getElementById(id),btn=$('action'),status=$('status'),files=$('files');
const valid=/^[0-9a-f-]{36}\.[A-Za-z0-9_-]{43}$/i.test(token);if(valid&&location.hash)history.replaceState({popPeelEmailFragment:location.hash.slice(1)},'',location.pathname);$('title').textContent=unsub?t('Email preferences','Preferencias de correo'):t('Your little fitness pack','Tu pack fitness');$('description').textContent=unsub?t('Stop receiving promotional emails from Pop & Peel Studio. Your purchases are not affected.','Deja de recibir promociones de Pop & Peel Studio. Tus compras no se ven afectadas.'):t('Confirm your email and get five digital stickers. You can refresh your private download links here.','Confirma tu correo y recibe cinco stickers digitales. Puedes renovar tus enlaces privados aquí.');btn.textContent=unsub?t('Unsubscribe','Cancelar suscripción'):t('Confirm & download','Confirmar y descargar');$('back').textContent=t('Back to the shop','Volver a la tienda');if(!valid){btn.hidden=true;$('back').href='/pop-and-peel/?lang='+(es?'es':'en')+'#starter-pack';$('back').textContent=t('Request your pack again','Volver a solicitar mi pack');status.textContent=t('This link is incomplete or unavailable. Open the latest email or request your pack again.','Este enlace está incompleto o ya no está disponible. Abre el correo más reciente o vuelve a solicitar el pack.');return;}let confirmed=false;btn.onclick=async()=>{btn.disabled=true;status.textContent=t('Working…','Un momento…');try{const res=await fetch('https://ulmjngflopipcradglno.supabase.co/functions/v1/pop-peel-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:unsub?'unsubscribe':confirmed?'download':'confirm',token}),cache:'no-store',referrerPolicy:'no-referrer'});const d=await res.json();if(!res.ok)throw Error();if(unsub){status.textContent=t('You are unsubscribed.','Has cancelado tu suscripción.');btn.hidden=true;return;}if(!Array.isArray(d.stickers)||d.stickers.length!==5)throw Error();files.replaceChildren();for(const s of d.stickers){if(typeof s.url!=='string'||!s.url.startsWith('https://ulmjngflopipcradglno.supabase.co/storage/v1/object/sign/pop-peel-originals/'))throw Error();const a=document.createElement('a');a.className='download';a.textContent=s.title;a.href=s.url;a.target='_blank';a.rel='noopener noreferrer';files.append(a);}confirmed=true;btn.textContent=t('Refresh download links','Renovar enlaces');status.textContent=t('Your five files are ready. Links expire in 10 minutes.','Tus cinco archivos están listos. Los enlaces caducan en 10 minutos.');}catch{files.replaceChildren();status.textContent=t('We could not open this link. Try again or contact hello@thelaunchera.com.','No pudimos abrir el enlace. Intenta de nuevo o escribe a hello@thelaunchera.com.');}finally{btn.disabled=false;}};
})();
</script></body></html>

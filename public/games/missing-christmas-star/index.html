      en:{lang:'ESPAÑOL',soundOn:'SOUND ON',soundOff:'SOUND OFF',helpTitle:'How to open and use this game',help:'Play directly in your browser on a phone, tablet, or computer. No account or installation is needed. Your progress stays in this browser, so use the same device to continue. Ask for hints when you need them and print your certificate at the end.',eyebrow:'An interactive Christmas adventure',title:'The Missing Christmas Star',lead:'The workshop is ready. The sleigh is waiting. But the star that lights the way has vanished. Follow the clues, solve four cozy puzzles, and bring Christmas Eve back to life.',age:'Ages 8+ with family',duration:'Play at your pace',devices:'Phone · tablet · desktop',nameLabel:'Your first name (optional)',namePlaceholder:'Your name',begin:'Begin the adventure',continueGame:'Continue your adventure',startHelp:'No account or timer pressure. Progress stays in this browser.',artCaption:'The story begins on Christmas Eve',artMark:'Four rooms. One mystery.',previewEyebrow:'Inside the adventure',previewTitle:'A world to explore',previewText:'Every room holds a small piece of the mystery.',welcome:'Welcome, {name}',friend:'friend',progress:'Room {n} of 5',minutes:'{n} min played',stamps:'Your clue book',stampIntro:'A number appears after every solved puzzle.',locked:'Locked',hint:'Ask for a hint',nextHint:'Another hint',restart:'Start over',restartConfirm:'Start a new game? Your current progress will be erased.',back:'Back to story',check:'Check answer',tryAgain:'Not quite. Take another look at the clues.',completed:'Puzzle solved!',room1:'The Mailroom',room2:'The Toy Bench',room3:'The Cookie Kitchen',room4:'The Winter Sky',room5:'The Star Door',room1Story:'Three letters arrived just before the snowstorm. Each child is waiting for one special gift. Match the gifts to their letters to uncover the first clue.',room1Instruction:'Tap a gift, then tap the child whose letter describes it. Tap a child again to remove a gift.',gifts:'Gifts waiting es are scattered among the stars. Follow the astronomer’s note to trace their order.',room4Instruction:'The bell comes first. The mitten is between the bell and the moon. The moon comes immediately before the star. The tree comes after the star.',skyShapes:'Tap the shapes in order',bell:'Bell',moon:'Moon',star:'Star',tree:'Tree',mitten:'Mitten',tapped:'Your path: {values}',clear:'Clear path',fiveShapes:'Tap all five shapes to check your path.',room4Hint1:'Put the bell at the beginning and the tree at the end.',room4Hint2:'The full path is bell → mitten → moon → star → tree.',room5Story:'The four clues fit into the lock on the Star Door. Read the note, place the numbers in the right order, and light the way for the sleigh.',room5Instruction:'“First look to the sky. Then visit the toys. Follow the smell of cookies. Finally, return to the letters.”',order:'Sky → toys → cookies → letters',enterCode:'Enter the four-digit code',unlock:'Open the Star Door',codeLength:'The door needs four digits.',codeWrong:'The lock clicked, but did not open. Follow the order in the note.',room5Hint1:'Use the numbers in your clue book. The rooms are in a different order here.',room5Hint2:'Read the Star, Tree, Bell, and Stocking stamps in that order.',stampStar:'Star',stampTree:'Tree',stampBell:'Bell',stampStocking:'Stocking',rewardTitle:'You found a clue!',rewardText:'The {symbol} stamp carries the number {digit}. Keep it safe: every stamp will help open the Star Door.',continue:'Continue the story',toDoor:'Go to the Star Door',finishEyebrow:'The Christmas Eve mystery is solved',finishTitle:'The star is home.',finishText:'The workshop glows again. The sleigh has its light, the little train is awake, and every letter has found its gift. You brought the magic back.',certificate:'Certificate of Christmas Courage',awardedTo:'Proudly awarded to',certificateText:'for solving The Missing Christmas Star and helping light the way on Christmas Eve.',print:'Print certificate',playAgain:'Play again',h       es:{lang:'ENGLISH',soundOn:'SONIDO SÍ',soundOff:'SONIDO NO',helpTitle:'Cómo abrir y usar este juego',help:'Juega directamente en el navegador desde tu teléfono, tableta o computadora. No necesitas cuenta ni instalación. El progreso se queda en este navegador; usa el mismo dispositivo para continuar. Puedes pedir pistas e imprimir el certificado al terminar.',eyebrow:'Una aventura navideña interactiva',title:'La estrella perdida de Navidad',lead:'El taller está listo y el trineo espera. Pero la estrella que ilumina el camino ha desaparecido. Sigue las pistas, resuelve cuatro acertijos y salva la Nochebuena.',age:'Desde 8 años en familia',duration:'Juega a tu ritmo',devices:'Móvil · tableta · computadora',nameLabel:'Tu nombre (opcional)',namePlaceholder:'Tu nombre',begin:'Empezar la aventura',continueGame:'Continuar la aventura',startHelp:'Sin cuenta ni presión de tiempo. El progreso se guarda en este navegador.',artCaption:'La historia empieza en Nochebuena',artMark:'Cuatro lugares. Un misterio.',previewEyebrow:'Dentro de la aventura',previewTitle:'Un mundo por descubrir',previewText:'Cada lugar guarda una parte del misterio.',welcome:'Bienvenida, {name}',friend:'amiga',progress:'Lugar {n} de 5',minutes:'{n} min de juego',stamps:'Tu libreta de pistas',stampIntro:'Cada acertijo resuelto revela un número.',locked:'Cerrado',hint:'Pedir una pista',nextHint:'Otra pista',restart:'Empezar de nuevo',restartConfirm:'¿Empezar una partida nueva? Se borrará el progreso actual.',back:'Volver a la historia',check:'Comprobar',tryAgain:'Todavía no. Revisa las pistas una vez más.',completed:'¡Acertijo resuelto!',room1:'La oficina de cartas',room2:'El taller de juguetes',room3:'La cocina de galletas',room4:'El cielo de invierno',room5:'La puerta de la estrella',room1Story:'Llegaron tres cartas antes de la tormenta. Cada niño espera un regalo especial. Relaciona los regalos con las cartas para descubrir la primera pista.',room1Instruction:'Toca un regalo y después al niño que lo o figuras brillan entre las estrellas. Sigue la nota del astrónomo para trazar el camino.',room4Instruction:'La campana va primero. El guante está entre la campana y la luna. La luna va justo antes de la estrella. El árbol va después de la estrella.',skyShapes:'Toca las figuras en orden',bell:'Campana',moon:'Luna',star:'Estrella',tree:'Árbol',mitten:'Guante',tapped:'Tu camino: {values}',clear:'Borrar camino',fiveShapes:'Toca las cinco figuras para comprobar.',room4Hint1:'Pon la campana al principio y el árbol al final.',room4Hint2:'El camino es campana → guante → luna → estrella → árbol.',room5Story:'Las cuatro pistas encajan en la cerradura. Lee la nota y ordena los números para iluminar el camino del trineo.',room5Instruction:'«Primero mira al cielo. Luego visita los juguetes. Sigue el aroma de las galletas. Por último, vuelve a las cartas».',order:'Cielo → juguetes → galletas → cartas',enterCode:'Escribe el código de cuatro números',unlock:'Abrir la puerta',codeLength:'Necesitas cuatro números.',codeWrong:'La cerradura hizo clic, pero no se abrió. Sigue el orden de la nota.',room5Hint1:'Usa los números de tu libreta. Aquí aparecen en otro orden.',room5Hint2:'Lee las marcas de estrella, árbol, campana y calcetín en ese orden.',stampStar:'Estrella',stampTree:'Árbol',stampBell:'Campana',stampStocking:'Calcetín',rewardTitle:'¡Encontraste una pista!',rewardText:'La marca de {symbol} tiene el número {digit}. Guárdalo: necesitarás todas las marcas para abrir la puerta.',continue:'Seguir la historia',toDoor:'Ir a la puerta',finishEyebrow:'Misterio de Nochebuena resuelto',finishTitle:'La estrella volvió.',finishText:'El taller brilla de nuevo. El trineo tiene luz, el tren despertó y cada carta encontró su regalo. Devolviste la magia a la Nochebuena.',certificate:'Certificado de valentía navideña',awardedTo:'Entregado con cariño a',certificateText:'por resolver La estrella perdida de Navidad e iluminar el camino en Nochebuena.',print:'Imprimir certificado',playAgain:'Jugar     };
    const roomKeys=['room1','room2','room3','room4','room5'];
    const stamps=[{symbol:'✧',label:'stampStocking'},{symbol:'♠',label:'stampTree'},{symbol:'◉',label:'stampBell'},{symbol:'✦',label:'stampStar'}];
    const giftKeys=['book','mittens','cocoa'],personKeys=['ava','noah','mia'],colors=['red','green','gold','blue'],skyKeys=['tree','star','bell','moon','mitten'];
    const skyAnswer=['bell','mitten','moon','star','tree'];
    let saved;try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch{saved=null}
    const newState=(lang='en',sound=true)=>({lang,sound,screen:'start',current:0,completed:[false,false,false,false],digits:shuffle([2,4,6,9]),name:'',startedAt:0,hints:[0,0,0,0,0],assign:{},selectedGift:null,recipe:[],sky:[],memory:[],memoryIndex:0,memoryReady:false,memorySeen:false,feedback:'',solvedIndex:0});
    let s=saved&&saved.digits?.length===4&&Array.isArray(saved.completed)&&saved.completed.length===4?{...newState(),...saved}:newState();
    if(!['en','es'].includes(s.lang))s.lang='en';
    let memoryToken=0,audioCtx=null;
    const $=q=>document.querySelector(q), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const t=(k,v={})=>String(translations[s.lang][k]??k).replace(/\{(\w+)\}/g,(_,p)=>v[p]??'');
    function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
    function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}}
    function tone(freq=520){if(!s.sound)return;try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.06,audioCtx.currentTime+.025);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.22);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.23)}catch{}}
    const sceneImages=['mailroom','toy-bench','cookie-kitchen','winter-sky','star-door'];
    function heroArt(){return `<div class="illustration"><img src="assets/cover.webp" alt="${s.lang==='en'?'A glowing North Pole workshop among snowy pines':'Un taller iluminado entre pinos nevados en el Polo Norte'}" width="1100" height="1375" fetchpriority="high"><div class="art-caption"><span>${t('artCaption')}</span><span>${t('artMark')}</span></div></div>`}
    function preview(){return `<section class="preview" aria-labelledby="preview-title"><div class="preview-head"><div><div class="eyebrow">${t('previewEyebrow')}</div><h2 id="preview-title">${t('previewTitle')}</h2></div><p>${t('previewText')}</p></div><div class="preview-grid">${sceneImages.slice(0,4).map((image,i)=>`<figure class="preview-card"><img src="assets/${image}.webp" alt="" loading="lazy" width="1100" height="734"><figcaption><small>0${i+1}</small>${t('room'+(i+1))}</figcaption></figure>`).join('')}</div></section>`}
    function renderStart(){return `<section class="hero"><div class="hero-copy"><div class="eyebrow">${t('eyebrow')}</div><h1>${t('title')}</h1><p class="lead">${t('lead')}</p><div class="hero-meta"><span>${t('age')}</span><span>${t('duration')}</span><span>${t('devices')}</span></div><form class="start-form" id="start-form"><input class="text-input" id="player-name" aria-label="${t('nameLabel')}" placeholder="${t('namePlaceholder')}" maxlength="32" autocomplete="given-name" value="${esc(s.name)}"><button class="primary" type="submit">${s.startedAt?t('continueGame'):t('begin')}</button></form><p class="helper">${t('startHelp')}</p></div>${heroArt()}</section>${preview()}`}
    function side(){return `<aside class="card side"><h3>${t('stamps')}</h3><p class="side-intro">${t('stampIntro')}</p><div class="stamp-grid">${stamps.map((x,i)=>`<div class="stamp ${s.completed[i]?'earned':''}"><span class="symbol" aria-hidden="true">${x.symbol}</span><small>${t(x.label)}</small><strong>${s.completed[i]?s.digits[i]:'—'}</strong></div>`).join('')}</div><div class="side-note">${t('startHelp')}</div><div class="side-actions"><button class="secondary" data-game-step="hint">${s.hints[s.current]?t('nextHint'):t('hint')}</button><button class="secondary" data-game-step="restart">${t('restart')}</button></div>${s.hints[s.current]?`<div class="hint-box" role="status"><strong>${t('hint')}</strong>${t(`room${s.current+1}Hint${Math.min(s.hints[s.current],2)}`)}</div>`:''}</aside>`}
    function puzzle1(){return `<div class="puzzle"><p class="puzzle-title">${t('gifts')}</p><div class="gift-row">${giftKeys.map(g=>`<button type="button" class="option ${s.selectedGift===g?'selected':''}" data-gift="${g}" aria-pressed="${s.selectedGift===g}"><strong>${t(g)}</strong><small>${s.selectedGift===g?'✓':''}</small></button>`).join('')}</div><p class="puzzle-title">${t('letters')}</p><div class="person-row">${personKeys.map(p=>`<button type="button" class="option person" data-person="${p}"><strong>${t(p)}</strong><small>${t(p+'Clue')}</small>${s.assign[p]?`<span class="assigned">${t(s.assign[p])} ×</span>`:''}</button>`).join('')}</div><div class="puzzle-actions"><button class="primary" data-game-step="check1">${t('check')}</button></div></div>`}
    function puzzle2(){return `<div class="puzzle"><p class="memory-status" id="memory-status" role="status">${s.memorySeen?t('yourTurn',{n:s.memory.length}):t('room2Instruction')}</p><div class="light-grid">${colors.map((c,i)=>`<button type="button" class="light" data-color="${c}" data-light="${i}" aria-label="${t(c)}" ${s.memoryReady?'':'disabled'}><strong aria-hidden="true">${['●','◆','✦','●'][i]}</strong><small>${t(c)}</small></button>`).join('')}</div><div class="sequence-dots" aria-label="${s.memoryIndex} of ${s.memory.length} correct">${Array.from({length:5},(_,i)=>`<span class="${i<s.memoryIndex?'on':''}"></span>`).join('')}</div><div class="puzzle-actions"><button class="primary" data-game-step="watch">${s.memorySeen?t('watchAgain'):t('watch')}</button></div></div>`}
    function puzzle3(){return `<div class="puzzle"><p class="puzzle-title">${t('trays')}</p><div class="choice-grid">${[2,3,4,5,6,7].map(n=>`<button type="button" class="option tray ${s.recipe.includes(n)?'selected':''}" data-tray="${n}" aria-pressed="${s.recipe.includes(n)}"><strong>${n}</strong><small>✧ ✧ ✧</small></button>`).join('')}</div><p class="selection-summary">${t('selected',{values:s.recipe.length?s.recipe.join(' + '):t('none'),total:s.recipe.reduce((a,b)=>a+b,0)})}</p><div class="puzzle-actions"><button class="primary" data-game-step="check3">${t('check')}</button></div></div>`}
    function puzzle4(){return `<div class="puzzle"><p class="puzzle-title">${t('skyShapes')}</p><div class="star-grid">${skyKeys.map((k,i)=>`<button type="button" class="option star-option ${s.sky.includes(k)?'used':''}" data-sky="${k}" ${s.sky.includes(k)?'disabled':''}><strong aria-hidden="true">${['♠','✦','◉','☾','◈'][i]}</strong><small>${t(k)}</small></button>`).join('')}</div><p class="selection-summary">${t('tapped',{values:s.sky.length?s.sky.map(k=>t(k)).join(' → '):'—'})}</p><div class="puzzle-actions"><button class="primary" data-game-step="check4">${t('check')}</button><button class="secondary" data-game-step="clearSky">${t('clear')}</button></div></div>`}
    function puzzle5(){return `<div class="puzzle"><p class="puzzle-title">${t('order')}</p><div class="final-order">${[3,1,2,0].map(i=>`<span>${stamps[i].symbol} ${t(stamps[i].label)}: ${s.digits[i]}</span>`).join('')}</div><form id="lock-form"><label class="puzzle-title" for="lock-code">${t('enterCode')}</label><div class="puzzle-actions"><input class="text-input code-input" id="lock-code" type="text" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" aria-label="${t('enterCode')}"><button class="primary" type="submit">${t('unlock')}</button></div></form></div>`}
    function renderGame(){const i=s.current,game=[puzzle1,puzzle2,puzzle3,puzzle4,puzzle5][i]();return `<div class="game-top"><div><div class="eyebrow">${t('progress',{n:i+1})}</div><h1>${t('room'+(i+1))}</h1><p>${t('title')}</p></div><div class="timer" id="timer"></div></div><div class="progress" aria-label="${t('progress',{n:i+1})}">${Array.from({length:5},(_,j)=>`<span class="${j<i?'done':j===i?'active':''}"></span>`).join('')}</div><div class="game-layout"><section class="card"><div class="scene-art"><img src="assets/${sceneImages[i]}.webp" alt="" width="1100" height="734"></div><div class="scene-head"><div><div class="eyebrow">${t('progress',{n:i+1})}</div><h2>${t('room'+(i+1))}</h2></div></div><p class="scene-story">${t('room'+(i+1)+'Story')}</p><div class="scene-instruction">${t('room'+(i+1)+'Instruction')}</div>${game}${s.feedback?`<div class="feedback" role="status">${t(s.feedback)}</div>`:''}</section>${side()}</div>`}
    function renderReward(){const i=s.solvedIndex;return `<div class="reward-wrap"><div class="reward-card"><div class="reward-icon">${stamps[i].symbol}</div><div class="eyebrow">${t('completed')}</div><h1>${t('rewardTitle')}</h1><p>${t('rewardText',{symbol:t(stamps[i].label).toLowerCase(),digit:s.digits[i]})}</p><div class="reward-actions"><button class="primary" data-game-step="continue">${i===3?t('toDoor'):t('continue')}</button></div></div></div>`}
    function renderFinish(){return `<div class="certificate"><div class="seal">✦</div><div class="eyebrow">${t('finishEyebrow')}</div><h1>${t('finishTitle')}</h1><p>${t('finishText')}</p><h2 style="margin:30px 0 8px">${t('certificate')}</h2><p>${t('awardedTo')}</p><div class="name">${esc(s.name||t('friend'))}</div><p>${t('certificateText')}</p><div class="small-print">${t('withLove')}</div></div><div class="finish-actions"><p>${t('hintsUsed',{n:s.hints.reduce((a,b)=>a+b,0)})}</p><button class="primary" data-game-step="print">${t('print')}</button> <button class="secondary" data-game-step="restart">${t('playAgain')}</button></div>`}
    function render(){document.documentElement.lang=s.lang;$('#lang-btn').textContent=t('lang');$('#sound-btn').textContent=t(s.sound?'soundOn':'soundOff');$('#sound-btn').setAttribute('aria-pressed',String(s.sound));$('#help-title').textContent=t('helpTitle');$('#help-copy').textContent=t('help');$('#legal-copy').textContent=t('legalCopy');document.title=t('title')+' · '+(s.lang==='en'?'A family escape game':'Un juego familiar');$('#app').innerHTML=s.screen==='start'?renderStart():s.screen==='game'?renderGame():s.screen==='reward'?renderReward():renderFinish();tick();save()}
    function tick(){const el=$('#timer');if(el&&s.startedAt)el.textContent=t('minutes',{n:Math.max(1,Math.floor((Date.now()-s.startedAt)/60000))})}
    function feedback(k){s.feedback=k;render()}
    function solve(i){tone(750);s.completed[i]=true;s.solvedIndex=i;s.screen='reward';s.feedback='';s.memoryReady=false;memoryToken++;render();window.scrollTo({top:0,behavior:'smooth'})}
    async function watch(){if(s.current!==1||s.screen!=='game')return;const token=++memoryToken;s.memorySeen=true;s.memoryReady=false;s.memoryIndex=0;s.feedback='';if(!s.memory.length)s.memory=Array.from({length:5},()=>Math.floor(Math.random()*4));render();const status=$('#memory-status');status.textContent=t('watching');await delay(420);for(const n of s.memory){if(token!==memoryToken)return;const el=document.querySelector(`[data-light="${n}"]`);el?.classList.add('lit');tone([420,480,550,630][n]);await delay(650);el?.classList.remove('lit');await delay(260)}if(token!==memoryToken)return;s.memoryReady=true;render();$('#memory-status').textContent=t('yourTurn',{n:s.memory.length})}
    const delay=ms=>new Promise(r=>setTimeout(r,ms));
    document.addEventListener('click',e=>{if(e.target.closest('#lang-btn')){s.lang=s.lang==='en'?'es':'en';render();return}if(e.target.closest('#sound-btn')){s.sound=!s.sound;tone();render();return}const gift=e.target.closest('[data-gift]');if(gift){s.selectedGift=gift.dataset.gift;s.feedback='';tone(470);render();return}const person=e.target.closest('[data-person]');if(person){const p=person.dataset.person;if(s.selectedGift){for(const k of personKeys)if(s.assign[k]===s.selectedGift)delete s.assign[k];s.assign[p]=s.selectedGift;s.selectedGift=null;tone(600)}else if(s.assign[p])delete s.assign[p];else{s.feedback='chooseGift';render();return}s.feedback='';render();return}const tray=e.target.closest('[data-tray]');if(tray){const n=Number(tray.dataset.tray);s.recipe=s.recipe.includes(n)?s.recipe.filter(v=>v!==n):s.recipe.length<3?[...s.recipe,n]:s.recipe;s.feedback='';tone(510);render();return}const sky=e.target.closest('[data-sky]');if(sky){if(s.sky.length<5){s.sky.push(sky.dataset.sky);s.feedback='';tone(450+s.sky.length*55);render()}return}const light=e.target.closest('[data-light]');if(light){if(!s.memoryReady)return;const n=Number(light.dataset.light);tone([420,480,550,630][n]);if(n===s.memory[s.memoryIndex]){s.memoryIndex++;if(s.memoryIndex===s.memory.length){solve(1);return}const status=$('#memory-status');status.textContent=t('goodTap',{n:s.memoryIndex,total:s.memory.length});document.querySelectorAll('.sequence-dots span').forEach((d,i)=>d.classList.toggle('on',i<s.memoryIndex));save()}else{s.memoryReady=false;s.memoryIndex=0;feedback('memoryWrong')}return}const action=e.target.closest('[data-game-step]')?.dataset.gameStep;if(!action)return;switch(action){case 'watch':watch();break;case 'check1':if(personKeys.some(p=>!s.assign[p]))feedback('allLetters');else if(s.assign.ava==='book'&&s.assign.noah==='mittens'&&s.assign.mia==='cocoa')solve(0);else feedback('tryAgain');break;case 'check3':if(s.recipe.length!==3)feedback('threeTrays');else if([3,5,7].every(n=>s.recipe.includes(n)))solve(2);else feedback('tryAgain');break;case 'check4':if(s.sky.length!==5)feedback('fiveShapes');else if(s.sky.every((k,i)=>k===skyAnswer[i]))solve(3);else feedback('tryAgain');break;case 'clearSky':s.sky=[];s.feedback='';render();break;case 'hint':s.hints[s.current]=Math.min(2,s.hints[s.current]+1);render();break;case 'continue':s.current=s.solvedIndex+1;s.screen='game';s.feedback='';render();window.scrollTo({top:0,behavior:'smooth'});break;case 'restart':if(window.confirm(t('restartConfirm'))){memoryToken++;s=newState(s.lang,s.sound);render();window.scrollTo({top:0,behavior:'smooth'})}break;case 'print':window.print();break;}});
    document.addEventListener('submit',e=>{if(e.target.id==='start-form'){e.preventDefault();s.name=$('#player-name').value.trim().slice(0,32);s.startedAt||=Date.now();s.screen='game';render();window.scrollTo({top:0,behavior:'smooth'})}if(e.target.id==='lock-form'){e.preventDefault();const code=$('#lock-code').value.replace(/\D/g,'');const answer=[3,1,2,0].map(i=>s.digits[i]).join('');if(code.length!==4)feedback('codeLength');else if(code!==answer)feedback('codeWrong');else{tone(880);s.screen='finish';s.feedback='';render();window.scrollTo({top:0,behavior:'smooth'})}}});
    setInterval(tick,30000);render();
  })();
  </script>

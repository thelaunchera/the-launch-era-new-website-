<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ayuda y contacto — The Launch Era</title><style>*{box-sizing:border-box}body{margin:0;background:#FAF8F3;color:#191919;font-family:Arial,sans-serif}.sale{padding:8px 18px;background:#191919;color:#fff;text-align:center;font-size:11px;font-weight:800;letter-spacing:.06em}.nav{height:72px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #ddd}.nav a{color:inherit;text-decoration:none;font-weight:800}.brand{letter-spacing:.1em}.wrap{width:min(850px,calc(100% - 32px));margin:auto}.hero{padding:80px 0 35px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.12em}h1{font-family:Georgia,serif;font-size:clamp(48px,8vw,80px);line-height:.96;margin:12px 0}.lead{font-size:18px;line-height:1.6}.help form{display:grid;gap:14px;padding-bottom:70px}.help label{display:grid;gap:7px;font-weight:800;font-size:13px}.help input,.help textarea,.help select{padding:13px;border:1px solid #aaa;font:inherit;background:#fff}.help textarea{min-height:120px}.cta{padding:15px;background:#191919;color:#fff;border:0;font-weight:900}.note{background:#eaf4ff;padding:24px}.status{font-size:13px;font-weight:700}</style></head><body><div class="sale">EL DESCUENTO TERMINA EN <b id="clock"></b></div><nav class="nav"><a class="brand" href="/es">THE LAUNCH ERA</a><div><a href="/help">EN</a> · <a href="/es">Inicio</a></div></nav><main class="wrap help"><section class="hero"><div class="eyebrow">HABLEMOS</div><h1>Cuéntanos sobre tu negocio.</h1><p class="lead">Unos pocos detalles para comenzar una conversación útil. Tu consulta llega directamente a The Launch Era.</p></section><form id="f"><label>Tu nombre *<input name="name" required autocomplete="name"></label><label>Correo electrónico *<input name="email" type="email" required autocomplete="email"></label><label>Nombre del negocio *<input name="business" required autocomplete="organization"></label><label>¿En qué podemos ayudarte?<select name="service"><option>Booking + Lead Automation</option><option>Cleaning Web App</option><option>Website Automation</option><option>Virtual Assistant</option><option>No estoy segura todavía</option></select></label><label>¿Qué está ocupando demasiado de tu tiempo? *<textarea name="message" required></textarea></label><button class="cta" id="b" type="submit">Enviar mi consulta →</button><div class="status" id="st"></div></form></main><script>const f=document.getElementById('f'),b=document.getElementById('b'),st=document.getElementById('st');f.onsubmit=async e=>{e.preventDefault();b.disabled=true;st.textContent='Enviando…';const d=Object.fromEntries(new FormData(f).entries());try{const r=await fetch('https://bowacxhmjvrqixtwaikv.supabase.co/functions/v1/tle-contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:d.name,email:d.email,business_name:d.business,help_needed:[d.service],message:d.message,language:'es',source:'main_website_es',started_at:Date.now()-3000,website:''})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw 0;f.innerHTML='<div class="note"><strong>✓ Consulta enviada.</strong><p>La recibimos en The Launch Era y te contactaremos pronto.</p></div>'}catch{b.disabled=false;st.textContent='No pudimos enviar tu consulta. Inténtalo otra vez.'}}</script><script>(()=>{const e=new Date('2026-10-11T11:01:04Z').getTime(),x=document.getElementById('clock');function t(){const r=Math.max(0,e-Date.now());if(!r){x.textContent='OFERTA TERMINADA';return}const d=Math.floor(r/864e5),h=Math.floor(r%864e5/36e5),m=Math.floor(r%36e5/6e4),s=Math.floor(r%6e4/1e3);x.textContent=d+'D : '+String(h).padStart(2,'0')+'H : '+String(m).padStart(2,'0')+'M : '+String(s).padStart(2,'0')+'S'}t();setInterval(t,1000)})()</script></body></html>

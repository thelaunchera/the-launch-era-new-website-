<style>html,body{margin:0;padding:0;background:#000;width:100%;height:100%;overflow:hidden}canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.143.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.143.0/examples/jsm/"}}</script></head><body><canvas id="scene"></canvas>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

import {CopyShader} from 'three/addons/shaders/CopyShader.js';
// Owner-approved TLE palette adaptation; all movement/geometry constants retained.
const CONFIG={bgColor:'#191919',flameColor:'#aee9ff',flameColor2:'#FAF8F3',flameAmt:.2,colorA:'#b8ddf5',colorB:'#8fc8ee',colorC:'#FAF8F3',opacity:2,pointSize:50,brightness:1.85,drift:2.35,twinkle:1,spin:.03,repelRadius:5,repelStrength:.35,scrollPush:8,scrollDrift:6,scrollSpin:.1,parallax:.6};
const hexToVec3=hex=>{const n=parseInt(hex.slice(1),16);return new THREE.Vector3(((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255)};
const renderer=new THREE.WebGL1Renderer({canvas:document.querySelector('#scene'),antialias:true});
const ratio=()=>Math.min(devicePixelRatio,matchMedia('(pointer:coarse)').matches?1:2);
renderer.setPixelRatio(ratio());renderer.setSize(innerWidth,innerHeight,false);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.VSMShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x000000);scene.fog=new THREE.Fog(0x000000,0,15);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,80);camera.position.set(0,0,5);
const LAYERS={NONE:0,TORUS_SCENE:1,BLOOM_SCENE:2,ENTIRE_SCENE:3};
camera.layers.enable(1);camera.layers.enable(2);camera.layers.enable(3);scene.add(camera);
const renderScene=new RenderPass(scene,camera);
const torusComposer=new EffectComposer(renderer);torusComposer.renderToScreen=false;
torusComposer.addPass(renderScene);torusComposer.addPass(new ShaderPass(GammaCorrectionShader));torusComposer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.22,.2,0));torusComposer.addPass(new ShaderPass(CopyShader));
const bloomComposer=new EffectComposer(renderer);bloomComposer.renderToScreen=false;bloomComposer.addPass(renderScene);bloomComposer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.4,.55,0));bloomComposer.addPass(new ShaderPass(GammaCorrectionShader));
const finalComposer=new EffectComposer(renderer);finalComposer.addPass(renderScene);
// Explicit black halo avoids sampling an unbound/null texture.
const halo=new THREE.DataTexture(new Uint8Array([0,0,0,255]),1,1);halo.needsUpdate=true;
const finalPass=new ShaderPass({uniforms:{iTime:{value:0},tDiffuse:{value:null},torusTexture:{value:torusComposer.renderTarget1.texture},bloomTexture:{value:bloomComposer.renderTarget1.texture},haloTexture:{value:halo},uBg:{value:hexToVec3(CONFIG.bgColor)},uFlameA:{value:hexToVec3(CONFIG.flameColor)},uFlameB:{value:hexToVec3(CONFIG.flameColor2)},uFlameAmt:{value:CONFIG.flameAmt}},vertexShader:`varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position, 1.0); }`,fragmentShader:`
uniform float iTime; uniform sampler2D tDiffuse; uniform sampler2D bloomTexture; uniform sampler2D torusTexture; uniform sampler2D haloTexture;
uniform vec3 uBg; uniform vec3 uFlameA; uniform vec3 uFlameB; uniform float uFlameAmt;
varying vec2 vUv;
vec3 warp3d(vec3 pos, float t){ float curv=.8,a=1.9,b=0.7; pos*=2.;
  pos.x+=curv*sin(t+a*pos.y)+t*b; pos.y+=curv*cos(t+a*pos.x);
  pos.y+=curv*sin(t+a*pos.z)+t*b; pos.z+=curv*cos(t+a*pos.y);
  pos.z+=curv*sin(t+a*pos.x)+t*b; pos.x+=curv*cos(t+a*pos.z);
  return 0.5+0.5*cos(pos.xyz+vec3(1,2,4)); }
void main(){
  vec2 uv = 2.*vUv - 1.;
  vec3 w = pow(warp3d(vec3(uv.x, sin(uv.y), uv.y), iTime*1.5), vec3(1.5));
  vec3 flame = 1.5*uFlameA*w.x; flame*=w.y; flame += uFlameB*w.z;
  flame *= smoothstep(0.25, 1., abs(uv.y));
  float md = smoothstep(-0.7, 1., -uv.y*uv.x); flame *= md*md;
  vec3 bg = uBg * (1.0 - 0.4 * length(uv));
  vec3 halo = texture2D(haloTexture, vUv).xyz;
  gl_FragColor = vec4(bg + flame*uFlameAmt + texture2D(bloomTexture, vUv).xyz + texture2D(torusTexture, vUv).xyz + texture2D(tDiffuse, vUv).xyz + halo, 1.);
}`});finalComposer.addPass(finalPass);
const count=4200,depth=30,positions=new Float32Array(count*3),palette=new Float32Array(count),bright=new Float32Array(count),scales=new Float32Array(count),phases=new Float32Array(count);
for(let i=0;i<count;i++){let i3=i*3;positions[i3]=(Math.random()-.5)*24;positions[i3+1]=(Math.random()-.5)*16;positions[i3+2]=(Math.random()-.5)*30;palette[i]=Math.floor(Math.random()*3);bright[i]=.7+Math.random()*.6;scales[i]=.5+Math.pow(Math.random(),1.4)*2.5;phases[i]=Math.random()}
const geometry=new THREE.BufferGeometry();for(const [name,data,size] of [['position',positions,3],['aScale',scales,1],['aPhase',phases,1],['aPalette',palette,1],['aBright',bright,1]])geometry.setAttribute(name,new THREE.Float32BufferAttribute(data,size));
const material=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:{uTime:{value:0},uSize:{value:50},uOpacity:{value:0},uDrift:{value:0},uDepth:{value:depth},uTwinkle:{value:1},uCursor:{value:new THREE.Vector3()},uRepelRadius:{value:5},uRepelStrength:{value:.35},uActivity:{value:0},uColorA:{value:hexToVec3(CONFIG.colorA)},uColorB:{value:hexToVec3(CONFIG.colorB)},uColorC:{value:hexToVec3(CONFIG.colorC)},uBrightness:{value:1.85}},vertexShader:`
uniform float uTime; uniform float uSize; uniform float uDrift; uniform float uDepth; uniform float uTwinkle;
uniform vec3 uCursor; uniform float uRepelRadius; uniform float uRepelStrength; uniform float uActivity;
uniform vec3 uColorA; uniform vec3 uColorB; uniform vec3 uColorC;
attribute float aScale; attribute float aPhase; attribute float aPalette; attribute float aBright;
varying vec3 vColor; varying float vTwinkle;
void main() {
  vec3 pos = position;
  // Endless drift toward +Z with mod-wrap.
  pos.z = mod(pos.z + uDrift + (uDepth * 0.5), uDepth) - (uDepth * 0.5);
  float tw = sin(uTime * 1.6 + aPhase * 6.2831);
  vTwinkle = (1.0 - uTwinkle) + uTwinkle * (0.55 + 0.45 * tw);
  vec4 modelPosition = modelMatrix * vec4(pos, 1.0);
  vec3 toParticle = modelPosition.xyz - uCursor;
  float dist = length(toParticle);
  float falloff = smoothstep(uRepelRadius, 0.0, dist);
  modelPosition.xyz += normalize(toParticle + vec3(0.0001)) * falloff * uRepelStrength * uActivity;
  vec4 viewPosition = viewMatrix * modelPosition;
  gl_Position = projectionMatrix * viewPosition;
  gl_PointSize = uSize * aScale;
  gl_PointSize *= (1.0 / -viewPosition.z);
  vec3 base = aPalette < 0.5 ? uColorA : (aPalette < 1.5 ? uColorB : uColorC);
  vColor = base * aBright;
}`,fragmentShader:`
uniform float uOpacity; uniform float uBrightness;
varying vec3 vColor; varying float vTwinkle;
void main() {
  vec2 uv = gl_PointCoord - 0.5;
  float d = length(uv);
  if (d > 0.5) discard;
  float strength = pow(1.0 - d * 2.0, 4.0);
  vec3 color = mix(vec3(0.0), vColor, strength);
  gl_FragColor = vec4(color * uBrightness, strength * uOpacity * vTwinkle);
}`});
const group=new THREE.Group(),points=new THREE.Points(geometry,material);points.layers.enable(LAYERS.ENTIRE_SCENE);group.add(points);scene.add(group);
let scrollTarget=0,scrollSmooth=0,scrollCurrent=0,visible=false,running=false,raf=0,t0=performance.now()/1000;
const appearStart=performance.now(),mouse={x:0,y:0},ndc={x:0,y:0},pointer={world:new THREE.Vector3(),activity:0,active:false,lastMove:0};
const target=new THREE.Vector3(),ray=new THREE.Vector3(),unprojected=new THREE.Vector3();
function tick(){
 if(!visible||document.hidden||matchMedia('(prefers-reduced-motion:reduce)').matches){running=false;return}
 const now=performance.now(),t=now/1000,dt=Math.min(.05,t-t0);t0=t;
 scrollSmooth=THREE.MathUtils.lerp(scrollSmooth,scrollTarget,.10);scrollCurrent=THREE.MathUtils.lerp(scrollCurrent,scrollSmooth,.06);
 mouse.x+=(ndc.x-mouse.x)*.06;mouse.y+=(ndc.y-mouse.y)*.06;
 target.set(0,0,0);
 if(pointer.active){unprojected.set(ndc.x,ndc.y,.5).unproject(camera);ray.copy(unprojected).sub(camera.position).normalize();const hit=-camera.position.z/ray.z;if(Math.abs(ray.z)>1e-4&&hit>0&&Number.isFinite(hit))target.copy(camera.position).addScaledVector(ray,hit)}
 pointer.world.lerp(target,.12);const want=pointer.active&&(now-pointer.lastMove)/1000<3?1:0;pointer.activity+=(want-pointer.activity)*.06;
 const u=material.uniforms;u.uCursor.value.copy(pointer.world);u.uActivity.value=pointer.activity;u.uTime.value=t;u.uDrift.value+=dt*(CONFIG.drift+scrollCurrent*CONFIG.scrollDrift);
 camera.position.set(mouse.x*.6,mouse.y*.6,5-scrollCurrent*8);camera.lookAt(mouse.x*.6,mouse.y*.6,-10);
 u.uOpacity.value=THREE.MathUtils.clamp((now-appearStart-300)/1400,0,1)*2;group.rotation.z+=dt*(.03+scrollCurrent*.1);finalPass.uniforms.iTime.value=t;
 camera.layers.set(LAYERS.TORUS_SCENE);torusComposer.render();camera.layers.set(LAYERS.BLOOM_SCENE);bloomComposer.render();camera.layers.set(LAYERS.ENTIRE_SCENE);finalComposer.render();
 document.documentElement.dataset.rendered='true';raf=requestAnimationFrame(tick);
}
function start(){if(!running&&visible&&!document.hidden){running=true;t0=performance.now()/1000;raf=requestAnimationFrame(tick)}}
addEventListener('message',event=>{if(event.source!==parent||event.origin!==location.origin||event.data?.type!=='tle-starfield')return;const data=event.data;
 visible=!!data.visible;scrollTarget=THREE.MathUtils.clamp(Number(data.scroll)||0,0,1);
 const x=THREE.MathUtils.clamp(Number(data.x)||0,-1,1),y=THREE.MathUtils.clamp(Number(data.y)||0,-1,1);
 if(x!==ndc.x||y!==ndc.y)pointer.lastMove=performance.now();ndc.x=x;ndc.y=y;pointer.active=!!data.active;start();
 if(!visible){cancelAnimationFrame(raf);running=false}
});
addEventListener('resize',()=>{renderer.setPixelRatio(ratio());renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();for(const composer of [torusComposer,bloomComposer,finalComposer]){composer.setPixelRatio(ratio());composer.setSize(innerWidth,innerHeight)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);running=false}else start()});
// No synthetic scroll host: actual website scroll drives the tunnel.
parent.postMessage({type:'tle-starfield-ready'},location.origin);
</script></body></html>

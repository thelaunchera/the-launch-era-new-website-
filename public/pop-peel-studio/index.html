if(run!==epoch)return;view.replaceChildren();
if(current==='orders'){header('Pedidos','Pedidos registrados en la base de datos. Los pagos todavía no están conectados.');searchRows(rows,r=>{const c=card('Pedido '+r.id.slice(0,8),money(r.total_cents,r.currency)+' · '+date(r.created_at),r.status);return c})}
if(current==='inquiries'){header('Mensajes','Registra consultas y actualiza el seguimiento. El formulario público aún no envía mensajes a esta base.');const fields=[F('name','Nombre'),F('email','Correo','email'),F('subject','Asunto'),F('message','Mensaje','textarea'),F('status','Estado','select',['new','read','replied','closed'])];searchRows(rows,r=>{const c=card(r.subject||r.email,r.message,r.status);c.append(el('p','muted',r.email+' · '+date(r.created_at)));actions(c,button('Editar',()=>openEdit('inquiries',r,fields)));return c},()=>openEdit('inquiries',null,fields))}

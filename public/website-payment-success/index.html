<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#FAF8F3"><title>Verify Payment · The Launch Era</title>
<link rel="icon" href="/assets/brand/tle-mark.svg" type="image/svg+xml">
<style>*{box-sizing:border-box}body{margin:0;background:#FAF8F3;color:#191919;font:15px/1.6 system-ui,sans-serif}header{padding:22px 25px;border-bottom:1px solid #e6ded3;font-weight:700}header a{text-decoration:none;color:inherit}main{max-width:550px;margin:clamp(40px,9vw,110px) auto;padding:0 24px;text-align:center}h1{font:400 clamp(34px,7vw,52px)/1.12 Georgia,serif;letter-spacing:-.04em}p{color:#54504b}.spinner{width:38px;height:38px;border:4px solid #dfd7c9;border-top-color:#191919;border-radius:50%;animation:spin 1s linear infinite;margin:32px auto}@keyframes spin{to{transform:rotate(360deg)}}.button{display:inline-block;background:#F2D85B;border:0;border-radius:999px;padding:15px 26px;font-weight:700;cursor:pointer;min-height:48px}button[hidden],.spinner[hidden]{display:none}footer{text-align:center;padding:22px;font-size:12px;color:#777}</style>
</head><body><header><a id="brand" href="/website-for-your-business/">THE LAUNCH ERA</a></header>
<main><div class="spinner" id="spinner"></div><h1 id="heading">Confirming your payment</h1><p role="status" aria-live="polite" id="status">We're checking your Stripe payment before opening your project setup.</p><button class="button" type="button" hidden id="retry">Check again</button><p><a id="help" href="mailto:hello@thelaunchera.com">Need help? Contact us</a></p></main>
<footer>Powered by The Launch Era</footer>
<script>
(()=>{'use strict';
 const p=new URLSearchParams(location.search),session=p.get('session_id')||'',offer=p.get('offer')||'',lang=p.get('lang')==='es'?'es':'en';
 const valid=/^cs_live_[A-Za-z0-9]+$/.test(session)&&['website-basic','website-plus','website-ai-crm'].includes(offer);
 document.documentElement.lang=lang;
 const t=lang==='es'?{heading:'Verificando tu pago',checking:'Confirmamos tu pago con Stripe antes de abrir la configuración de tu proyecto.',failed:'Aún no pudimos confirmar el pago. Si acabas de pagar, intenta nuevamente o escríbenos.',invalid:'Este enlace de confirmación no es válido. Contacta con nosotros para encontrar tu compra.',retry:'Verificar nuevamente',help:'¿Necesitas ayuda? Escríbenos'}:{heading:'Confirming your payment',checking:'We verify your Stripe payment before opening your project setup.',failed:'We could not confirm your payment yet. If you just paid, try again or contact us.',invalid:'This payment confirmation link is invalid. Contact us for help finding your order.',retry:'Check again',help:'Need help? Contact us'};
 const heading=document.querySelector('#heading'),status=document.querySelector('#status'),retry=document.querySelector('#retry'),spinner=document.querySelector('#spinner');
 heading.textContent=t.heading;retry.textContent=t.retry;document.querySelector('#help').textContent=t.help;status.textContent=t.checking;document.querySelector('#brand').href=lang==='es'?'/es/website-for-your-business/':'/website-for-your-business/';
 let busy=false;
 async function confirm(){
  if(busy)return;
  if(!valid){spinner.hidden=true;status.textContent=t.invalid;return}
  busy=true;retry.hidden=true;spinner.hidden=false;status.textContent=t.checking;
  try{
   const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),20000);
   let r;try{r=await fetch('https://fhrvuhikrybobidxpvnh.supabase.co/functions/v1/tle-studio-website-confirm-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:session,offer,lang}),signal:ctrl.signal})}finally{clearTimeout(timer)}
   const data=await r.json().catch(()=>({}));
   if(!r.ok||data.ok!==true||data.paid!==true||data.offer!==offer)throw Error('No paid receipt');
   const dest=offer==='website-basic'?'/intake/website/':offer==='website-plus'?'/intake/website-plus/':'/intake/website-ai-crm/';
   location.replace(dest+'?'+new URLSearchParams({stage:'onboarding',lang,session_id:session}).toString());
  }catch{spinner.hidden=true;retry.hidden=false;status.textContent=t.failed;busy=false}
 }
 retry.addEventListener('click',confirm);confirm();
})();
</script><script defer src="/assets/tle-global-legal-footer-20261109.js"></script>
</body></html>

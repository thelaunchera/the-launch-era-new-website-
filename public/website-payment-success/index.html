<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#FAF8F3"><title>Confirming Website Purchase | The Launch Era</title><script src="/assets/privacy-controls.js?v=20261026-1" data-site="tle"></script><style>*{box-sizing:border-box}body{margin:0;background:#FAF8F3;color:#191919;font:15px/1.65 system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:20px}.card{background:white;width:min(620px,100%);border:1px solid #ddd8d0;border-radius:16px;padding:clamp(23px,6vw,50px)}.brand{font-weight:800;font-size:12px;letter-spacing:.15em}.chip{background:#F2D85B;border-radius:99px;padding:8px 13px;display:inline-block;font-weight:800;font-size:10px;letter-spacing:.1em;margin:28px 0 15px}h1{font:500 clamp(33px,7vw,49px)/1.11 Georgia,serif;letter-spacing:-.04em;margin:0 0 14px}p{color:#555;line-height:1.7}button,a{display:inline-block;background:#191919;border:0;border-radius:999px;color:#fff;text-decoration:none;padding:14px 24px;font-weight:700;font-size:14px;min-height:49px;cursor:pointer}#return{background:#F2D85B;color:#191919}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}[hidden]{display:none!important}.small{font-size:12px}:focus-visible{outline:3px solid #3a7096;outline-offset:4px}</style></head><body><main class="card"><div class="brand">THE LAUNCH ERA</div><span class="chip" id="tag">PAYMENT VERIFICATION</span><h1 id="title">Checking your Stripe payment…</h1><p id="description">We are confirming the purchase before opening your website setup form.</p><p id="message" aria-live="polite" role="status"></p><div class="actions"><button id="retry" type="button" hidden>Check again</button><a id="return" href="/website-for-your-business/" hidden>View packages</a></div><p class="small" id="note">Do not pay again while we verify your existing transaction. No project is started without confirmed payment.</p></main><script>
const p=new URLSearchParams(location.search),session_id=p.get('session_id')||'',offer=p.get('offer')||'',es=p.get('lang')==='es';
document.documentElement.lang=es?'es':'en';
const $=id=>document.getElementById(id);
const allowed=['website-basic','website-ai-crm'];
$('tag').textContent=es?'VERIFICACIÓN DE PAGO':'PAYMENT VERIFICATION';
$('retry').textContent=es?'Verificar de nuevo':'Check again';$('return').textContent=es?'Ver paquetes':'View packages';$('return').href=es?'/es/website-for-your-business/':'/website-for-your-business';
$('note').textContent=es?'No pagues nuevamente mientras verificamos tu transacción. El proyecto no se inicia sin un pago confirmado.':'Do not pay again while we verify this transaction. No project starts without confirmed payment.';
let busy=false;
async function verify(){
 if(busy)return;busy=true;$('retry').hidden=true;$('return').hidden=true;
 $('title').textContent=es?'Verificando tu pago…':'Verifying your payment…';
 $('description').textContent=es?'Estamos comprobando tu compra con Stripe antes de abrir el intake.':'We are checking your Stripe purchase before opening the intake.';
 $('message').textContent='';
 try{
  const r=await fetch('https://fhrvuhikrybobidxpvnh.supabase.co/functions/v1/tle-studio-website-confirm-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id,offer})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok||!d.ok||d.offer!==offer||d.paid!==true)throw new Error('Not verified');
  $('title').textContent=es?'¡Pago confirmado!':'Payment confirmed!';
  $('description').textContent=es?'Tu pago está verificado. Abrimos el intake de tu paquete para que nos cuentes los detalles de tu negocio.':'Your payment has been verified. We are opening the intake for your package.';
  const next=new URL(offer==='website-basic'?'/intake/website/':'/intake/website-ai-crm/',location.origin);
  next.searchParams.set('stage','onboarding');next.searchParams.set('session_id',session_id);next.searchParams.set('lang',es?'es':'en');
  const a=document.createElement('a');a.href=next.pathname+next.search;a.id='continue';a.textContent=es?'Continuar al intake':'Continue to intake';a.style.marginTop='14px';a.style.display='inline-block';$('message').replaceChildren(a);
  location.replace(next.pathname+next.search);
 }catch{
  $('title').textContent=es?'Tu pago aún no se pudo confirmar':'We cannot confirm your payment yet';
  $('description').textContent=es?'Si acabas de pagar, evita hacer otro cobro. Verificaremos la sesión otra vez; también puedes regresar aquí desde tu recibo.':'If you just paid, do not make another payment. Try checking this session again; you can return from your receipt.';
  $('retry').hidden=false;$('return').hidden=false;
 }finally{busy=false}
}
$('retry').onclick=verify;
if(!/^cs_live_[A-Za-z0-9]+$/.test(session_id)||!allowed.includes(offer)){
 $('title').textContent=es?'Enlace de compra inválido':'Invalid purchase link';
 $('description').textContent=es?'Abre tu enlace original de compra para continuar.':'Please open your original purchase link.';
 $('return').hidden=false;
}else void verify();
</script></body></html>

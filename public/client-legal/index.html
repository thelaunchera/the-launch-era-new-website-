<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Business policies</title><style>*{box-sizing:border-box}body{margin:0;background:#faf8f3;color:#191919;font:16px/1.7 Arial,sans-serif}header,main,footer{max-width:800px;margin:auto;padding:28px 22px}header{border-bottom:1px solid #ddd}h1{font-size:clamp(28px,6vw,42px);line-height:1.2}h2{font-size:21px;margin-top:28px}a{color:#245e7e;overflow-wrap:anywhere}img{max-width:70px;max-height:70px;object-fit:contain}footer{border-top:1px solid #ddd;font-size:12px}#status{padding:12px;border:1px solid #ddd;border-radius:12px}a:focus-visible{outline:3px solid #467f9e;outline-offset:4px}</style></head><body><header><img id="logo" hidden alt=""><strong id="business"></strong><h1 id="title">Business policies</h1><a id="back" hidden>Back to Booking Page</a></header><main><p id="status" role="status">Checking the business…</p><div id="policy"></div></main><footer id="footer"></footer><script>
(async()=>{
const p=new URLSearchParams(location.search),key=p.get('key')||'',es=p.get('lang')==='es',kind=p.get('policy')==='terms'?'terms':'privacy';document.documentElement.lang=es?'es':'en';const $=id=>document.getElementById(id),tr=(a,b)=>es?b:a;
$('status').textContent=tr('Checking the business…','Verificando el negocio…');
try{if(!/^[a-zA-Z0-9_-]{24,80}$/.test(key))throw Error('Invalid business link');const response=await fetch('https://bowacxhmjvrqixtwaikv.supabase.co/functions/v1/tle-booking-flow-pricing',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'public',booking_key:key})});const model=await response.json();if(!response.ok||!model.business_name)throw Error('Business unavailable');const name=model.business_name;
$('business').textContent=name;const title=kind==='privacy'?tr('Privacy Policy','Política de privacidad'):tr('Service & Booking Terms','Términos del servicio y reservas');$('title').textContent=title;document.title=title+' | '+name;const booking='https://thelaunchera.com/booking/?key='+encodeURIComponent(key)+'&lang='+(es?'es':'en');$('back').href=booking;$('back').textContent=tr('Back to Booking Page','Volver a la página de reservas');$('back').hidden=false;
const logo=model.branding?.logo_image;if(logo){const u=new URL(logo);if(u.protocol==='https:'){$('logo').src=u.href;$('logo').alt=name;$('logo').hidden=false;}}
const sections=kind==='privacy'?[
[tr('Information you submit','Información que envías'),tr('The request form may collect your name, contact details, selected services, preferred date or time, service location and details you choose to provide.','El formulario puede recopilar tu nombre, datos de contacto, servicios seleccionados, fecha u horario preferidos, ubicación del servicio y detalles que decidas proporcionar.')],
[tr('How information is used','Uso de la información'),tr('The business uses these details to review requests, prepare quotes, discuss availability, confirm approved appointments, communicate about services and maintain business records.','El negocio utiliza estos datos para revisar solicitudes, preparar cotizaciones, consultar disponibilidad, confirmar citas aprobadas, comunicar información del servicio y mantener sus registros.')],
[tr('Service providers','Proveedores del sistema'),tr('The business uses operational systems provided by The Launch Era and supporting hosting, database and email services to process booking-related information.','El negocio utiliza sistemas operativos proporcionados por The Launch Era y servicios de alojamiento, base de datos y correo para procesar información relacionada con reservas.')],
[tr('Communication preferences','Preferencias de comunicación'),tr('Messages about your request or appointment are separate from optional follow-ups and care tips. Optional messages require your permission. Use their unsubscribe link to stop optional emails, or reply to contact the business.','Los mensajes sobre tu solicitud o cita son distintos de los seguimientos y consejos opcionales. Los mensajes opcionales requieren tu permiso. Utiliza su enlace de cancelación para detenerlos o responde para contactar al negocio.')],
[tr('Records and security','Registros y seguridad'),tr('Business records are held in access-controlled systems. Contact the business about access, correction or deletion of information you submitted. Do not include passwords or payment credentials in the request form.','Los registros se guardan en sistemas con acceso restringido. Contacta al negocio para consultar el acceso, corrección o eliminación de la información enviada. No incluyas contraseñas ni credenciales de pago en el formulario.')]
]:[
[tr('Requests are not confirmations','Solicitudes y confirmaciones'),tr('Submitting a request does not guarantee a service, agreed price or appointment. A booking is confirmed only when you receive an explicit confirmation from the business or its enabled booking system.','Enviar una solicitud no garantiza un servicio, precio acordado ni cita. La reserva queda confirmada únicamente cuando recibes una confirmación explícita del negocio o de su sistema de reservas habilitado.')],
[tr('Quotes and service details','Cotizaciones y detalles del servicio'),tr('The business confirms the scope, price and timing before the work. Estimates are subject to review; separately agreed service terms may also apply.','El negocio confirma el alcance, precio y horario antes del trabajo. Los estimados están sujetos a revisión; también pueden aplicar términos acordados por separado.')],
[tr('Changes and cancellations','Cambios y cancelaciones'),tr('Reply to your confirmation or use its change-request link to request a change. A request does not itself cancel or reschedule a confirmed appointment. The business will review and confirm available options and any applicable terms.','Responde a tu confirmación o utiliza su enlace para solicitar un cambio. La solicitud no cancela ni cambia automáticamente una cita confirmada. El negocio revisará y confirmará las opciones y los términos correspondientes.')],
[tr('Payments','Pagos'),tr('The request form does not collect payment. Payment arrangements are confirmed directly with the business. Do not send payment credentials in a message.','El formulario de solicitud no cobra pagos. Las condiciones de pago se confirman directamente con el negocio. No envíes credenciales de pago por mensaje.')],
[tr('Service questions','Consultas sobre el servicio'),tr('Confirm availability, service methods and any offered guarantees directly with the business. Provide accurate contact and service details so it can respond to your request.','Confirma directamente con el negocio la disponibilidad, métodos de servicio y cualquier garantía ofrecida. Proporciona datos de contacto y del servicio correctos para que pueda responder.')]
];for(const [heading,body]of sections){const h=document.createElement('h2'),q=document.createElement('p');h.textContent=heading;q.textContent=body;$('policy').append(h,q);}const contact=document.createElement('p');contact.textContent=tr('Questions? Contact '+name+' by replying to your service email or through its Booking Page.','¿Preguntas? Contacta a '+name+' respondiendo al correo de tu servicio o desde su página de reservas.');$('policy').append(contact);$('footer').textContent=name;$('status').hidden=true;
}catch{$('status').textContent=tr('We could not verify this business. Use the policy link in your latest email or contact the business.','No pudimos verificar este negocio. Utiliza el enlace del correo más reciente o contacta al negocio.');}
})();
</script></body></html>

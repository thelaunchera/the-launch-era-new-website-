<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#FAF8F3">
<title>Secure Checkout · The Launch Era</title><link rel="icon" href="/assets/brand/tle-mark.svg" type="image/svg+xml">
<style>*{box-sizing:border-box}body{margin:0;background:#FAF8F3;color:#191919;font:15px/1.6 system-ui,sans-serif}
header{padding:22px 25px;border-bottom:1px solid #e6ded3;font-weight:700}header a{color:inherit;text-decoration:none}
main{max-width:530px;margin:clamp(40px,9vw,110px) auto;padding:0 24px;text-align:center}h1{font:400 clamp(34px,7vw,52px)/1.1 Georgia,serif;letter-spacing:-.04em}
p{color:#585652}.spinner{width:40px;height:40px;border-radius:50%;border:4px solid #e6ddc9;border-top-color:#191919;animation:spin .9s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}.button{display:inline-block;background:#F2D85B;color:#191919;border:0;border-radius:999px;padding:14px 25px;font-weight:750;text-decoration:none;cursor:pointer;min-height:48px}
#retry[hidden],#spinner[hidden]{display:none}footer{padding:25px;text-align:center;font-size:12px;color:#777}</style>
</head><body><header><a id="brand" href="/website-for-your-business/">THE LAUNCH ERA</a></header>
<main><div id="spinner" class="spinner" aria-hidden="true"></div><h1 id="heading">Connecting to secure checkout</h1>
<p id="description" role="status" aria-live="polite">Your payment is processed securely by Stripe.</p>
<button id="retry" class="button" type="button" hidden>Try again</button>
<p><a id="back" href="/website-for-your-business/#paquetes">Back to packages</a></p></main>
<footer><p id="price-disclosure" style="font-size:13px;color:#555"></p><nav aria-label="Policies" style="display:flex;justify-content:center;gap:15px;flex-wrap:wrap"><a id="legal-terms" href="/terms.html">Terms</a><a id="legal-privacy" href="/privacy.html">Privacy</a><a id="legal-refunds" href="/refunds.html">Refunds</a></nav><p>Powered by The Launch Era</p></footer>
<script>
(()=>{'use strict';
 const params=new URLSearchParams(location.search),offer=params.get('offer'),lang=params.get('lang')==='es'?'es':'en';
 const valid=['website-basic','website-plus'].includes(offer);
 document.documentElement.lang=lang;
 const lines=lang==='es'?{title:'Conectando con el checkout seguro',loading:'El pago se procesa de forma segura con Stripe.',error:'No pudimos abrir el pago seguro. Inténtalo nuevamente.',invalid:'Selecciona un paquete antes de pagar.',retry:'Volver a intentar',back:'Volver a paquetes'}:{title:'Connecting to secure checkout',loading:'Your payment is processed securely by Stripe.',error:'We could not open secure checkout. Please try again.',invalid:'Choose a package before paying.',retry:'Try again',back:'Back to packages'};
 const back=lang==='es'?'/es/website-for-your-business/#paquetes':'/website-for-your-business/#paquetes';
 const amount=offer==='website-basic'?'$29':offer==='website-plus'?'$59':'';document.getElementById('price-disclosure').textContent=amount?(lang==='es'?amount+' USD · pago único · sin mensualidad obligatoria':amount+' USD · one-time payment · no required monthly fee'):'';
 for(const rule of [{id:'legal-terms',page:'terms.html',en:'Terms',es:'Términos'},{id:'legal-privacy',page:'privacy.html',en:'Privacy',es:'Privacidad'},{id:'legal-refunds',page:'refunds.html',en:'Refunds',es:'Reembolsos'}]){const el=document.getElementById(rule.id);el.href=(lang==='es'?'/es/':'/')+rule.page;el.textContent=rule[lang]}
 document.querySelector('#back').href=back;document.querySelector('#brand').href=back;document.querySelector('#heading').textContent=lines.title;document.querySelector('#description').textContent=lines.loading;document.querySelector('#retry').textContent=lines.retry;document.querySelector('#back').textContent=lines.back;
 let running=false;
 const retry=document.querySelector('#retry'),desc=document.querySelector('#description'),spinner=document.querySelector('#spinner');
 async function start(){
  if(running)return;
  if(!valid){spinner.hidden=true;desc.textContent=lines.invalid;return}
  running=true;retry.hidden=true;spinner.hidden=false;desc.textContent=lines.loading;
  try{
   const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),20000);
   let response;try{response=await fetch('https://fhrvuhikrybobidxpvnh.supabase.co/functions/v1/tle-studio-website-start-checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({offer,language:lang}),signal:ctrl.signal})}finally{clearTimeout(timer)}
   const data=await response.json().catch(()=>({}));
   if(!response.ok||data.ok!==true||typeof data.url!=='string')throw Error('Unavailable');
   const dest=new URL(data.url);
   if(dest.protocol!=='https:'||dest.hostname!=='checkout.stripe.com')throw Error('Invalid checkout');
   location.replace(dest.href);
  }catch{spinner.hidden=true;retry.hidden=false;desc.textContent=lines.error;running=false}
 }
 retry.addEventListener('click',start);
 start();
})();
</script><script defer src="/assets/tle-global-legal-footer-20261109.js"></script>
</body></html>

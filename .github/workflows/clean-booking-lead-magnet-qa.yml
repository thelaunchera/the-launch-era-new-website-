name: Clean Booking Lead Magnet QA
on:
  pull_request:
    paths:
      - 'public/lead-private-preview.html'
      - 'public/assets/tle-demo-hero-portal.css'
      - 'public/assets/tle-demo-hero-portal.js'
      - 'public/assets/tle-demo-reset-lead-magnet.js'
      - 'scripts/qa-clean-booking-lead-magnet.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-email-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate routes and scripts
        run: |
          node scripts/qa-route-integrity.mjs --static
          node scripts/qa-public-demo-integrity.mjs
          node --check public/assets/tle-demo-hero-portal.js
          node --check public/assets/tle-demo-reset-lead-magnet.js
          node --check scripts/qa-clean-booking-lead-magnet.mjs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Prepare six locally hosted, service-matched images
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/build_demo_photo_assets.py
          for image in regular deep move office retail medical; do
            test -s "public/assets/demo-services/$image.webp"
          done
      - name: Build
        run: |
          bun install
          bun run build
          test -s .output/public/assets/lead-demo/tle-booking-hero-original.webp
          test -s .output/public/booking-demo-reset.html
          test -s .output/public/lead-private-preview.html
      - name: Install independent Chromium
        run: |
          mkdir -p /tmp/tle-booking-clean
          cd /tmp/tle-booking-clean
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
          ln -sfn /tmp/tle-booking-clean/node_modules/playwright "$GITHUB_WORKSPACE/node_modules/playwright"
          ln -sfn /tmp/tle-booking-clean/node_modules/playwright-core "$GITHUB_WORKSPACE/node_modules/playwright-core"
      - name: Test emailed links, booking, command center and Sonny without sending
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .output/public > /tmp/tle-booking-clean-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/booking-demo-reset.html >/dev/null; then break; fi
            sleep 1
          done
          QA_URL=http://127.0.0.1:4173 node scripts/qa-clean-booking-lead-magnet.mjs

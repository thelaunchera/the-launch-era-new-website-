name: Customer Demo Email Link QA
on:
  push:
    branches: ['fix/canonical-demo-email-links-20261016']
    paths:
      - 'supabase/functions/tle-jessie-demo-lead/index.ts'
      - 'public/assets/jessy-site.js'
      - 'scripts/qa-canonical-demo-email.mjs'
      - '.github/workflows/customer-demo-email-link-qa.yml'
  pull_request:
    paths:
      - 'supabase/functions/tle-jessie-demo-lead/index.ts'
      - 'public/assets/jessy-site.js'
      - 'scripts/qa-canonical-demo-email.mjs'
      - '.github/workflows/customer-demo-email-link-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-email:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: No-send canonical email and source guards
        run: |
          node --check public/assets/jessy-site.js
          node --check scripts/qa-canonical-demo-email.mjs
          node scripts/qa-canonical-demo-email.mjs
          node scripts/qa-public-demo-integrity.mjs
          node scripts/qa-route-integrity.mjs --static

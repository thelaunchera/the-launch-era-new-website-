name: Golden Grid iPhone Freeze Guard
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/demos/golden-grid/**'
      - 'demo-source/golden-grid/**'
      - 'scripts/qa-golden-grid-stability-20261108.mjs'
      - 'scripts/qa-golden-grid-approved-video-20261108.mjs'
      - '.github/workflows/golden-grid-mobile-freeze-qa.yml'
  push:
    branches: [main]
    paths:
      - 'public/demos/golden-grid/**'
      - 'scripts/qa-golden-grid-stability-20261108.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  golden-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate Golden Grid page, script and routes
        run: |
          node scripts/qa-route-integrity.mjs --static
          node --check public/demos/golden-grid/assets/index-BVJfIY3X.js
          node --check public/demos/golden-grid/golden-gallery-20261107.js
          node --check scripts/qa-golden-grid-stability-20261108.mjs
          node --check scripts/qa-golden-grid-approved-video-20261108.mjs
          node --check public/demos/golden-grid/golden-approved-hero-video-20261108.js
          test -s public/demos/golden-grid/media/hero-approved-canva-20261108.mp4
          test -s public/demos/golden-grid/media/hero-approved-canva-20261108-firstframe.webp
          echo 'a0ba53f3d5c26a7be4424c5ab730930358ca3a9fd37273505d93b4d48a843a70  public/demos/golden-grid/media/hero-approved-canva-20261108.mp4' | sha256sum --check
          test -s public/demos/golden-grid/resources/golden-1.png
      - name: Install Chromium and WebKit
        run: |
          mkdir -p /tmp/golden-qa
          npm install --no-audit --no-fund --prefix /tmp/golden-qa playwright@1.57.0
          /tmp/golden-qa/node_modules/.bin/playwright install --with-deps chromium webkit
          ln -sfn /tmp/golden-qa/node_modules node_modules
      - name: Open hero, carousel, lightbox and return from in-app preview
        run: |
          python3 -m http.server 4191 --bind 127.0.0.1 --directory public >/tmp/golden-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4191/demos/golden-grid/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/qa-golden-grid-stability-20261108.mjs
          node scripts/qa-golden-grid-approved-video-20261108.mjs

name: TLE Route and Demo Safety Guard
on:
  workflow_dispatch:
  schedule:
    - cron: '35 12 * * *'
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'src/routes/**'
      - 'src/components/site-shell.tsx'
      - 'src/components/service-sales.tsx'
      - 'scripts/qa-route-integrity.mjs'
      - 'skills/the-launch-era-qa/**'
      - '.github/workflows/tle-route-integrity.yml'
permissions:
  contents: read
jobs:
  static-routes:
    name: Static routes, buttons and assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/qa-route-integrity.mjs
      - run: node scripts/qa-route-integrity.mjs --static
  live-smoke:
    name: Published pages and interest CORS (read only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/qa-route-integrity.mjs --live

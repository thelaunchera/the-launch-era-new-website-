name: Private AI Team QA
on:
  pull_request:
    paths:
      - 'public/command-center/ai-team.html'
      - 'public/command-center/index.html'
      - 'public/command-center/assets/ai-team*'
      - 'public/command-center/assets/jessy-owner*'
      - 'scripts/qa-ai-team.mjs'
      - 'scripts/qa-ai-team-commands.mjs'
      - 'scripts/qa-ai-team-gateway.mjs'
      - 'scripts/qa-jessy-owner.mjs'
      - '.github/workflows/ai-team-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-feature-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate standalone AI Team and private entry
        run: |
          node scripts/qa-ai-team.mjs
          node scripts/qa-ai-team-commands.mjs
          node scripts/qa-ai-team-gateway.mjs
      - name: Verify universal owner Jessie access contract
        run: node scripts/qa-jessy-owner.mjs
      - name: Verify public route and asset integrity
        run: node scripts/qa-route-integrity.mjs --static
      - name: Deny anonymous read and execution calls
        shell: bash
        run: |
          set -euo pipefail
          for action in list run_agent; do
            code="$(curl --silent --show-error --max-time 18 -o /tmp/ai-team-anon.json -w '%{http_code}' \
              -X POST -H 'Content-Type: application/json' \
              -d "{\"action\":\"$action\",\"agent_key\":\"sales\"}" \
              https://bowacxhmjvrqixtwaikv.supabase.co/functions/v1/tle-ai-team)"
            if [[ "$code" != "401" && "$code" != "403" ]]; then
              echo "::error::Unauthenticated AI Team $action unexpectedly returned $code."
              exit 1
            fi
            echo "PASS — anonymous $action denied."
          done

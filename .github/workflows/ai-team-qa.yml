name: Private AI Team QA
on:
  pull_request:
    paths:
      - 'public/command-center/ai-team.html'
      - 'public/command-center/index.html'
      - 'public/command-center/assets/ai-team*'
      - 'public/command-center/assets/jessy-owner*'
      - 'scripts/qa-ai-team.mjs'
      - 'scripts/qa-ai-team-commands.mjs'
      - 'scripts/qa-ai-team-gateway.mjs'
      - 'scripts/qa-ai-team-ai-provider.mjs'
      - 'scripts/qa-jessy-owner.mjs'
      - 'scripts/qa-jessie-unified-tenant.mjs'
      - 'scripts/qa-jessie-private-endpoints.mjs'
      - 'scripts/qa-jessie-owner-diagnostic.mjs'
      - 'scripts/qa-jessie-tenanted-edge-fixture.mjs'
      - 'scripts/qa-jessie-owner-edge-fixture.mjs'
      - '.github/workflows/ai-team-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-feature-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate standalone AI Team and private entry
        run: |
          node scripts/qa-ai-team.mjs
          node scripts/qa-ai-team-commands.mjs
          node scripts/qa-ai-team-gateway.mjs
          node scripts/qa-ai-team-ai-provider.mjs
          node scripts/qa-jessie-unified-tenant.mjs
          node scripts/qa-jessie-owner-diagnostic.mjs
          node scripts/qa-jessie-tenanted-edge-fixture.mjs
          node scripts/qa-jessie-owner-edge-fixture.mjs
          node --check public/command-center/assets/ai-team.js
      - name: Verify universal owner Jessie access contract
        run: node scripts/qa-jessy-owner.mjs
      - name: Verify public route and asset integrity
        run: node scripts/qa-route-integrity.mjs --static
      - name: Deny anonymous and invalid-origin requests on both Jessie functions
        run: node scripts/qa-jessie-private-endpoints.mjs

name: Public Pricing and Savings Motion QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/assets/tle-pricing-motion.*'
      - 'public/ai-booking-assistant/index.html'
      - 'public/es/ai-booking-assistant/index.html'
      - 'src/routes/__root.tsx'
      - 'scripts/qa-public-pricing-motion.mjs'
      - '.github/workflows/public-pricing-motion-qa.yml'
  push:
    branches: [main]
    paths:
      - 'public/assets/tle-pricing-motion.*'
      - 'public/ai-booking-assistant/index.html'
      - 'public/es/ai-booking-assistant/index.html'
      - 'src/routes/__root.tsx'
      - 'scripts/qa-public-pricing-motion.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-build-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify route integrity and real plan prices
        run: |
          node scripts/qa-route-integrity.mjs --static
          node scripts/qa-public-pricing-motion.mjs
      - name: Build production website
        run: |
          bun install
          bun run build
          test -s .output/public/assets/tle-pricing-motion.css
          test -s .output/public/assets/tle-pricing-motion.js
          grep -q 'role="radiogroup"' .output/public/ai-booking-assistant/index.html
      - name: Install Playwright Chromium for visual/keyboard regression
        run: |
          mkdir -p /tmp/tle-pricing-qa
          cd /tmp/tle-pricing-qa
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
          ln -sfn /tmp/tle-pricing-qa/node_modules/playwright "$GITHUB_WORKSPACE/node_modules/playwright"
          ln -sfn /tmp/tle-pricing-qa/node_modules/playwright-core "$GITHUB_WORKSPACE/node_modules/playwright-core"
      - name: Verify EN and ES at five screen widths without checkout calls
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .output/public >/tmp/tle-pricing-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          QA_URL=http://127.0.0.1:4173 node scripts/qa-public-pricing-motion.mjs --browser
      - name: Store pricing screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tle-public-pricing-motion
          path: qa-screenshots/tle-pricing-*.png
          if-no-files-found: ignore

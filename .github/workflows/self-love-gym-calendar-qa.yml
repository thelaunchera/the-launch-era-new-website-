name: Self Love Gym — calendar and client UX smoke test
on:
  push:
    branches: [main]
    paths:
      - 'apps-source/self-love-gym/**'
      - '.github/workflows/self-love-gym-calendar-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calendar-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps-source/self-love-gym
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Compile private app
        run: npm run build
      - name: Install browser test runner
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Verify real iPhone-sized calendar, profile and session form
        run: node qa/calendar-smoke.mjs

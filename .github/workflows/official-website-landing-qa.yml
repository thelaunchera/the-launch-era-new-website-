name: Official Website Landing QA
on:
  push:
    paths:
      - 'public/website-for-your-business/**'
      - 'public/es/website-for-your-business/**'
      - 'public/assets/tle-website-official.css'
      - 'public/assets/tle-gallery-hero-20261107.css'
      - 'scripts/qa-website-photo-placement.mjs'
      - 'public/assets/website-packages-20261105/**'
      - 'scripts/qa-official-website-landing.mjs'
      - 'scripts/qa-website-checkout-flow.mjs'
      - 'public/website-checkout/**'
      - 'public/website-payment-success/**'
      - 'public/intake/website/**'
      - 'public/intake/website-ai-crm/**'
      - 'public/assets/tle-website-intake.js'
      - 'public/assets/tle-website-intake.css'
      - 'public/custom-app/**'
      - 'public/assets/tle-custom-app-request.js'
  pull_request:
    paths:
      - 'public/website-for-your-business/**'
      - 'public/es/website-for-your-business/**'
      - 'public/assets/tle-website-official.css'
      - 'public/assets/tle-gallery-hero-20261107.css'
      - 'scripts/qa-website-photo-placement.mjs'
      - 'public/assets/website-packages-20261105/**'
      - 'scripts/qa-official-website-landing.mjs'
      - 'scripts/qa-website-checkout-flow.mjs'
      - 'public/website-checkout/**'
      - 'public/website-payment-success/**'
      - 'public/intake/website/**'
      - 'public/intake/website-ai-crm/**'
      - 'public/assets/tle-website-intake.js'
      - 'public/assets/tle-website-intake.css'
      - 'public/custom-app/**'
      - 'public/assets/tle-custom-app-request.js'
jobs:
  static-official-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node scripts/qa-official-website-landing.mjs
          node scripts/qa-website-photo-placement.mjs
          node scripts/qa-route-integrity.mjs --static
          node scripts/qa-website-checkout-flow.mjs
          node --check public/assets/tle-website-intake.js
          node --check public/assets/tle-custom-app-request.js

name: Booking Studio Pipeline QA
on:
  pull_request:
    paths:
      - 'lib/booking-studio-pipeline.mjs'
      - 'scripts/qa-booking-studio-pipeline.mjs'
      - '.github/workflows/booking-studio-pipeline-qa.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Booking Studio contract
        run: node scripts/qa-booking-studio-pipeline.mjs

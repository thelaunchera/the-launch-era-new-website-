name: Booking Studio Pipeline QA
on:
  pull_request:
    paths:
      - 'lib/booking-studio-pipeline.mjs'
      - 'scripts/qa-booking-studio-pipeline.mjs'
      - 'lib/booking-studio-preview.mjs'
      - 'scripts/qa-booking-studio-preview.mjs'
      - 'scripts/qa-booking-studio-visual.mjs'
      - 'scripts/build-booking-studio-preview.mjs'
      - 'fixtures/booking-studio-synthetic.json'
      - 'supabase/functions/tle-booking-studio-owner/index.ts'
      - 'supabase/migrations/20261014_tle_booking_studio_jobs.sql'
      - 'supabase/migrations/20261014_tle_booking_studio_customer_tenant.sql'
      - 'public/command-center/booking-studio.html'
      - 'public/command-center/assets/booking-studio.js'
      - 'public/command-center/assets/booking-studio-preview.mjs'
      - 'scripts/qa-booking-studio-owner-integration.mjs'
      - '.github/workflows/booking-studio-pipeline-qa.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Booking Studio contract
        run: |
          node scripts/qa-booking-studio-pipeline.mjs
          node scripts/qa-booking-studio-preview.mjs
          node scripts/qa-booking-studio-owner-integration.mjs
          node --check public/command-center/assets/booking-studio.js
      - name: Build synthetic private visual preview
        run: node scripts/build-booking-studio-preview.mjs fixtures/booking-studio-synthetic.json .private-preview/booking-studio.html
      - name: Install browser QA tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test synthetic design across phone, tablet and desktop
        run: node scripts/qa-booking-studio-visual.mjs
      - name: Upload responsive screenshots and visual QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-studio-responsive-qa
          path: .private-preview/visual-qa/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload synthetic review artifact (not deployed)
        uses: actions/upload-artifact@v4
        with:
          name: booking-studio-synthetic-preview
          path: .private-preview/booking-studio.html
          retention-days: 7

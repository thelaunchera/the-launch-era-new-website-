name: Public demo imagery — view-only QA
on:
  pull_request:
    paths:
      - 'public/demos/**'
      - 'demo-source/**'
      - 'public/assets/tle-demo-view-only-media-20261110.js'
      - 'scripts/qa-public-demo-view-only-*.mjs'
      - '.github/workflows/public-demo-media-viewonly-qa.yml'
  push:
    branches: [main]
    paths:
      - 'public/demos/**'
      - 'demo-source/**'
      - 'public/assets/tle-demo-view-only-media-20261110.js'
      - 'scripts/qa-public-demo-view-only-*.mjs'
      - '.github/workflows/public-demo-media-viewonly-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  photo-view-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scripts and block all public image-download controls
        run: |
          node --check scripts/qa-public-demo-view-only-media-20261110.mjs
          node --check scripts/qa-public-demo-view-only-browser-20261110.mjs
          node --check public/assets/tle-demo-view-only-media-20261110.js
          node scripts/qa-public-demo-view-only-media-20261110.mjs
      - name: Install browsers only for gallery regression
        run: |
          npm install --no-audit --no-fund --prefix /tmp/tle-viewonly-browser playwright@1.57.0
          /tmp/tle-viewonly-browser/node_modules/.bin/playwright install --with-deps chromium webkit
          mkdir -p node_modules
          ln -sfn /tmp/tle-viewonly-browser/node_modules/playwright node_modules/playwright
          ln -sfn /tmp/tle-viewonly-browser/node_modules/playwright-core node_modules/playwright-core
      - name: Verify mobile gallery opens without image-download actions
        run: |
          python3 -m http.server 4199 --bind 127.0.0.1 --directory public >/tmp/tle-viewonly-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4199/demos/sova/ >/dev/null; then break; fi
            sleep 1
          done
          QA_URL=http://127.0.0.1:4199 node scripts/qa-public-demo-view-only-browser-20261110.mjs

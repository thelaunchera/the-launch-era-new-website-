name: Repository TypeScript and build
on:
  push:
    branches: [main]
    paths: ['src/**', 'package.json', 'bun.lock', 'vite.config.ts', 'tsconfig.json', '.github/workflows/repository-typecheck.yml']
  pull_request:
    paths: ['src/**', 'package.json', 'bun.lock', 'vite.config.ts', 'tsconfig.json', '.github/workflows/repository-typecheck.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: python3 -m pip install Pillow
      - run: python3 scripts/build_mobile_flow_assets.py
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test

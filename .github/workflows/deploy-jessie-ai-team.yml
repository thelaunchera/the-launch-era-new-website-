name: Deploy Jessie AI Team to Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/tle-ai-team/**'
      - '.github/workflows/deploy-jessie-ai-team.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-jessie-ai-team-production
  cancel-in-progress: false

jobs:
  deploy-jessie:
    name: Validate and deploy tle-ai-team
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: jessie-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: bowacxhmjvrqixtwaikv
    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4

      - name: Require deployment credentials
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN to repository Actions secrets before deploying Jessie."
            exit 1
          fi

      - name: Validate Jessie code and safety checks
        shell: bash
        run: |
          set -euo pipefail
          test -s supabase/functions/tle-ai-team/index.ts
          node scripts/qa-ai-team.mjs
          node scripts/qa-ai-team-commands.mjs
          node scripts/qa-ai-team-gateway.mjs
          node scripts/qa-ai-team-ai-provider.mjs
          node scripts/qa-jessie-unified-tenant.mjs

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy only Jessie Edge Function
        shell: bash
        run: supabase functions deploy tle-ai-team --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deployment summary
        shell: bash
        run: |
          echo "Jessie Edge Function deployed (authentication remains enabled)." >> "$GITHUB_STEP_SUMMARY"
          echo "Provider verification and authenticated draft test still require owner session." >> "$GITHUB_STEP_SUMMARY"

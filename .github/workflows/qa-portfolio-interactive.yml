name: Founder Portfolio iPhone + Interaction QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/portfolio/**'
      - 'scripts/qa-portfolio-interactive-20261110.mjs'
      - '.github/workflows/qa-portfolio-interactive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interactive-portfolio:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate test script
        run: node --check scripts/qa-portfolio-interactive-20261110.mjs
      - name: Install isolated Chromium and WebKit
        run: |
          mkdir -p /tmp/tle-portfolio-qa
          npm install --no-audit --no-fund --prefix /tmp/tle-portfolio-qa playwright@1.57.0
          /tmp/tle-portfolio-qa/node_modules/.bin/playwright install --with-deps chromium webkit
          mkdir -p node_modules
          ln -sfn /tmp/tle-portfolio-qa/node_modules/playwright node_modules/playwright
          ln -sfn /tmp/tle-portfolio-qa/node_modules/playwright-core node_modules/playwright-core
      - name: Check Manus case studies, responsive navigation, disclosure and images
        run: |
          python3 -m http.server 4198 --bind 127.0.0.1 --directory public >/tmp/tle-portfolio-qa.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4198/portfolio/ >/dev/null; then break; fi
            sleep 1
          done
          QA_URL=http://127.0.0.1:4198 node scripts/qa-portfolio-interactive-20261110.mjs

name: Deploy website to GitHub Pages
# deployment refresh 2026-10-07

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block release if routes, buttons or static assets are broken
        run: |
          node --check scripts/qa-route-integrity.mjs
          node scripts/qa-route-integrity.mjs --static
          node --check scripts/qa-public-demo-integrity.mjs
          node scripts/qa-public-demo-integrity.mjs
          node --check public/command-center/assets/command-center-app.js
          node scripts/qa-owner-internal-incidents.mjs
          node scripts/qa-ai-team.mjs
          node scripts/qa-ai-team-commands.mjs
          node scripts/qa-ai-team-gateway.mjs
          node scripts/qa-ai-team-ai-provider.mjs

      - name: Enforce client delivery copy, branding and legal guard
        run: node scripts/qa-client-release.mjs

      - name: Verify Jessy appears on all public pages and answers in context
        run: node scripts/qa-jessy-coverage.mjs

      - name: Verify private owner Jessy access and read-only scope
        run: node scripts/qa-jessy-owner.mjs

      - name: Check owner and client notification preferences and iOS push consent
        run: node scripts/qa-notification-preferences.mjs

      - name: Guard iOS Command Center layout, floating controls and phone preview
        run: node scripts/qa-mobile-command-center.mjs

      - name: Guard exit from owner and client demo previews on iPhone
        run: node scripts/qa-owner-preview-exit.mjs

      - name: Guard all future client password recovery links
        run: node scripts/qa-auth-recovery.mjs

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Render-test public Cleaning App demo in English and Spanish
        run: node scripts/qa-public-demo-browser.mjs

      - name: Build website
        run: bun run build

      - name: Build branded freebie PDFs
        run: |
          python -m pip install --quiet pymupdf reportlab
          python scripts/build_freebies.py

      - name: Verify email demo landing pages and secure recovery routes
        run: |
          test -s .output/public/lead-private-preview.html
          test -s .output/public/lead-demo-tracker.html
          test -s .output/public/client-start-guide.html
          test -s .output/public/auth-recovery.html
          test -s .output/public/auth-recovery/index.html
          test -s .output/public/command-center/index.html
          grep -q 'PASSWORD_RECOVERY' .output/public/auth-recovery.html
          grep -q '/auth-recovery.html' .output/public/command-center/assets/command-center-app.js
          node scripts/qa-auth-recovery.mjs --built

      - name: Create GitHub Pages route fallbacks
        run: |
          for route in booking-lead-automation cleaning-web-app website-automation virtual-assistant help how-it-works solutions free-cleaning-lead-guide es es/booking-lead-automation es/cleaning-web-app es/website-automation es/virtual-assistant es/free-cleaning-lead-guide; do
            mkdir -p ".output/public/$route"
            if [ ! -f ".output/public/$route/index.html" ]; then
              cp .output/public/index.html ".output/public/$route/index.html"
            fi
          done
          test -s .output/public/404.html # keep the intentional, helpful 404 page

      - name: Preserve custom domain
        run: |
          mkdir -p .output/public
          echo "thelaunchera.com" > .output/public/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test live Command Center recovery (no customer credentials)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            recovery="$(curl --fail --silent --show-error --location --max-time 15 "https://thelaunchera.com/auth-recovery.html?qa=${GITHUB_SHA}" || true)"
            signin="$(curl --fail --silent --show-error --location --max-time 15 "https://thelaunchera.com/command-center/?qa=${GITHUB_SHA}" || true)"
            if [[ "$recovery" == *'id="passwordForm"'* ]] && [[ "$signin" == *'id="authForm"'* ]]; then
              echo "PASS — recovery form and private sign-in are live."
              exit 0
            fi
            echo "Waiting for GitHub Pages propagation ($attempt/12)"
            sleep 5
          done
          echo "::error::Live password recovery or private Command Center route is not available."
          exit 1

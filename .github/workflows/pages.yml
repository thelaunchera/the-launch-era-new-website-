name: Deploy website to GitHub Pages
# deployment refresh 2026-10-07

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build website
        run: bun run build

      - name: Build branded freebie PDFs
        run: |
          python -m pip install --quiet pymupdf reportlab
          python scripts/build_freebies.py

      - name: Verify email demo landing pages
        run: |
          test -s .output/public/lead-private-preview.html
          test -s .output/public/lead-demo-tracker.html

      - name: Create GitHub Pages route fallbacks
        run: |
          for route in booking-lead-automation cleaning-web-app website-automation virtual-assistant help how-it-works solutions free-cleaning-lead-guide es es/booking-lead-automation es/cleaning-web-app es/website-automation es/virtual-assistant es/free-cleaning-lead-guide; do
            mkdir -p ".output/public/$route"
            if [ ! -f ".output/public/$route/index.html" ]; then
              cp .output/public/index.html ".output/public/$route/index.html"
            fi
          done
          cp .output/public/index.html .output/public/404.html

      - name: Preserve custom domain
        run: |
          mkdir -p .output/public
          echo "thelaunchera.com" > .output/public/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

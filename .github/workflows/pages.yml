name: Deploy website to GitHub Pages
# deployment refresh 2026-10-07

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # Cancel obsolete deployments on new pushes so a stalled historical build cannot block the latest commit.
  # A 30-minute build timeout also bounds each individual release.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build self-hosted cleaning-service photo thumbnails
        run: |
          python -m pip install --quiet pillow
          python scripts/build_demo_photo_assets.py
          python scripts/build_mobile_flow_assets.py
          test -s public/assets/bundle-landing/optimized/booking-thumb.webp
          test -s public/assets/bundle-landing/optimized/command-thumb.webp
          test -s public/assets/bundle-landing/optimized/hero-thumb.webp
          test -s public/assets/demo-services/regular.webp
          test -s public/assets/demo-services/deep.webp
          test -s public/assets/demo-services/move.webp
          test -s public/assets/demo-services/office.webp
          test -s public/assets/demo-services/retail.webp
          test -s public/assets/demo-services/medical.webp
          test -s public/assets/demo-services/floor.webp

      - name: Protect approved hero and independent bilingual website photos
        run: |
          node scripts/qa-website-photo-placement.mjs
          node scripts/qa-website-checkout-flow.mjs
          node scripts/qa-website-outcome-journey.mjs
          node --check scripts/prepare-homepage-seo.mjs
          node scripts/prepare-homepage-seo.mjs --check
          node --check public/assets/tle-outcome-journey-20261109.js
          node --check public/assets/tle-website-intake.js
          node --check public/assets/tle-custom-app-request.js

      - name: Block release if routes, buttons or static assets are broken
        run: |
          node --check scripts/qa-route-integrity.mjs
          node scripts/qa-route-integrity.mjs --static
          node scripts/qa-booking-demo-funnel-gate.mjs
          node --check scripts/qa-public-demo-integrity.mjs
          node scripts/qa-public-demo-integrity.mjs
          node scripts/qa-services-color-shift.mjs
          node scripts/qa-booking-hero-floating-chips.mjs
          node scripts/qa-public-booking-conversion.mjs
          node scripts/qa-sample-cleaning-public.mjs
          node scripts/qa-footer-theme-sweep.mjs
          node scripts/qa-booking-scrollytelling.mjs
          node scripts/qa-home-booking-tones.mjs
          node --check scripts/qa-no-weekend-cutoffs.mjs
          node scripts/qa-no-weekend-cutoffs.mjs
          node scripts/qa-faq-topic-tabs.mjs
          node --check public/command-center/assets/command-center-app.js
          node scripts/qa-owner-internal-incidents.mjs
          node scripts/qa-ai-team.mjs
          node scripts/qa-ai-team-commands.mjs
          node scripts/qa-ai-team-gateway.mjs
          node scripts/qa-ai-team-ai-provider.mjs

      - name: Enforce client delivery copy, branding and legal guard
        run: node scripts/qa-client-release.mjs

      - name: Verify Jessy appears on all public pages and answers in context
        run: node scripts/qa-jessy-coverage.mjs

      - name: Verify Jessie answers broad help questions with real services in EN and ES
        run: node scripts/qa-jessie-capabilities.mjs

      - name: Verify private owner Jessy access and read-only scope
        run: node scripts/qa-jessy-owner.mjs

      - name: Check owner and client notification preferences and iOS push consent
        run: node scripts/qa-notification-preferences.mjs

      - name: Guard iOS Command Center layout, floating controls and phone preview
        run: node scripts/qa-mobile-command-center.mjs

      - name: Guard exit from owner and client demo previews on iPhone
        run: node scripts/qa-owner-preview-exit.mjs

      - name: Guard all future client password recovery links
        run: node scripts/qa-auth-recovery.mjs

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Verify optional statistics consent and withdrawal
        run: node scripts/qa-privacy-choice.mjs

      - name: Test Jessy's private FAQ, reasoning, contextual prices and anti-repetition
        run: bun scripts/qa-jessy-reasoning.ts

      - name: Render-test public Cleaning App demo in English and Spanish
        run: node scripts/qa-public-demo-browser.mjs

      - name: Build website
        run: bun run build

      - name: Build the Mina landing
        run: |
          npm ci --prefix vault-landing
          VAULT_OUT_DIR=../.output/public/guias/mina-assets npm run build --prefix vault-landing
          test -s .output/public/guias/mina-assets/landing.js
          test -s .output/public/guias/mina-assets/living-portrait.js

      - name: Build Brand Board Studio on The Launch Era domain
        run: |
          set -euo pipefail
          test -s brand-board-studio/src/main.ts
          cd brand-board-studio
          bun install
          APPDEPLOY_VITE_OUT_DIR=../.output/public/brand-board bun run build
          test -s ../.output/public/brand-board/index.html
          test -d ../.output/public/brand-board/assets

      - name: Build branded freebie PDFs
        run: |
          python -m pip install --quiet pymupdf reportlab
          python scripts/build_freebies.py

      - name: Optimize published demo photographs for iPhone
        run: |
          python scripts/optimize_demo_photos.py --root .output/public
          python scripts/qa_demo_photo_performance.py --root .output/public

      - name: Verify email demo landing pages and secure recovery routes
        run: |
          test -s .output/public/lead-private-preview.html
          test -s .output/public/lead-demo-tracker.html
          test -s .output/public/client-start-guide.html
          test -s .output/public/auth-recovery.html
          test -s .output/public/auth-recovery/index.html
          test -s .output/public/command-center/index.html
          grep -q 'PASSWORD_RECOVERY' .output/public/auth-recovery.html
          grep -q '/auth-recovery.html' .output/public/command-center/assets/command-center-app.js
          node scripts/qa-auth-recovery.mjs --built

      - name: Verify official bilingual website landing and publish it at the home routes
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            .output/public/website-for-your-business/index.html \
            .output/public/es/website-for-your-business/index.html \
            .output/public/intake/website/index.html \
             .output/public/intake/website-plus/index.html \
            .output/public/intake/website-ai-crm/index.html \
            .output/public/website-checkout/index.html \
            .output/public/website-payment-success/index.html \
            .output/public/custom-app/index.html \
            .output/public/assets/tle-custom-app-request.js \
            .output/public/assets/tle-website-official.css \
            .output/public/assets/tle-website-intake.js \
            .output/public/assets/website-packages-20261105/hero-jaramillo.svg; do
            test -s "$file"
          done
          grep -q 'href="/website-checkout/?offer=website-basic&lang=en"' .output/public/website-for-your-business/index.html
          grep -q 'href="/website-checkout/?offer=website-plus&lang=es"' .output/public/es/website-for-your-business/index.html
          grep -q 'href="/website-checkout/?offer=website-plus&lang=en"' .output/public/website-for-your-business/index.html
          grep -q 'Website' .output/public/website-for-your-business/index.html
          cp .output/public/website-for-your-business/index.html .output/public/index.html
          mkdir -p .output/public/es
          cp .output/public/es/website-for-your-business/index.html .output/public/es/index.html
          node scripts/prepare-homepage-seo.mjs .output/public
          echo "Official website packages: root, Spanish root and direct landing routes prepared."

      - name: Create GitHub Pages route fallbacks
        run: |
          for route in booking-lead-automation cleaning-web-app website-automation virtual-assistant help how-it-works solutions free-cleaning-lead-guide 5-signs-cleaning-business es es/booking-lead-automation es/cleaning-web-app es/website-automation es/virtual-assistant es/free-cleaning-lead-guide es/5-signs-cleaning-business; do
            mkdir -p ".output/public/$route"
            if [ ! -f ".output/public/$route/index.html" ]; then
              cp .output/public/index.html ".output/public/$route/index.html"
            fi
          done
          test -s .output/public/404.html # keep the intentional, helpful 404 page

      - name: Add brand-tinted iOS language switches to bilingual demos and landings
        run: |
          node --check public/assets/tle-ios-language-switch-20261111.js
          node --check scripts/install-ios-language-switch-20261111.mjs
          node scripts/install-ios-language-switch-20261111.mjs --root .output/public
          node scripts/qa-ios-language-settings-20261111.mjs --built
          test -s .output/public/assets/tle-ios-language-switch-20261111.css
          test -s .output/public/assets/tle-ios-language-switch-20261111.js
          grep -q 'tle-ios-language-switch-20261111.js' .output/public/demos/la-vie-in-pink/index.html
          grep -q 'tle-ios-language-switch-20261111.js' .output/public/website-for-your-business/index.html

      - name: Preserve custom domain
        run: |
          mkdir -p .output/public
          echo "thelaunchera.com" > .output/public/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Publish and validate isolated Knockout Deli concept
        shell: bash
        run: |
          set -euo pipefail
          destination=".output/public/demos/knockout-deli"
          mkdir -p "$destination"
          unzip -q demo-source/knockout-deli/Knockout-Deli-website-bundle.zip             index.html styles.css visual-polish.css app.js window-order.js window-order.css 'assets/*.webp' -d "$destination"
          node scripts/qa-knockout-deli-preview.mjs "$destination"
          echo "Knockout Deli preview packaged: /demos/knockout-deli/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record successful GitHub Pages delivery
        shell: bash
        run: |
          echo "GitHub Pages deployed the official bilingual website and existing asset routes."
          echo "Custom-domain DNS must route to GitHub Pages; Cloudflare and Netlify are not required for this workflow."

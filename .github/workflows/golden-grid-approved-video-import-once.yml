name: Import approved Golden Grid video once
on:
  push:
    branches:
      - fix/golden-grid-tablet-desktop-approved-video-20261108

permissions:
  contents: write

jobs:
  import-approved-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preserve user-supplied Canva MP4 verbatim in source repository
        shell: bash
        env:
          SOURCE_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3FC9GcVebQE6WAxiCP5Hh9w95GF/b9c9b486-863c-459e-ba90-dc41da2d4e22.mp4
          EXPECTED_SHA256: a0ba53f3d5c26a7be4424c5ab730930358ca3a9fd37273505d93b4d48a843a70
        run: |
          set -euo pipefail
          target="public/demos/golden-grid/media/hero-approved-canva-20261108.mp4"
          mkdir -p "$(dirname "$target")"
          if [ ! -f "$target" ]; then
            curl --fail --location --silent --show-error --retry 3 --max-time 120 "$SOURCE_URL" -o "$target"
          fi
          echo "$EXPECTED_SHA256  $target" | sha256sum --check --status
          test "$(wc -c < "$target")" -eq 2508021
          poster="public/demos/golden-grid/media/hero-approved-canva-20261108-firstframe.webp"
          if [ ! -s "$poster" ]; then
            if ! command -v ffmpeg >/dev/null 2>&1; then
              sudo apt-get update -qq && sudo apt-get install -y ffmpeg
            fi
            ffmpeg -hide_banner -loglevel error -y -i "$target" -frames:v 1 -c:v libwebp -quality 92 "$poster"
          fi
          test -s "$poster"
          git add "$target" "$poster"
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "asset: preserve approved Golden Grid Canva video at original quality"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi

name: TLE free AI guides library QA
on:
  pull_request:
    paths:
      - "public/guias/**"
      - "public/es/guias/**"
      - "scripts/qa-guides-library.mjs"
      - "scripts/qa-guides-library-browser.cjs"
      - "scripts/qa-guides-dom.mjs"
      - "scripts/qa-guides-editorial-scroll.cjs"
      - "scripts/qa-guides-resources.cjs"
      - "scripts/qa-guides-atelier.cjs"
      - "scripts/qa-guides-subscribe-endpoint.mjs"
      - ".github/workflows/qa-guides-library.yml"
      - "public/sitemap.xml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guides:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate free library files
        run: |
          node --check public/guias/app.js
          node --check public/guias/resources.js
          node scripts/qa-guides-library.mjs
          node scripts/qa-route-integrity.mjs --static
      - name: Probe live subscriber endpoint without creating contacts or email
        run: node scripts/qa-guides-subscribe-endpoint.mjs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install test dependencies
        run: bun install
      - name: Test both language UIs with a browser-like DOM
        run: node scripts/qa-guides-dom.mjs
      - name: Verify the browser interactions
        run: |
          npm install --prefix "$RUNNER_TEMP/tle-guides-browser" --no-save playwright@1.56.1
          "$RUNNER_TEMP/tle-guides-browser/node_modules/.bin/playwright" install --with-deps chromium
          python3 -m http.server 8172 --bind 127.0.0.1 --directory public &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --retry 5 --retry-connrefused --silent http://127.0.0.1:8172/guias/ > /dev/null
          NODE_PATH="$RUNNER_TEMP/tle-guides-browser/node_modules" node scripts/qa-guides-library-browser.cjs
          NODE_PATH="$RUNNER_TEMP/tle-guides-browser/node_modules" node scripts/qa-guides-editorial-scroll.cjs
          NODE_PATH="$RUNNER_TEMP/tle-guides-browser/node_modules" node scripts/qa-guides-resources.cjs
          NODE_PATH="$RUNNER_TEMP/tle-guides-browser/node_modules" node scripts/qa-guides-atelier.cjs

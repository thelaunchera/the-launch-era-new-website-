name: Demo Services and Date Picker QA
on:
  push:
    branches: [main]
    paths:
      - 'public/assets/tle-demo-redesign-v42.js'
      - 'public/assets/tle-demo-redesign-v42.css'
      - 'public/assets/tle-demo-readability-v41.css'
      - 'public/assets/tle-demo-stack-nav-v38.css'
      - 'public/assets/tle-demo-magical-clean-v27.js'
      - 'scripts/qa-demo-redesign-v42.mjs'
      - '.github/workflows/demo-inline-v41-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample-service-date-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Tenant and route safety
        run: |
          node scripts/qa-route-integrity.mjs --static
          node scripts/qa-public-demo-integrity.mjs
          node --check public/assets/tle-demo-redesign-v42.js
      - name: Install browser
        run: |
          bun install
          mkdir -p /tmp/tle-inline-playwright
          cd /tmp/tle-inline-playwright
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Verify inline date calendar, window hero zoom, services and tenant isolation
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/tle-inline-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:4173/lead-private-preview.html >/dev/null; then break; fi
            sleep 2
          done
          QA_URL=http://127.0.0.1:4173 PLAYWRIGHT_MODULE=/tmp/tle-inline-playwright/node_modules/playwright/index.mjs node scripts/qa-demo-redesign-v42.mjs

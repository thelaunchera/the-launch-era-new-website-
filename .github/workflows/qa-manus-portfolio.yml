name: Manus portfolio integrity

on:
  pull_request:
    paths:
      - "public/portfolio/**"
      - "scripts/qa-manus-portfolio-migration.mjs"
      - ".github/workflows/qa-manus-portfolio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-portfolio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify independent portfolio source, images, fonts, links and JavaScript
        run: node scripts/qa-manus-portfolio-migration.mjs

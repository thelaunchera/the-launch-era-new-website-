name: Install CB Depot BMW photos
on:
  push:
    paths:
      - '.github/workflows/cb-depot-install-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - name: Fetch and optimize images
        run: |
          python - <<'PY'
          from PIL import Image
          from urllib.request import urlretrieve
          from pathlib import Path
          import tempfile
          folder=Path("public/assets/clients/cb-depot/photos")
          folder.mkdir(parents=True,exist_ok=True)
          images=[["hero-desktop.webp","https://d2ol7oe51mr4n9.cloudfront.net/user_3FC9GcVebQE6WAxiCP5Hh9w95GF/f10b754e-51ad-4b38-82b3-3564f1a5c2b9.png",1600],["hero-mobile.webp","https://d2ol7oe51mr4n9.cloudfront.net/user_3FC9GcVebQE6WAxiCP5Hh9w95GF/5acc5b29-68aa-4c93-93a6-acee6d304d7f.png",900],["exterior.webp","https://d2ol7oe51mr4n9.cloudfront.net/user_3FC9GcVebQE6WAxiCP5Hh9w95GF/2254283f-1bfe-4795-a2d4-1ea0da9b26a1.png",900],["interior.webp","https://d2ol7oe51mr4n9.cloudfront.net/user_3FC9GcVebQE6WAxiCP5Hh9w95GF/52a4dc93-fa7b-4650-b7f7-610116b8f170.png",900],["paint.webp","https://d2ol7oe51mr4n9.cloudfront.net/user_3FC9GcVebQE6WAxiCP5Hh9w95GF/1babdbbf-872a-42e5-9ab0-d7d3bb4d8da5.png",900],["full.webp","https://d2ol7oe51mr4n9.cloudfront.net/user_3FC9GcVebQE6WAxiCP5Hh9w95GF/f10b754e-51ad-4b38-82b3-3564f1a5c2b9.png",900],["panda-on-bmw.webp","https://d2ol7oe51mr4n9.cloudfront.net/user_3FC9GcVebQE6WAxiCP5Hh9w95GF/5acc5b29-68aa-4c93-93a6-acee6d304d7f.png",900]]
          for name,url,max_width in images:
           with tempfile.NamedTemporaryFile(suffix=".png") as tmp:
            urlretrieve(url,tmp.name)
            with Image.open(tmp.name) as pic:
             pic=pic.convert("RGB")
             if pic.width>max_width:
              target_height=round(pic.height*max_width/pic.width)
              pic=pic.resize((max_width,target_height),Image.Resampling.LANCZOS)
             pic.save(folder/name,"WEBP",quality=84,method=6)
           print(name,(folder/name).stat().st_size)
          
          PY
      - name: Commit website photos to repo
        run: |
          git config user.name "CB Depot Asset Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/clients/cb-depot/photos/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Import optimized client BMW detailing photos to original booking page"
          git push

name: Website Responsive QA
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/qa-responsive-current.mjs'
      - 'public/booking-demo/index.html'
      - 'src/components/service-flip-card.*'
      - 'src/components/process-view-transitions.*'
      - 'src/components/home-motion-interlude.*'
      - 'src/routes/**'
      - 'src/styles.css'
      - '.github/workflows/website-responsive-qa.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/qa-responsive-current.mjs'
      - 'public/booking-demo/index.html'
      - 'public/booking/return/index.html'
      - 'public/base-booking.html'
      - 'public/lead-private-preview.html'
      - 'public/assets/**'
      - 'src/components/**'
      - 'src/routes/**'
      - 'src/styles.css'
      - '.github/workflows/website-responsive-qa.yml'
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser isolated from website dependencies
        run: |
          mkdir -p /tmp/tle-responsive-qa
          cd /tmp/tle-responsive-qa
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE/node_modules"
          ln -sfn /tmp/tle-responsive-qa/node_modules/playwright "$GITHUB_WORKSPACE/node_modules/playwright"
          ln -sfn /tmp/tle-responsive-qa/node_modules/playwright-core "$GITHUB_WORKSPACE/node_modules/playwright-core"
      - name: Build public preview for PR smoke tests
        if: github.event_name == 'pull_request'
        run: |
          bun install
          bun run build
      - name: Wait for this Booking Page version to reach Pages
        if: github.event_name != 'pull_request'
        run: |
          expected=$(sha256sum public/lead-private-preview.html | cut -d ' ' -f 1)
          for attempt in $(seq 1 18); do
            actual=$(curl -fsS "https://thelaunchera.com/lead-private-preview.html?qa=$GITHUB_SHA" | sha256sum | cut -d ' ' -f 1)
            if [ "$actual" = "$expected" ]; then exit 0; fi
            sleep 15
          done
          echo "The current Booking Page is not live yet"
          exit 1
      - name: Test current pages, interactions, and safe mocked email at four widths
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python3 -m http.server 4173 --bind 127.0.0.1 --directory .output/public >/tmp/tle-responsive-http.log 2>&1 &
            server=$!
            trap 'kill "$server" 2>/dev/null || true' EXIT
            for i in $(seq 1 35); do
              if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
              sleep 1
            done
            QA_URL=http://127.0.0.1:4173 node scripts/qa-responsive-current.mjs
          else
            QA_URL=https://thelaunchera.com node scripts/qa-responsive-current.mjs
          fi
        env:
          EVENT_NAME: ${{ github.event_name }}
      - name: Upload visual QA captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-responsive-qa-screenshots
          path: qa-screenshots/
          if-no-files-found: ignore

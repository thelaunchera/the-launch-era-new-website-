name: Website Responsive QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/qa-booking-demo.mjs'
      - 'public/booking-demo/index.html'
      - 'public/assets/tle-mobile.css'
      - '.github/workflows/website-responsive-qa.yml'
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser isolated from website dependencies
        run: |
          mkdir -p /tmp/tle-responsive-qa
          cd /tmp/tle-responsive-qa
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          ln -s /tmp/tle-responsive-qa/node_modules node_modules
      - name: Wait for this mobile stylesheet to reach Pages
        run: |
          expected=$(sha256sum public/assets/tle-mobile.css | cut -d ' ' -f 1)
          for attempt in $(seq 1 18); do
            actual=$(curl -fsS "https://thelaunchera.com/assets/tle-mobile.css?qa=$GITHUB_SHA" | sha256sum | cut -d ' ' -f 1)
            if [ "$actual" = "$expected" ]; then exit 0; fi
            sleep 15
          done
          echo "The current mobile stylesheet is not live yet"
          exit 1
      - name: Test website at mobile, tablet and desktop widths
        run: node scripts/qa-booking-demo.mjs
        env:
          QA_URL: https://thelaunchera.com
      - name: Upload visual QA captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-responsive-qa-screenshots
          path: qa-screenshots/
          if-no-files-found: ignore

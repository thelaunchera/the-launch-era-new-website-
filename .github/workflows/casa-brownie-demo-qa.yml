name: Casa Brownie demo QA
on:
  push:
    branches: [main]
    paths:
      - 'public/demos/casa-brownie/**'
      - 'scripts/qa-casa-brownie-demo.mjs'
      - 'scripts/qa-casa-brownie-mobile.mjs'
      - '.github/workflows/casa-brownie-demo-qa.yml'
  pull_request:
    paths:
      - 'public/demos/casa-brownie/**'
      - 'scripts/qa-casa-brownie-demo.mjs'
      - 'scripts/qa-casa-brownie-mobile.mjs'
      - '.github/workflows/casa-brownie-demo-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and existing safe demo
        run: |
          node --check public/demos/casa-brownie/main.js
          node --check scripts/qa-casa-brownie-demo.mjs
          node --check scripts/qa-casa-brownie-mobile.mjs
          node --test scripts/qa-casa-brownie-demo.mjs
          node scripts/qa-route-integrity.mjs --static
      - name: Install isolated Chromium and Playwright
        run: |
          mkdir -p /tmp/cb-mobile
          npm install --no-audit --no-fund --prefix /tmp/cb-mobile playwright@1.57.0
          /tmp/cb-mobile/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p "$GITHUB_WORKSPACE/node_modules"
          ln -sfn /tmp/cb-mobile/node_modules/playwright "$GITHUB_WORKSPACE/node_modules/playwright"
          ln -sfn /tmp/cb-mobile/node_modules/playwright-core "$GITHUB_WORKSPACE/node_modules/playwright-core"
      - name: Check phone and tablet gallery and scroll-to-top in browser
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory public >/tmp/cb-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/demos/casa-brownie/ >/dev/null; then break; fi
            sleep 1
          done
          QA_URL=http://127.0.0.1:4173 node scripts/qa-casa-brownie-mobile.mjs
      - name: Save gallery screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casa-brownie-mobile-checks
          path: qa-screenshots/casa-brownie/
          if-no-files-found: ignore

name: Casa Brownie demo QA
on:
  pull_request:
    paths:
      - 'public/demos/casa-brownie/**'
      - 'scripts/qa-casa-brownie-demo.mjs'
      - '.github/workflows/casa-brownie-demo-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check public/demos/casa-brownie/main.js
      - run: node --test scripts/qa-casa-brownie-demo.mjs
      - run: node scripts/qa-route-integrity.mjs --static

name: Booking Blue Bubble Theme QA
on:
  pull_request:
    paths:
      - 'public/booking-demo-reset.html'
      - 'public/assets/tle-demo-blue-bubbles.css'
      - 'scripts/qa-booking-blue-bubbles-order.mjs'
      - '.github/workflows/booking-blue-bubbles-order-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-and-functional:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Check source and private routes
        run: |
          node --check scripts/qa-booking-blue-bubbles-order.mjs
          node scripts/qa-route-integrity.mjs --static
          node scripts/qa-public-demo-integrity.mjs
      - name: Build local matched photos and the complete site
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/build_demo_photo_assets.py
          bun install
          bun run build
          test -s .output/public/booking-demo-reset.html
          test -s .output/public/assets/tle-demo-blue-bubbles.css
      - name: Install headless Chromium
        run: |
          mkdir -p /tmp/tle-bubble-browser
          cd /tmp/tle-bubble-browser
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
          ln -sfn /tmp/tle-bubble-browser/node_modules/playwright "$GITHUB_WORKSPACE/node_modules/playwright"
          ln -sfn /tmp/tle-bubble-browser/node_modules/playwright-core "$GITHUB_WORKSPACE/node_modules/playwright-core"
      - name: Test bilingual blue bubbles and proof order without network writes
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .output/public >/tmp/tle-bubble-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/booking-demo-reset.html >/dev/null; then break; fi
            sleep 1
          done
          QA_URL=http://127.0.0.1:4173 node scripts/qa-booking-blue-bubbles-order.mjs

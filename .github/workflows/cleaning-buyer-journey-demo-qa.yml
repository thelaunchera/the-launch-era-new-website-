name: Cleaning Buyer Journey Demo QA
on:
  pull_request:
    paths:
      - 'public/experience-cleaning/**'
      - 'scripts/qa-experience-cleaning-demo.mjs'
      - 'scripts/qa-experience-cleaning-browser.mjs'
      - '.github/workflows/cleaning-buyer-journey-demo-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - name: Verify demo interactions EN/ES, safety and approved photography
        run: node scripts/qa-experience-cleaning-demo.mjs
      - name: Check routes and static assets
        run: node scripts/qa-route-integrity.mjs --static
      - name: Production build
        run: bun run build
      - name: Install isolated browser for real iPhone/tablet/desktop QA
        run: |
          mkdir -p /tmp/tle-new-demo-browser
          cd /tmp/tle-new-demo-browser
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          ln -sfn /tmp/tle-new-demo-browser/node_modules/playwright "$GITHUB_WORKSPACE/node_modules/playwright"
          ln -sfn /tmp/tle-new-demo-browser/node_modules/playwright-core "$GITHUB_WORKSPACE/node_modules/playwright-core"
      - name: Validate EN/ES mobile and desktop with real interactions
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .output/public >/tmp/tle-new-demo-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/experience-cleaning/ >/dev/null; then break; fi
            sleep 1
          done
          QA_URL=http://127.0.0.1:4173 node scripts/qa-experience-cleaning-browser.mjs
      - name: Archive new demo visual previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tle-new-cleaning-demo-visuals
          path: qa-screenshots/experience-cleaning-*.png
          if-no-files-found: ignore


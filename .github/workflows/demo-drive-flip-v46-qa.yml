name: Demo Drive Home Gallery QA
on:
  push:
    branches: [main]
    paths:
      - 'public/assets/tle-demo-drive-flip-v46.css'
      - 'public/assets/tle-demo-drive-flip-v46.js'
      - 'public/assets/tle-demo-hero-copy-v47.js'
      - 'public/assets/tle-demo-hero-copy-v47.css'
      - 'public/lead-private-preview.html'
      - 'public/assets/drive-house-gallery/**'
      - 'scripts/qa-demo-drive-flip-v46.mjs'
      - 'scripts/qa-demo-hero-v47.mjs'
      - '.github/workflows/demo-drive-flip-v46-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drive-home-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Guard routing and private clients
        run: |
          node scripts/qa-route-integrity.mjs --static
          node scripts/qa-public-demo-integrity.mjs
          node --check public/assets/tle-demo-drive-flip-v46.js
          node --check scripts/qa-demo-drive-flip-v46.mjs
          node --check public/assets/tle-demo-hero-copy-v47.js
          node --check scripts/qa-demo-hero-v47.mjs
      - name: Install browser
        run: |
          bun install
          mkdir -p /tmp/tle-drive-gallery-qa
          cd /tmp/tle-drive-gallery-qa
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: GSAP Flip house gallery, EN ES, motion and client isolation
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/tle-drive-gallery.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:4173/lead-private-preview.html >/dev/null; then break; fi
            sleep 2
          done
          QA_URL=http://127.0.0.1:4173 PLAYWRIGHT_MODULE=/tmp/tle-drive-gallery-qa/node_modules/playwright/index.mjs node scripts/qa-demo-drive-flip-v46.mjs
          QA_URL=http://127.0.0.1:4173 PLAYWRIGHT_MODULE=/tmp/tle-drive-gallery-qa/node_modules/playwright/index.mjs node scripts/qa-demo-hero-v47.mjs
      - name: Upload visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-drive-gsap-flip-screenshots
          path: qa-screenshots/demo-v46/
          if-no-files-found: ignore

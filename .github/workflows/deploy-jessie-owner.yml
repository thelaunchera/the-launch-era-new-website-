name: Deploy Jessie Owner Bubble to Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/tle-jessy-owner/**'
      - '.github/workflows/deploy-jessie-owner.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-jessie-owner-production
  cancel-in-progress: false

jobs:
  deploy-owner-jessy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: jessie-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: bowacxhmjvrqixtwaikv
    steps:
      - name: Checkout exact code
        uses: actions/checkout@v4

      - name: Validate deploy authorization
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN. No deployment occurred."
            exit 1
          fi

      - name: Validate private owner Jessy controls
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa-jessy-owner.mjs
          node scripts/qa-ai-team-gateway.mjs
          node scripts/qa-jessie-unified-tenant.mjs
          node scripts/qa-jessie-private-endpoints.mjs

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy only owner-bubble function
        shell: bash
        run: |
          # Preserve the currently deployed function's gateway setting.
          # The function independently verifies the bearer JWT, platform_admins
          # and the owner's internal workspace before servicing any requests.
          supabase functions deploy tle-jessy-owner --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deployment summary
        run: |
          echo "Updated tle-jessy-owner only. Authentication is enforced in server code." >> "$GITHUB_STEP_SUMMARY"
          echo "Independent reviewer still needs to test owner/tenant boundaries and mobile UI." >> "$GITHUB_STEP_SUMMARY"

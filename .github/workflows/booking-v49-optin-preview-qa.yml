name: Booking hotel49 opt-in browser QA
on:
  pull_request:
    paths:
      - 'public/lead-private-preview.html'
      - 'public/assets/tle-demo-editorial-v48*'
      - 'public/assets/tle-demo-expanding-v49*'
      - 'scripts/build_demo_photo_assets.py'
      - 'scripts/qa-demo-hotel-optin.mjs'
      - '.github/workflows/booking-v49-optin-preview-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-optin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Check code, routes and existing public demo
        run: |
          node --check public/assets/tle-demo-editorial-v48-optin.js
          node --check public/assets/tle-demo-expanding-v49-optin.js
          node --check scripts/qa-demo-hotel-optin.mjs
          node scripts/qa-route-integrity.mjs --static
          node scripts/qa-public-demo-integrity.mjs
      - name: Prepare Google Drive photography and build
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/build_demo_photo_assets.py
          test -s public/assets/demo-editorial/service-standard.webp
          test -s public/assets/demo-editorial/service-deep.webp
          test -s public/assets/demo-editorial/service-move.webp
          bun install
          bun run build
      - name: Install Chromium and Safari WebKit
        run: |
          mkdir -p /tmp/tle-booking-hotel49
          cd /tmp/tle-booking-hotel49
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium webkit
      - name: Check inset square cards, expanding buttons, large headline and no tenant leaks
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .output/public >/tmp/tle-booking-hotel49.log 2>&1 &
          for n in $(seq 1 45); do
            if curl -sf http://127.0.0.1:4173/lead-private-preview.html >/dev/null; then break; fi
            sleep 2
          done
          QA_URL=http://127.0.0.1:4173 PLAYWRIGHT_MODULE=/tmp/tle-booking-hotel49/node_modules/playwright/index.mjs node scripts/qa-demo-hotel-optin.mjs
      - name: Save screenshots for mobile tablet and desktop
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-hotel49-mobile-tablet-desktop
          path: qa-screenshots/demo-v49-optin/
          if-no-files-found: ignore

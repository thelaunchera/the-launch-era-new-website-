name: Discontinued Cleaning App offer — retirement QA
on:
  pull_request:
    paths:
      - 'src/components/editorial-sections.tsx'
      - 'src/routes/es.index.tsx'
      - 'src/components/service-sales.tsx'
      - 'src/routes/cleaning-web-app.tsx'
      - 'src/routes/es.cleaning-web-app.tsx'
      - 'public/cleaning-app/**'
      - 'public/cleaning-app-demo/**'
      - 'public/service-checkout/**'
      - 'scripts/qa-cleaning-app-landing.mjs'
      - '.github/workflows/cleaning-app-landing-qa.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/editorial-sections.tsx'
      - 'src/routes/es.index.tsx'
      - 'src/components/service-sales.tsx'
      - 'src/routes/cleaning-web-app.tsx'
      - 'src/routes/es.cleaning-web-app.tsx'
      - 'public/cleaning-app/**'
      - 'public/cleaning-app-demo/**'
      - 'scripts/qa-cleaning-app-landing.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retirement-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify retired product is not sold or linked
        run: |
          node scripts/qa-cleaning-app-landing.mjs
          node scripts/qa-route-integrity.mjs --static
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build

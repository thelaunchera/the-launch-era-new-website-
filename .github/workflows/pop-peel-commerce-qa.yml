name: Pop & Peel commerce QA
on:
  push:
    branches: [main]
    paths:
      - 'public/pop-and-peel/**'
      - 'public/pop-peel-studio/**'
      - 'scripts/qa-pop-peel-shared-commerce.mjs'
      - '.github/workflows/pop-peel-commerce-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'public/pop-and-peel/**'
      - 'public/pop-peel-studio/**'
      - 'scripts/qa-pop-peel-shared-commerce.mjs'
      - '.github/workflows/pop-peel-commerce-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pp-commerce-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-commerce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check shared commerce and delivery source
        run: node scripts/qa-pop-peel-shared-commerce.mjs

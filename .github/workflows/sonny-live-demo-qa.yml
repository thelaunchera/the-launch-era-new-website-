name: Sonny real conversation and numeric reply QA
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/tle-ai-booking-demo/index.ts'
      - 'public/assets/tle-demo-reset-lead-magnet.js'
      - 'public/assets/tle-demo-hero-portal.css'
      - 'public/booking-demo-reset.html'
      - 'scripts/qa-jessie-sonny-slot-memory.mjs'
      - 'scripts/qa-sonny-production-short-answer.mjs'
      - '.github/workflows/sonny-live-demo-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sonny-live-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: No-write route and script checks
        run: |
          node scripts/qa-route-integrity.mjs --static
          node --check public/assets/tle-demo-reset-lead-magnet.js
          node --check scripts/qa-sonny-production-short-answer.mjs
          bun install
          node scripts/qa-jessie-sonny-slot-memory.mjs
      - name: Production single-character response and CORS test
        run: node scripts/qa-sonny-production-short-answer.mjs

name: Verify Safari Command Center Login
on:
  push:
    branches: [main]
    paths: ['scripts/qa-safari-command-center.mjs','.github/workflows/qa-safari-command-center.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebKit
        run: |
          mkdir -p /tmp/tle-webkit-qa
          npm install --prefix /tmp/tle-webkit-qa --no-save playwright@1.56.1
          /tmp/tle-webkit-qa/node_modules/.bin/playwright install --with-deps webkit
          ln -s /tmp/tle-webkit-qa/node_modules ./node_modules
      - name: Safari official sign-in regression
        run: node scripts/qa-safari-command-center.mjs
      - name: Attach Safari screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-command-center-safari
          path: qa-safari-*.png
          if-no-files-found: ignore

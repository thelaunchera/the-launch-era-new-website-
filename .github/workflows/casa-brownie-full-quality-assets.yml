name: Casa Brownie - reemplazar miniaturas por originales
on:
  push:
    branches: [fix/casa-brownie-original-gift-photos-20261029]
    paths:
      - .github/workflows/casa-brownie-full-quality-assets.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Obtener archivos originales de la creadora
        env:
          GIFT_BAG_URL: "https://d2ol7oe51mr4n9.cloudfront.net/user_3FC9GcVebQE6WAxiCP5Hh9w95GF/9c8531b0-3cd8-472a-8b3c-880e743065f9.jpg"
          GIFT_RIBBON_URL: "https://d2ol7oe51mr4n9.cloudfront.net/user_3FC9GcVebQE6WAxiCP5Hh9w95GF/6423db0e-32a9-4bc1-9525-51c2584670ee.jpg"
        run: |
          curl -fsSL --retry 3 --max-time 60 "$GIFT_BAG_URL" -o /tmp/casa-brownie-bolsa-original.jpg
          curl -fsSL --retry 3 --max-time 60 "$GIFT_RIBBON_URL" -o /tmp/casa-brownie-lazo-original.jpg
          test "$(wc -c </tmp/casa-brownie-bolsa-original.jpg)" -ge 400000
          test "$(wc -c </tmp/casa-brownie-lazo-original.jpg)" -ge 400000
      - name: Optimizar sin cambiar resolución original
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          originals=[
            ('/tmp/casa-brownie-bolsa-original.jpg','public/demos/casa-brownie/assets/regalos-bolsa-y-cajas.webp', (1448,1086)),
            ('/tmp/casa-brownie-lazo-original.jpg','public/demos/casa-brownie/assets/regalo-lazo-rosa.webp', (1240,1269)),
          ]
          for src,dest,expected in originals:
            img=Image.open(src).convert('RGB')
            if img.size!=expected:
              raise RuntimeError(f'Fotografía incorrecta: {src}: {img.size}, expected {expected}')
            img.save(dest,format='WEBP',quality=88,method=6)
            output=Image.open(dest)
            if output.size != expected or Path(dest).stat().st_size < 100000:
              raise RuntimeError(f'Asset incorrecto: {dest} {output.size}')
            print(dest,output.size,Path(dest).stat().st_size,'bytes')
          PY
      - name: Guardar imágenes de tamaño original en el demo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/demos/casa-brownie/assets/regalos-bolsa-y-cajas.webp public/demos/casa-brownie/assets/regalo-lazo-rosa.webp
          git diff --cached --quiet || git commit -m "Casa Brownie: sustituir fotos borrosas por originales nítidos"
          git push

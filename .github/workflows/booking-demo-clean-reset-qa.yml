name: Public Booking Demo Clean Reset QA
on:
  pull_request:
    paths:
      - 'public/lead-private-preview.html'
      - 'public/assets/tle-demo-hero-portal.css'
      - 'public/assets/tle-demo-hero-portal.js'
      - 'public/assets/tle-demo-horizontal-story.js'
      - 'public/assets/tle-demo-work-gallery.css'
      - 'public/assets/tle-demo-work-gallery.js'
      - 'scripts/qa-booking-work-gallery.mjs'
      - 'public/assets/tle-booking-bubbles-continuity.css'
      - 'public/assets/drive-booking-journey/**'
      - 'scripts/qa-booking-demo-clean-reset.mjs'
  push:
    branches: [main]
    paths:
      - 'public/lead-private-preview.html'
      - 'scripts/qa-booking-demo-clean-reset.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  booking-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: Guard all routes and client isolation
        run: |
          node scripts/qa-route-integrity.mjs --static
          node scripts/qa-public-demo-integrity.mjs
          node --check public/assets/tle-demo-hero-portal.js
          node --check scripts/qa-booking-demo-clean-reset.mjs
          node --check public/assets/tle-demo-work-gallery.js
          node --check scripts/qa-booking-work-gallery.mjs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Prepare six locally hosted, service-matched images
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/build_demo_photo_assets.py
          for image in regular deep move office retail medical; do
            test -s "public/assets/demo-services/$image.webp"
          done
          for image in kitchen-refresh living-space bathroom-detail dining-room bedroom miami-condo sunroom poolside-living office whole-home; do
            test -s "public/assets/demo-work-gallery/$image.webp"
          done
      - name: Build website
        run: |
          bun install
          bun run build
          test -s .output/public/assets/lead-demo/tle-booking-hero-original.webp
          test -s .output/public/booking-demo-reset.html
      - name: Safe private demo checks (no customer data or access bypass)
        run: |
          node scripts/qa-booking-demo-funnel-gate.mjs
          node scripts/qa-booking-demo-depth-bubbles.mjs
          node --check public/assets/tle-demo-horizontal-story.js
          node --check public/assets/tle-demo-work-gallery.js
          echo "Full EN/ES form and photo gallery browser QA requires an authorized private preview. No public sample HTML exists."

name: Demo decorative icon quality
on:
  pull_request:
    paths:
      - 'public/demos/**'
      - 'demo-source/**'
      - 'scripts/qa-demo-no-decorative-icons.mjs'
  workflow_dispatch:
jobs:
  decorative-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decorative symbol and CTA regression
        run: |
          node scripts/qa-demo-no-decorative-icons.mjs
          node --check public/demos/la-vie-in-pink/assets/index-BnbJ7qEi.js
          node --check public/demos/marea-wigs-miami/assets/index-CxF6j5zA.js

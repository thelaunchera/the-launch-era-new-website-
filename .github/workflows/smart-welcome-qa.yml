name: Smart Welcome Booking QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/base-booking.html'
      - 'public/assets/booking-template-live.js'
      - 'public/assets/booking-smart-welcome.*'
      - 'public/command-center/index.html'
      - 'public/command-center/assets/command-center-app.js'
      - 'public/command-center/assets/booking-smart-welcome-editor.*'
      - 'supabase/functions/tle-booking-smart-welcome/**'
      - 'docs/smart-welcome-schema.sql'
      - 'scripts/qa-smart-welcome.mjs'
      - 'scripts/qa-smart-welcome-browser.mjs'
      - '.github/workflows/smart-welcome-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smart-welcome-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Smart Welcome syntax, scope and access checks
        run: node scripts/qa-smart-welcome.mjs
      - name: Existing booking and marketing route integrity
        run: node scripts/qa-route-integrity.mjs --static
      - name: Install isolated Playwright browser
        run: |
          mkdir -p /tmp/tle-sw-qa
          cd /tmp/tle-sw-qa
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          ln -s /tmp/tle-sw-qa/node_modules node_modules
      - name: Fixture browser checks (six viewport widths)
        run: node scripts/qa-smart-welcome-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-welcome-fixture-screenshots
          path: qa-screenshots/smart-welcome-*.png

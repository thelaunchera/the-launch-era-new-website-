name: Starfield accents QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/starfield-accent.*'
      - 'public/assets/tle-starfield-scene.html'
      - 'src/components/editorial-sections.tsx'
      - 'src/routes/es.index.tsx'
      - 'scripts/qa-starfield-browser.mjs'
      - '.github/workflows/starfield-accents-qa.yml'
  workflow_dispatch:
jobs:
  starfield:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node scripts/qa-route-integrity.mjs --static
          node scripts/qa-auth-recovery.mjs
          node scripts/qa-client-release.mjs
          bun install
          bun run build
      - run: |
          mkdir -p /tmp/tle-starfield-browser
          cd /tmp/tle-starfield-browser
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
          ln -sfn /tmp/tle-starfield-browser/node_modules/playwright "$GITHUB_WORKSPACE/node_modules/playwright"
          ln -sfn /tmp/tle-starfield-browser/node_modules/playwright-core "$GITHUB_WORKSPACE/node_modules/playwright-core"
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .output/public >/tmp/tle-starfield-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          QA_URL=http://127.0.0.1:4173 node scripts/qa-starfield-browser.mjs
          QA_URL=http://127.0.0.1:4173 node scripts/qa-home-scroll-hero.mjs --browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tle-starfield-responsive
          path: qa-screenshots/
          if-no-files-found: ignore

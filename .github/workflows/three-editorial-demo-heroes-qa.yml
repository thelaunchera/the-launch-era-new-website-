name: Editorial Demo Heroes Visual QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/demos/golden-grid/**'
      - 'public/demos/ivory-and-bloom/**'
      - 'public/demos/havana-19/**'
      - 'scripts/qa-three-editorial-demo-heroes.mjs'
      - 'scripts/qa-demo-inquiry-mobile.mjs'
      - 'scripts/qa-havana-calendar-webkit-20261108.mjs'
      - 'public/assets/tle-havana-calendar-20261108.js'
      - 'public/assets/tle-havana-calendar-20261108.css'
      - 'scripts/qa-ivory-bloom-calendar-webkit.mjs'
      - '.github/workflows/three-editorial-demo-heroes-qa.yml'
  push:
    branches: [main]
    paths:
      - 'public/demos/golden-grid/**'
      - 'public/demos/ivory-and-bloom/**'
      - 'public/demos/havana-19/**'
      - 'scripts/qa-three-editorial-demo-heroes.mjs'
      - 'scripts/qa-demo-inquiry-mobile.mjs'
      - 'scripts/qa-havana-calendar-webkit-20261108.mjs'
      - 'public/assets/tle-havana-calendar-20261108.js'
      - 'public/assets/tle-havana-calendar-20261108.css'
      - '.github/workflows/three-editorial-demo-heroes-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial-heroes:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify route safety
        run: node scripts/qa-route-integrity.mjs --static
      - name: Install browser
        run: |
          mkdir -p /tmp/tle-hero-qa
          cd /tmp/tle-hero-qa
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium webkit
          cd "$GITHUB_WORKSPACE"
          ln -sfn /tmp/tle-hero-qa/node_modules node_modules
      - name: Check three demos on mobile, tablet and desktop
        run: |
          python3 -m http.server 4191 --bind 127.0.0.1 --directory public >/tmp/tle-hero-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4191/demos/golden-grid/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/qa-three-editorial-demo-heroes.mjs
          node --check scripts/qa-demo-inquiry-mobile.mjs
          node scripts/qa-demo-inquiry-mobile.mjs
          node --check scripts/qa-ivory-bloom-calendar-webkit.mjs
          node scripts/qa-ivory-bloom-calendar-webkit.mjs
          node --check public/assets/tle-havana-calendar-20261108.js
          node --check public/assets/tle-demo-tactile-20261108.js
          node --check scripts/qa-havana-calendar-webkit-20261108.mjs
          node scripts/qa-havana-calendar-webkit-20261108.mjs
      - name: Upload review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-editorial-heroes
          path: qa-screenshots/hero-*.png
          if-no-files-found: ignore

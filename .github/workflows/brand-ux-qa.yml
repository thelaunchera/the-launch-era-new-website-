name: TLE SaaS Design Regression
on:
  push:
    branches: [design/soft-blue-saas-system-20261013 , design/demo-booking-editorial-v7-20261013]
  pull_request:
    paths:
      - 'src/components/site-shell.tsx'
      - 'src/components/editorial-sections.tsx'
      - 'src/routes/es.index.tsx'
      - 'src/routes/__root.tsx'
      - 'public/lead-private-preview.html'
      - 'public/assets/tle-demo-blue-v5.css'
      - 'public/assets/tle-saas-ui-v1.css'
      - 'scripts/qa-brand-ux.mjs'
      - '.github/workflows/brand-ux-qa.yml'
permissions:
  contents: read
concurrency:
  group: tle-brand-ux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Verify site routes and public demo integrity
        run: |
          node scripts/qa-route-integrity.mjs --static
          node scripts/qa-public-demo-integrity.mjs
          node scripts/qa-client-release.mjs
      - name: Install and build
        run: |
          bun install
          bun run build
      - name: Install isolated Chromium browser
        run: |
          mkdir -p /tmp/tle-ux-qa
          cd /tmp/tle-ux-qa
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Test desktop/mobile marketing and public preview
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/tle-ux-qa-server.log 2>&1 &
          for attempt in $(seq 1 35); do
            if curl -sf http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 2
          done
          QA_URL=http://127.0.0.1:4173 PLAYWRIGHT_MODULE=/tmp/tle-ux-qa/node_modules/playwright/index.mjs node scripts/qa-brand-ux.mjs
      - name: Collect screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brand-ui-mobile-desktop
          path: qa-screenshots/brand-ux/
          if-no-files-found: ignore

name: Import verified bundle landing photographs
on:
  push:
    branches: [feature/bundle-sales-landing-human-20261014]
    paths: [.github/workflows/import-bundle-photos.yml]
permissions:
  contents: write
jobs:
  import-approved-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bundle-sales-landing-human-20261014
          persist-credentials: true
      - name: Save verified customer-approved image generations into the active repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/bundle-landing
          curl -fL --retry 3 --connect-timeout 15 --max-time 90 "https://d2ol7oe51mr4n9.cloudfront.net/user_3FC9GcVebQE6WAxiCP5Hh9w95GF/3177e224-9f86-4f61-a5bb-8416208bfd87.png" -o public/assets/bundle-landing/bundle-hero.png
          test "$(wc -c < public/assets/bundle-landing/bundle-hero.png)" -eq 2108152
          echo '4ccd9d0e13f0457526e4847949ec4d206ae50babd983b50a26eb0665a8c84ac4  public/assets/bundle-landing/bundle-hero.png' | sha256sum -c -
          curl -fL --retry 3 --connect-timeout 15 --max-time 90 "https://d2ol7oe51mr4n9.cloudfront.net/user_3FC9GcVebQE6WAxiCP5Hh9w95GF/158f47b3-4143-4896-a3a5-0f380bb3540c.png" -o public/assets/bundle-landing/bundle-booking.png
          test "$(wc -c < public/assets/bundle-landing/bundle-booking.png)" -eq 2068715
          echo 'da4336ffe3baa9bc3a5fab31b0a010b4f8b80ffa32e2e9f8602f8908e337e2e7  public/assets/bundle-landing/bundle-booking.png' | sha256sum -c -
          curl -fL --retry 3 --connect-timeout 15 --max-time 90 "https://d2ol7oe51mr4n9.cloudfront.net/user_3FC9GcVebQE6WAxiCP5Hh9w95GF/da59ef92-d94d-4ae4-ace9-3feacfe5e1e4.png" -o public/assets/bundle-landing/bundle-command.png
          test "$(wc -c < public/assets/bundle-landing/bundle-command.png)" -eq 2102496
          echo 'c38b643c2943cf7943cfaa5c2f2917bfbe90aa3502c6af276662b5fd1625e008  public/assets/bundle-landing/bundle-command.png' | sha256sum -c -
          curl -fL --retry 3 --connect-timeout 15 --max-time 90 "https://d2ol7oe51mr4n9.cloudfront.net/user_3FC9GcVebQE6WAxiCP5Hh9w95GF/2265ab6e-2a55-4e77-940c-2fbf4414fb3e.png" -o public/assets/bundle-landing/bundle-ai.png
          test "$(wc -c < public/assets/bundle-landing/bundle-ai.png)" -eq 1994029
          echo '330352a78db180ae7e5069131c117de05b8b4a5e4898b96f52854bb6a9b3a303  public/assets/bundle-landing/bundle-ai.png' | sha256sum -c -
          git config user.name "TLE Bundle Asset Import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/bundle-landing/*.png
          git commit -m "assets(bundle): import four verified human-centered photos [skip ci]"
          git push origin HEAD:feature/bundle-sales-landing-human-20261014

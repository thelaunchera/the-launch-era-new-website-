name: Customer web assistant review
on:
  pull_request:
    paths:
      - 'public/assets/tle-customer-assistant.*'
      - 'public/base-booking.html'
      - 'public/lead-private-preview.html'
      - 'public/command-center/assets/command-center-app.js'
      - 'supabase/functions/tle-customer-assistant/**'
      - 'supabase/migrations/*customer_web_assistant.sql'
      - 'scripts/qa-customer-assistant*.mjs'
      - '.github/workflows/customer-assistant-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and existing tenant routes
        run: |
          node --check public/assets/tle-customer-assistant.js
          node --check public/command-center/assets/command-center-app.js
          node scripts/qa-customer-assistant.mjs
          node scripts/qa-route-integrity.mjs --static
          node scripts/qa-auth-recovery.mjs
          node scripts/qa-client-release.mjs
      - name: Install isolated browser tools
        run: |
          npm install --prefix /tmp/tle-assistant-pw --no-save --package-lock=false playwright@1.56.1
          node /tmp/tle-assistant-pw/node_modules/playwright/cli.js install --with-deps chromium
      - name: Test bilingual review and safe retries on five viewports
        env:
          PLAYWRIGHT_MODULE: /tmp/tle-assistant-pw/node_modules/playwright/index.mjs
        run: node scripts/qa-customer-assistant-browser.mjs
      - name: Save synthetic review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-assistant-synthetic-qa
          path: /tmp/customer-assistant-*.png
          retention-days: 7

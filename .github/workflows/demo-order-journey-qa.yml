name: Demo cart and confirmation QA
on:
  push:
    branches: [main]
    paths:
      - "public/assets/tle-demo-original-prices-20261108.js"
      - "public/assets/tle-demo-order-journey-20261108.js"
      - "public/demos/casa-brownie/index.html"
      - "public/demos/crumb/index.html"
      - "public/demos/golden-grid/index.html"
      - "public/demos/havana-19/index.html"
      - "public/demos/la-vie-in-pink/index.html"
      - "src/test/demo-order-journey.test.ts"
      - ".github/workflows/demo-order-journey-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-only-checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse the shared script
        run: node --check public/assets/tle-demo-order-journey-20261108.js
      - name: Verify every supported main-site ordering demo uses the same journey
        run: |
          for slug in casa-brownie crumb golden-grid havana-19 la-vie-in-pink; do
            grep -q 'tle-demo-order-journey-20261108.js' "public/demos/$slug/index.html"
          done
      - name: Install test dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Verify bag, checkout, review, delivery fields and demo receipt
        run: npm run test -- src/test/demo-order-journey.test.ts

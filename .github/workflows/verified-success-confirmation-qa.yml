name: Verified Success Confirmation QA
on:
  pull_request:
    paths:
      - 'src/components/success-confirmation.*'
      - 'src/components/editorial-sections.tsx'
      - 'src/routes/es.index.tsx'
      - 'src/components/freebie-page.tsx'
      - 'scripts/qa-marketing-cta-motion.mjs'
      - 'scripts/qa-verified-success.mjs'
      - 'supabase/migrations/20261016143000_fix_tle_crm_capture_goal_guard.sql'
      - '.github/workflows/verified-success-confirmation-qa.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/success-confirmation.*'
      - 'src/components/editorial-sections.tsx'
      - 'src/routes/es.index.tsx'
      - 'src/components/freebie-page.tsx'
      - 'scripts/qa-marketing-cta-motion.mjs'
      - 'scripts/qa-verified-success.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check page boundaries and truthful confirmation
        run: |
          node scripts/qa-verified-success.mjs
          node scripts/qa-marketing-cta-motion.mjs
          node scripts/qa-route-integrity.mjs --static
          node scripts/qa-client-release.mjs
      - name: Compile live marketing routes
        run: |
          bun install
          bun run build
      - name: Install Chromium for 5-width EN/ES browser tests
        run: |
          mkdir -p /tmp/tle-success-qa
          cd /tmp/tle-success-qa
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
          ln -sfn /tmp/tle-success-qa/node_modules/playwright "$GITHUB_WORKSPACE/node_modules/playwright"
          ln -sfn /tmp/tle-success-qa/node_modules/playwright-core "$GITHUB_WORKSPACE/node_modules/playwright-core"
      - name: Verify mocked success and rejection flows
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .output/public >/tmp/tle-success.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          QA_URL=http://127.0.0.1:4173 node scripts/qa-marketing-cta-motion.mjs --browser

name: Booking demo premium Drive-photo regression
on:
  pull_request:
    paths:
      - 'public/lead-private-preview.html'
      - 'public/assets/tle-demo-luxury-v48.css'
      - 'public/assets/tle-demo-luxury-v48.js'
      - 'public/assets/drive-house-gallery/**'
      - 'scripts/qa-demo-luxury-v48.mjs'
      - '.github/workflows/booking-demo-luxury-v48-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  premium-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Syntax, sample isolation and production build
        run: |
          node --check public/assets/tle-demo-luxury-v48.js
          node --check scripts/qa-demo-luxury-v48.mjs
          node scripts/qa-demo-luxury-v48.mjs
          node scripts/qa-public-demo-integrity.mjs
          bun install
          bun run build
      - name: Install headless browser
        run: |
          mkdir -p /tmp/tle-v48-pw
          cd /tmp/tle-v48-pw
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Phone, tablet, desktop, EN/ES, quote CTA and private tenant protection
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .output/public >/tmp/tle-v48.log 2>&1 &
          for n in $(seq 1 45); do
            if curl -sf http://127.0.0.1:4173/lead-private-preview.html >/dev/null; then break; fi
            sleep 2
          done
          QA_URL=http://127.0.0.1:4173 PLAYWRIGHT_MODULE=/tmp/tle-v48-pw/node_modules/playwright/index.mjs node scripts/qa-demo-luxury-v48.mjs

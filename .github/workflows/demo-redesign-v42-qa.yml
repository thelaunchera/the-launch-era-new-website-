name: Demo Service Redesign QA
on:
  push:
    branches: [main]
    paths:
      - 'public/assets/tle-demo-redesign-v42.js'
      - 'public/assets/tle-demo-redesign-v42.css'
      - 'public/assets/tle-demo-booking-ink-v43.js'
      - 'public/assets/tle-demo-booking-ink-v43.css'
      - 'public/assets/tle-demo-magical-clean-v27.js'
      - 'public/assets/tle-demo-stack-nav-v38.css'
      - 'scripts/qa-demo-redesign-v42.mjs'
      - '.github/workflows/demo-redesign-v42-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Static route and tenant isolation
        run: |
          node scripts/qa-route-integrity.mjs --static
          node scripts/qa-public-demo-integrity.mjs
          node --check public/assets/tle-demo-redesign-v42.js
          node --check public/assets/tle-demo-booking-ink-v43.js
      - name: Install local browser
        run: |
          bun install
          mkdir -p /tmp/tle-redesign-browser
          cd /tmp/tle-redesign-browser
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Verify hero window, service cards, date step and customer separation
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/tle-redesign-v42.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:4173/lead-private-preview.html >/dev/null; then break; fi
            sleep 2
          done
          QA_URL=http://127.0.0.1:4173 PLAYWRIGHT_MODULE=/tmp/tle-redesign-browser/node_modules/playwright/index.mjs node scripts/qa-demo-redesign-v42.mjs

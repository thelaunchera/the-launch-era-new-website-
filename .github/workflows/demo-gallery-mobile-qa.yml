name: TLE Demo Gallery mobile and preview QA

on:
  push:
    branches: [main]
    paths:
      - 'public/demos/index.html'
      - 'scripts/qa-demo-gallery-mobile.mjs'
      - 'scripts/qa-owner-bilingual-browser.mjs'
      - '.github/workflows/demo-gallery-mobile-qa.yml'
  pull_request:
    paths:
      - 'public/demos/index.html'
      - 'scripts/qa-demo-gallery-mobile.mjs'
      - 'scripts/qa-owner-bilingual-browser.mjs'
      - '.github/workflows/demo-gallery-mobile-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check QA script syntax
        run: |
          node --check scripts/qa-demo-gallery-mobile.mjs
          node --check scripts/qa-owner-bilingual-browser.mjs
      - name: Install isolated browser test tooling
        run: |
          mkdir -p /tmp/tle-gallery-mobile
          npm install --no-audit --no-fund --prefix /tmp/tle-gallery-mobile playwright@1.57.0
          /tmp/tle-gallery-mobile/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p "$GITHUB_WORKSPACE/node_modules"
          ln -sfn /tmp/tle-gallery-mobile/node_modules/playwright "$GITHUB_WORKSPACE/node_modules/playwright"
          ln -sfn /tmp/tle-gallery-mobile/node_modules/playwright-core "$GITHUB_WORKSPACE/node_modules/playwright-core"
      - name: Run iPhone-size gallery and project preview interactions
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory public > /tmp/tle-gallery-mobile.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/demos/ >/dev/null; then break; fi
            sleep 1
          done
          QA_URL=http://127.0.0.1:4173 node scripts/qa-demo-gallery-mobile.mjs
          QA_URL=http://127.0.0.1:4173 node scripts/qa-owner-bilingual-browser.mjs
      - name: Keep screenshots for design QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-gallery-mobile-screenshots
          path: qa-screenshots/demo-gallery/
          if-no-files-found: ignore

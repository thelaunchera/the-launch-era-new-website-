name: Owner Order Readiness QA
on:
  push:
    branches: [main]
    paths:
      - 'public/command-center/index.html'
      - 'public/command-center/assets/command-center-app.js'
      - 'scripts/qa-owner-order-control.mjs'
      - 'scripts/qa-owner-order-watchdog.mjs'
      - 'scripts/qa-owner-order-practice.mjs'
      - 'public/command-center/order-practice/index.html'
      - 'supabase/migrations/20261015135000_tle_ai_team_order_blocker_watch.sql'
      - 'supabase/migrations/20261015151000_tle_owner_bundle_queue_linked_ai.sql'
      - 'supabase/migrations/20261015153000_tle_ai_team_bundle_stall_watch.sql'
      - '.github/workflows/owner-order-readiness-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate owner order screen and no-send behavior
        run: |
          node scripts/qa-owner-order-control.mjs
          node scripts/qa-owner-order-watchdog.mjs
          node scripts/qa-owner-order-practice.mjs
          node --check public/command-center/assets/command-center-app.js

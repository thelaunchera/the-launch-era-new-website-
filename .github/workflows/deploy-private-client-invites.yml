name: Deploy private client invitation backend

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/tle-booking-owner-studio/**'
      - '.github/workflows/deploy-private-client-invites.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tle-booking-owner-studio-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy owner studio after private-route QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: jessie-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: bowacxhmjvrqixtwaikv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate invitation URLs and twelve-hour policy
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa-private-client-session-12h.mjs
          node scripts/qa-auth-recovery.mjs
      - name: Require existing deployment authorization
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Deployment token unavailable. Nothing deployed."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy ONLY the existing owner-studio function
        shell: bash
        run: |
          # Preserve its existing gateway behavior (verify_jwt=false).
          # Owner actions are authenticated and authorized inside the Edge Function.
          supabase functions deploy tle-booking-owner-studio --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
      - name: Note release verification requirement
        if: always()
        run: |
          echo "Owner Studio deployment requires post-release source check, no actual invitation sent." >> "$GITHUB_STEP_SUMMARY"
          echo "Independent QA must verify a synthetic invitation targets /command-center/?from=private-access." >> "$GITHUB_STEP_SUMMARY"

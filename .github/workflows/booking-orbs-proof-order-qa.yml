name: Booking Sky Orbs and Proof Order QA
on:
  pull_request:
    paths:
      - 'public/booking-demo-reset.html'
      - 'public/assets/tle-booking-blue-orbs.css'
      - 'scripts/qa-booking-orbs-and-proof-order.mjs'
      - '.github/workflows/booking-orbs-proof-order-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Validate routes and customer isolation
        run: |
          node scripts/qa-route-integrity.mjs --static
          node scripts/qa-public-demo-integrity.mjs
          node --check scripts/qa-booking-orbs-and-proof-order.mjs
      - name: Build photos and public website
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/build_demo_photo_assets.py
          bun install
          bun run build
          test -s .output/public/assets/tle-booking-blue-orbs.css
      - name: Install Chromium
        run: |
          mkdir -p /tmp/tle-orbs-qa
          cd /tmp/tle-orbs-qa
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
          ln -sfn /tmp/tle-orbs-qa/node_modules/playwright "$GITHUB_WORKSPACE/node_modules/playwright"
          ln -sfn /tmp/tle-orbs-qa/node_modules/playwright-core "$GITHUB_WORKSPACE/node_modules/playwright-core"
      - name: Test EN ES quote, orbs, proof, robot and form
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .output/public >/tmp/tle-orbs.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/booking-demo-reset.html >/dev/null; then break; fi
            sleep 1
          done
          QA_URL=http://127.0.0.1:4173 node scripts/qa-booking-orbs-and-proof-order.mjs

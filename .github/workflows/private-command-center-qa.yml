name: Private Command Center Access QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/command-center/**'
      - 'supabase/functions/tle-booking-owner-studio/**'
      - 'scripts/qa-private-client-session-12h.mjs'
      - '.github/workflows/private-command-center-qa.yml'
  push:
    branches: [main]
    paths:
      - 'public/command-center/**'
      - 'supabase/functions/tle-booking-owner-studio/**'
      - 'scripts/qa-private-client-session-12h.mjs'
      - '.github/workflows/private-command-center-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-client-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check private reauthentication and invite links
        run: |
          node --check public/command-center/assets/private-session-policy.js
          node --check public/command-center/assets/command-center-app.js
          node --check public/command-center/assets/ai-team.js
          node scripts/qa-private-client-session-12h.mjs
          node scripts/qa-auth-recovery.mjs
          node scripts/qa-route-integrity.mjs --static
      - name: Check Pages production build
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build
      - name: Check final built customer links and timeout guard
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa-private-client-session-12h.mjs
          test -s .output/public/command-center/assets/private-session-policy.js
          test -s .output/public/command-center/index.html
          test -s .output/public/command-center/ai-team.html
          grep -q 'private-session-policy.js' .output/public/command-center/index.html
          grep -q 'private-session-policy.js' .output/public/command-center/ai-team.html
          echo "Private sign-in and 12h UI guard checked. No buyer invites or emails sent."

name: Motion Heroes Video QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hero-cinematic-motion-qa.yml'
      - 'public/assets/tle-hero-cinematic-20261108.js'
      - 'scripts/qa-hero-cinematic-20261108.mjs'
      - 'public/demos/**/media/hero-motion-20261108.mp4'
      - 'public/experience-cleaning/media/hero-motion-20261108.mp4'
  workflow_run:
    workflows: ['Deploy website to GitHub Pages']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-video-and-cursor:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Guard approved animated heroes and CRUMB still image
        run: |
          set -euo pipefail
          # Only these three canonical demos currently mount the shared video layer.
          for s in casa-brownie ivory-and-bloom marea-wigs-miami; do
            test -s "public/demos/$s/media/hero-motion-20261108.mp4"
            test -s "public/demos/$s/media/hero-motion-poster-hq.webp"
            grep -q 'tle-hero-cinematic-20261108.js' "public/demos/$s/index.html"
          done
          # Other approved animations have independent hero implementations.
          for s in golden-grid aftr sova lavender-edit; do
            test -s "public/demos/$s/media/hero-motion-20261108.mp4"
          done
          test -s public/experience-cleaning/media/hero-motion-20261108.mp4
          # CRUMB is explicitly still: do not reinstate its retired motion.
          if grep -q 'tle-hero-cinematic-20261108.js' public/demos/crumb/index.html; then
            echo "::error::CRUMB must retain its approved still hero"
            exit 1
          fi
          node --check public/assets/tle-hero-cinematic-20261108.js
          node --check scripts/qa-hero-cinematic-20261108.mjs
      - name: Install isolated browser dependencies
        run: |
          mkdir -p /tmp/tle-motion-qa
          cd /tmp/tle-motion-qa
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE/node_modules"
          ln -sfn /tmp/tle-motion-qa/node_modules/playwright "$GITHUB_WORKSPACE/node_modules/playwright"
          ln -sfn /tmp/tle-motion-qa/node_modules/playwright-core "$GITHUB_WORKSPACE/node_modules/playwright-core"
      - name: Verify original hero playback, touch-safe layering and reduced motion
        run: |
          set -euo pipefail
          python3 -m http.server 4188 --bind 127.0.0.1 --directory public > /tmp/tle-motion-preview.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4188/demos/casa-brownie/ >/dev/null; then break; fi
            sleep 1
          done
          QA_URL=http://127.0.0.1:4188 node scripts/qa-hero-cinematic-20261108.mjs
      - name: Save visual results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-heroes-six-visual-proof
          path: qa-screenshots/motion-20261108/
          if-no-files-found: ignore

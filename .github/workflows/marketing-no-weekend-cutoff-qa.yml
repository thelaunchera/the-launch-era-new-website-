name: Public service copy — no weekend cutoffs
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/routes/**'
      - 'src/components/**'
      - 'public/**/*.html'
      - 'scripts/qa-no-weekend-cutoffs.mjs'
      - '.github/workflows/marketing-no-weekend-cutoff-qa.yml'
  push:
    branches: [main]
    paths:
      - 'src/routes/**'
      - 'src/components/**'
      - 'public/**/*.html'
      - 'scripts/qa-no-weekend-cutoffs.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bilingual service copy and preserved checkouts
        run: |
          node --check scripts/qa-no-weekend-cutoffs.mjs
          node scripts/qa-no-weekend-cutoffs.mjs
          node scripts/qa-home-booking-tones.mjs
          node scripts/qa-route-integrity.mjs --static

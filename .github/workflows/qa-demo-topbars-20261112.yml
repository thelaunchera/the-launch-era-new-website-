name: Demo topbars — compact and bilingual browser QA
on:
  pull_request:
    paths:
      - public/demos/**
      - public/assets/tle-demo-header-controls-20261112.js
      - scripts/qa-demo-header-controls.mjs
      - scripts/qa-demo-topbars-browser-20261112.mjs
      - .github/workflows/qa-demo-topbars-20261112.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  header:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: thelaunchera/demo-booking-landing-
          ref: fix/demo-topbars-20261112-secondary
          path: fixtures/secondary
      - uses: actions/checkout@v4
        with:
          repository: thelaunchera/demo-booking-landing-
          ref: fix/demo-topbars-20261112-jaramillo
          path: fixtures/jaramillo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix fixtures/browser --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: |
          node scripts/qa-demo-header-controls.mjs
          node scripts/qa-route-integrity.mjs --static
      - run: node scripts/qa-demo-topbars-browser-20261112.mjs
        env:
          BROWSER: ${{ matrix.browser }}
          SECONDARY_ROOT: fixtures/secondary
          JARAMILLO_ROOT: fixtures/jaramillo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-topbars-${{ matrix.browser }}
          path: qa-artifacts/demo-topbars/

name: CRUMB demo QA
on:
  pull_request:
    paths:
      - 'public/demos/crumb/**'
      - 'scripts/qa-crumb*.mjs'
      - '.github/workflows/crumb-demo-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-crumb:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies from existing Bun lockfile
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check demo JavaScript
        run: node --check public/demos/crumb/main.js
      - name: Test CRUMB builder, accessibility and content guards
        run: node scripts/qa-crumb-demo.mjs
      - name: Check static route integrity
        run: node scripts/qa-route-integrity.mjs --static
      - name: Install browsers for responsive CRUMB regression
        run: |
          mkdir -p /tmp/tle-crumb-responsive
          npm install --prefix /tmp/tle-crumb-responsive --no-package-lock --no-audit --no-fund playwright@1.57.0
          ln -s /tmp/tle-crumb-responsive/node_modules/playwright node_modules/playwright
          /tmp/tle-crumb-responsive/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Verify section boundaries and gift builder in Chromium and WebKit
        run: node scripts/qa-crumb-responsive.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crumb-responsive-sections
          path: qa-screenshots/crumb


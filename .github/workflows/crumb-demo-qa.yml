name: CRUMB demo QA
on:
  pull_request:
    paths:
      - 'public/demos/crumb/**'
      - 'scripts/qa-crumb-demo.mjs'
      - '.github/workflows/crumb-demo-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-crumb:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies for jsdom
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check demo JavaScript
        run: node --check public/demos/crumb/main.js
      - name: Test CRUMB builder, accessibility and content guards
        run: node scripts/qa-crumb-demo.mjs
      - name: Check static route integrity
        run: node scripts/qa-route-integrity.mjs --static

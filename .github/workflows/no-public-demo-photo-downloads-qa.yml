name: Public demo photos — no downloads
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/demos/**'
      - 'demo-source/**'
      - 'public/portfolio/**'
      - 'public/experience-cleaning/**'
      - 'public/sample-cleaning/**'
      - 'scripts/qa-no-public-demo-photo-downloads-20261110.mjs'
      - 'scripts/qa-demo-photo-preview-browser-20261110.mjs'
      - '.github/workflows/no-public-demo-photo-downloads-qa.yml'
  push:
    branches: [main]
    paths:
      - 'public/demos/sova/**'
      - 'demo-source/sova/**'
      - 'scripts/qa-no-public-demo-photo-downloads-20261110.mjs'
      - 'scripts/qa-demo-photo-preview-browser-20261110.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-no-photo-downloads:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public demo photo-download regression
        run: |
          node --check scripts/qa-no-public-demo-photo-downloads-20261110.mjs
          node scripts/qa-no-public-demo-photo-downloads-20261110.mjs
          node scripts/qa-route-integrity.mjs --static
          node --check demo-source/sova/src/site.js
          node --check public/demos/sova/assets/index-C3ToK82y.js
  iphone-photo-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser engines
        run: |
          mkdir -p /tmp/tle-photo-preview-qa
          npm install --no-audit --no-fund --prefix /tmp/tle-photo-preview-qa playwright@1.57.0
          /tmp/tle-photo-preview-qa/node_modules/.bin/playwright install --with-deps chromium webkit
          mkdir -p node_modules
          ln -sfn /tmp/tle-photo-preview-qa/node_modules/playwright node_modules/playwright
          ln -sfn /tmp/tle-photo-preview-qa/node_modules/playwright-core node_modules/playwright-core
      - name: Test iPhone-sized gallery navigation and absence of downloads in EN/ES
        run: |
          python3 -m http.server 4198 --bind 127.0.0.1 --directory public >/tmp/tle-photo-preview-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:4198/demos/sova/ >/dev/null; then break; fi
            sleep 1
          done
          QA_URL=http://127.0.0.1:4198 node scripts/qa-demo-photo-preview-browser-20261110.mjs

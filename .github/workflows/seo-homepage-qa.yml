name: Published Homepage SEO QA
on:
  pull_request:
    paths:
      - 'scripts/prepare-homepage-seo.mjs'
      - 'scripts/qa-production-homepage-seo.mjs'
      - '.github/workflows/pages.yml'
      - '.github/workflows/seo-homepage-qa.yml'
  workflow_dispatch:

jobs:
  home-identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate homepage SEO scripts
        run: |
          node --check scripts/prepare-homepage-seo.mjs
          node --check scripts/qa-production-homepage-seo.mjs
          node scripts/prepare-homepage-seo.mjs --check
          node scripts/qa-production-homepage-seo.mjs
      - name: Verify unchanged demo and route boundaries
        run: node scripts/qa-route-integrity.mjs --static

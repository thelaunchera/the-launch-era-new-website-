name: Homepage Process Shared Element QA
on:
  pull_request:
    paths:
      - 'src/components/process-view-transitions.*'
      - 'src/components/editorial-sections.tsx'
      - 'src/routes/es.index.tsx'
      - 'src/test/process-view-transitions.test.tsx'
      - 'scripts/qa-process-view-transitions*'
      - '.github/workflows/process-view-transitions-qa.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/process-view-transitions.*'
      - 'src/components/editorial-sections.tsx'
      - 'src/routes/es.index.tsx'
      - 'src/test/process-view-transitions.test.tsx'
      - 'scripts/qa-process-view-transitions*'
      - '.github/workflows/process-view-transitions-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard native transition behavior and unrelated routes
        run: |
          node scripts/qa-process-view-transitions.mjs
          node scripts/qa-route-integrity.mjs --static
          node scripts/qa-client-release.mjs
      - name: Build and test actual React integration
        run: |
          bun install
          bun run test -- src/test/process-view-transitions.test.tsx
          bun run build
      - name: Install isolated Chromium
        run: |
          mkdir -p /tmp/tle-process-qa
          cd /tmp/tle-process-qa
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
          ln -sfn /tmp/tle-process-qa/node_modules/playwright "$GITHUB_WORKSPACE/node_modules/playwright"
          ln -sfn /tmp/tle-process-qa/node_modules/playwright-core "$GITHUB_WORKSPACE/node_modules/playwright-core"
      - name: Verify EN/ES on phone tablet and desktop
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .output/public >/tmp/tle-process-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          QA_URL=http://127.0.0.1:4173 node scripts/qa-process-view-transitions-browser.mjs

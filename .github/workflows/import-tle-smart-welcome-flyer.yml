name: Import approved TLE Smart Welcome flyer
on:
  push:
    branches: [feature/tle-smart-welcome-bundle-flyer-20261014]
    paths: [.github/workflows/import-tle-smart-welcome-flyer.yml]
permissions:
  contents: write
jobs:
  import-approved-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tle-smart-welcome-bundle-flyer-20261014
          persist-credentials: true
      - name: Import unchanged user-approved final flyer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/promo
          curl -fL --retry 3 --connect-timeout 15 --max-time 90 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3FC9GcVebQE6WAxiCP5Hh9w95GF/ba283bec-8a25-4697-be0f-9558a147213b.jpg' \
            -o public/assets/promo/tle-smart-welcome-bundle-flyer.jpg
          test "$(wc -c < public/assets/promo/tle-smart-welcome-bundle-flyer.jpg)" -eq 438992
          echo '4b81811c533c735b755bfcb960c71d470f060265289b5bce19ad186873a97ce3  public/assets/promo/tle-smart-welcome-bundle-flyer.jpg' | sha256sum -c -
          git config user.name "TLE Approved Asset Import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/promo/tle-smart-welcome-bundle-flyer.jpg
          git commit -m "asset(promo): import approved Smart Welcome bundle flyer unchanged [skip ci]"
          git push origin HEAD:feature/tle-smart-welcome-bundle-flyer-20261014

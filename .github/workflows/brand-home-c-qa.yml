name: TLE Brand C Home Preview QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/assets/tle-editorial-refresh.css'
      - 'scripts/qa-brand-home-c.mjs'
      - '.github/workflows/brand-home-c-qa.yml'
permissions:
  contents: read
jobs:
  brand-home:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static protection: branding, assets and route safety
        run: |
          node --check scripts/qa-brand-home-c.mjs
          node scripts/qa-brand-home-c.mjs
          node scripts/qa-route-integrity.mjs --static
      - name: Build the isolated public website
        run: |
          bun install
          bun run build
          test -s .output/public/index.html
          test -s .output/public/es/index.html
      - name: Install isolated Chromium
        run: |
          mkdir -p /tmp/tle-brand-home-qa
          cd /tmp/tle-brand-home-qa
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Browser: soft-blue CTA and intact photo at mobile, tablet, desktop
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .output/public >/tmp/tle-brand-home-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          QA_URL=http://127.0.0.1:4173 PLAYWRIGHT_MODULE=/tmp/tle-brand-home-qa/node_modules/playwright/index.mjs node scripts/qa-brand-home-c.mjs --browser

name: Booking Month and Wheel QA
on:
  pull_request:
    paths:
      - 'public/booking-demo-reset.html'
      - 'public/assets/tle-booking-month-wheel.js'
      - 'public/assets/tle-booking-month-wheel.css'
      - 'public/assets/tle-demo-reset-lead-magnet.js'
      - 'scripts/qa-booking-month-wheel.mjs'
      - '.github/workflows/booking-month-wheel-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample-calendar-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Verify routes, JS and private customer isolation
        run: |
          node --check public/assets/tle-booking-month-wheel.js
          node --check scripts/qa-booking-month-wheel.mjs
          node scripts/qa-route-integrity.mjs --static
          node scripts/qa-public-demo-integrity.mjs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build website without affecting paid-client templates
        run: |
          bun install
          bun run build
          test -s .output/public/booking-demo-reset.html
          test -s .output/public/assets/tle-booking-month-wheel.js
      - name: Chromium
        run: |
          mkdir -p /tmp/tle-wheel
          cd /tmp/tle-wheel
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
          ln -sfn /tmp/tle-wheel/node_modules/playwright "$GITHUB_WORKSPACE/node_modules/playwright"
          ln -sfn /tmp/tle-wheel/node_modules/playwright-core "$GITHUB_WORKSPACE/node_modules/playwright-core"
      - name: Test calendar, iPhone wheel, keyboard, dialog and sample tracker
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .output/public > /tmp/tle-wheel.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/booking-demo-reset.html >/dev/null; then break; fi
            sleep 1
          done
          QA_URL=http://127.0.0.1:4173 node scripts/qa-booking-month-wheel.mjs

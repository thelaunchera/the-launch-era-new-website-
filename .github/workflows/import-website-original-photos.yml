name: Import verified original website photos
on:
  push:
    paths:
      - 'scripts/import-website-original-photos.mjs'
      - '.github/workflows/import-website-original-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import and verify the original seven photos
        run: node scripts/import-website-original-photos.mjs
      - name: Commit verified originals to GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/website-packages-20261105/*-original.jpg
          if git diff --cached --quiet; then
            echo "All original photos already committed."
          else
            git commit -m "Store seven high-resolution website photos (hero unchanged)"
            git push origin HEAD:main
          fi

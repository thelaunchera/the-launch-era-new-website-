name: Knockout Deli menu build and pickup QA

on:
  pull_request:
    paths:
      - 'demo-source/knockout-deli/**'
      - 'scripts/build-knockout-deli-public.mjs'
      - 'scripts/refresh-knockout-menu.mjs'
      - 'scripts/upgrade-knockout-pickup.mjs'
      - 'scripts/qa-knockout-deli-preview.mjs'
      - 'scripts/qa-knockout-menu-redesign.mjs'
      - 'scripts/qa-knockout-pickup-browser.mjs'
      - 'public/demos/knockout-deli/admin-panel/**'
      - 'scripts/qa-knockout-admin-panel.mjs'
      - 'scripts/qa-knockout-admin-browser.mjs'
      - '.github/workflows/qa-knockout-menu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-menu-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unpack approved Knockout Deli demo
        run: |
          mkdir -p /tmp/knockout-demo-qa
          unzip -q demo-source/knockout-deli/Knockout-Deli-website-bundle.zip -d /tmp/knockout-demo-qa
      - name: Build standalone branded website and digital menu
        run: node scripts/build-knockout-deli-public.mjs /tmp/knockout-demo-qa
      - name: Validate menu, client-safe pickup, and customization variants
        run: |
          node scripts/qa-knockout-deli-preview.mjs /tmp/knockout-demo-qa
          node scripts/qa-knockout-menu-redesign.mjs /tmp/knockout-demo-qa
      - name: Check branded Admin Panel, official menu prices and safe demo scope
        run: node scripts/qa-knockout-admin-panel.mjs /tmp/knockout-demo-qa
      - name: Confirm compiled responsive CSS
        run: |
          grep -q 'pickup-option-switch' /tmp/knockout-demo-qa/menu-redesign.css
          grep -q 'km-customizer' /tmp/knockout-demo-qa/app.js
          grep -q 'km-preview-options' /tmp/knockout-demo-qa/window-order.js
      - name: Install isolated Chromium for pickup visual QA
        shell: bash
        run: |
          mkdir -p /tmp/tle-knockout-playwright
          cd /tmp/tle-knockout-playwright
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
          mkdir -p "$GITHUB_WORKSPACE/node_modules"
          ln -sfn /tmp/tle-knockout-playwright/node_modules/playwright "$GITHUB_WORKSPACE/node_modules/playwright"
          ln -sfn /tmp/tle-knockout-playwright/node_modules/playwright-core "$GITHUB_WORKSPACE/node_modules/playwright-core"
      - name: Browser-check product customization and bag in 4 viewport sizes
        run: node scripts/qa-knockout-pickup-browser.mjs /tmp/knockout-demo-qa
      - name: Browser-check Admin Panel product edits, events, alerts and responsive UI
        run: node scripts/qa-knockout-admin-browser.mjs /tmp/knockout-demo-qa
      - name: Save device QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knockout-pickup-responsive-qa
          path: qa-screenshots/knockout-*.png
          if-no-files-found: warn
